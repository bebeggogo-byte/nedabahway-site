name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/**"
      - "_build/**"
      - "resources/_build/**"
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"  # 03:00 KST 매일

jobs:
  lighthouse:
    name: Lighthouse Performance · A11y · SEO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
