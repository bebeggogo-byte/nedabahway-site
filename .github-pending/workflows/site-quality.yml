name: Site Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate feed.json + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Validate feed.json schema
        run: python3 resources/_build/validate.py

      - name: Render all (dry verify)
        working-directory: resources
        run: python3 _build/render_all.py

  link-check:
    name: Broken Link Check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --no-progress
            --max-concurrency 8
            --accept 200,204,301,302,403,429
            --exclude-mail
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            './**/*.html'
            './**/*.md'
          fail: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lychee-report
          path: .lycheecache
          retention-days: 14

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  html-validate:
    name: HTML Validate (htmlhint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install htmlhint
        run: npm install -g htmlhint@1.x

      - name: Lint HTML
        run: |
          htmlhint \
            --ignore "node_modules/**,_archive_v2/**,_archive_magazine_old/**,blog/perspective/_archive_v2_20/**,blog/perspective/perspective_old_129/**" \
            "*.html" "blog/**/*.html" "resources/**/*.html"
        continue-on-error: true

  private-keyword-gate:
    name: Private Keyword Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run keyword gate (strict)
        run: |
          if [ -f scripts/check_private_keywords.py ]; then
            python3 scripts/check_private_keywords.py --strict
          else
            echo "::warning::scripts/check_private_keywords.py not found, skipping"
          fi
