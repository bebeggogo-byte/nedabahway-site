<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>IDEN 진로 좌표 진단 — 네다바웨이</title>
<meta name="description" content="12문항으로 나의 진로 좌표를 측정합니다. 결핍 관찰·강점 증거·직업 연결·갱신 습관 4지표.">
<style>
:root{
  --brand:#b45309; --brand-soft:#efe7d6; --ink:#1f2937; --sub:#6b7280;
  --bg:#faf8f4; --card:#ffffff; --line:#e5e0d6; --good:#15803d; --warn:#b91c1c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:640px;margin:0 auto;padding:40px 20px 80px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--brand);text-transform:uppercase}
h1{font-size:26px;margin:8px 0 6px;letter-spacing:-.02em}
.lede{font-size:15px;color:var(--sub);margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
.qnum{font-size:12px;font-weight:700;color:var(--brand);margin-bottom:4px}
.qtext{font-size:16px;font-weight:600;margin-bottom:14px}
.opts{display:flex;gap:6px}
.opts button{flex:1;padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12px;cursor:pointer;color:var(--sub);transition:all .15s}
.opts button:hover{border-color:var(--brand)}
.opts button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.scale-hint{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px}
.cta{display:block;width:100%;padding:16px;margin-top:10px;background:var(--brand);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}
.cta:disabled{background:#d1cabb;cursor:not-allowed}
.progress{font-size:13px;color:var(--sub);text-align:center;margin:10px 0 20px}
#result{display:none}
.type-badge{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px;margin-bottom:10px}
.type-name{font-size:24px;font-weight:800;margin-bottom:8px}
.type-desc{font-size:15px;color:var(--ink);margin-bottom:20px}
.bars{margin:18px 0 6px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{width:92px;font-size:13px;font-weight:700;flex-shrink:0}
.bar-track{flex:1;height:12px;background:var(--brand-soft);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--brand);border-radius:99px;width:0;transition:width .8s ease}
.bar-val{width:42px;font-size:12px;color:var(--sub);text-align:right}
.rx{background:var(--brand-soft);border-radius:12px;padding:18px;margin-top:16px}
.rx-title{font-size:13px;font-weight:800;color:var(--brand);margin-bottom:6px}
.rx-body{font-size:15px}
.mailbox{border:1px dashed var(--brand);border-radius:12px;padding:18px;margin-top:14px;font-size:14px}
.mailbox strong{color:var(--brand)}
.retry{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--sub);cursor:pointer;background:none;border:none;text-decoration:underline}
footer{margin-top:40px;font-size:12px;color:var(--sub);text-align:center}
footer a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">

  <div id="intro">
    <div class="kicker">IDEN Career Coordinates</div>
    <h1>진로 좌표 진단</h1>
    <p class="lede">직업은 누군가의 부족함을 내 강점으로 채우는 일이라는 관점에서 출발합니다. 12문항, 약 3분. 네 가지 지표로 지금 내 좌표를 측정합니다.</p>
    <button class="cta" onclick="start()">시작하기</button>
  </div>

  <div id="quiz" style="display:none">
    <div class="progress"><span id="done">0</span> / 12 응답</div>
    <div id="questions"></div>
    <button class="cta" id="submit" disabled onclick="finish()">결과 보기</button>
  </div>

  <div id="result">
    <div class="kicker">진단 결과</div>
    <div style="margin-top:10px" class="card">
      <span class="type-badge" id="r-badge"></span>
      <div class="type-name" id="r-name"></div>
      <div class="type-desc" id="r-desc"></div>
      <div class="bars" id="r-bars"></div>
      <div class="rx">
        <div class="rx-title">처방 — 오늘 해볼 첫 동작</div>
        <div class="rx-body" id="r-rx"></div>
      </div>
      <div class="mailbox">
        결과를 더 깊게 풀어보고 싶다면 — 좌표 코드 <strong id="r-code"></strong> 를 적어
        <strong>nedabah.way@gmail.com</strong> 으로 보내주세요. 유형별 후속 워크시트를 안내합니다.
      </div>
      <button class="retry" onclick="location.reload()">다시 진단하기</button>
    </div>
  </div>

  <footer>© 네다바웨이 · <a href="/ai.html">IDEN 도출기로 이동</a></footer>
</div>

<script>
const AXES = {
  O:"결핍 관찰", S:"강점 증거", C:"직업 연결", R:"갱신 습관"
};
const QS = [
  {a:"O", t:"주변에서 자주 떠오르는 한 사람이 있고, 그가 요즘 힘들어하는 지점을 구체적으로 말할 수 있다."},
  {a:"O", t:"뉴스나 대화에서 \"이건 누가 해결해 주면 좋겠다\" 싶은 장면을 자주 발견한다."},
  {a:"O", t:"누군가의 어려움을 들으면 원인이 무엇인지 한 단계 더 파고들어 본다."},
  {a:"S", t:"최근 1년 안에 남에게 칭찬받은 능력을 세 가지 이상 적을 수 있다."},
  {a:"S", t:"내 강점이 발휘된 실제 사건(언제·어디서·무엇을)을 증거로 이야기할 수 있다."},
  {a:"S", t:"잘하는 것과 좋아하는 것을 구분해서 설명할 수 있다."},
  {a:"C", t:"내 강점이 어떤 사람의 어떤 부족함을 채울 수 있는지 한 문장으로 말할 수 있다."},
  {a:"C", t:"지금 하는(또는 하려는) 일을 \"누구를 위해\"라는 말로 소개할 수 있다."},
  {a:"C", t:"내 능력을 필요로 하는 대상을 직군·연령 등으로 좁혀 본 적이 있다."},
  {a:"R", t:"진로나 일의 방향을 정기적으로(분기 1회 이상) 다시 점검한다."},
  {a:"R", t:"최근 6개월 사이 일의 방식이나 도구를 의도적으로 바꿔본 적이 있다."},
  {a:"R", t:"방향이 틀렸다는 신호가 오면 계획을 수정하는 편이다."}
];
const TYPES = {
  designer:{badge:"DESIGNER", name:"설계자", desc:"네 지표가 고르게 높습니다. 좌표는 이미 잡혀 있고, 남은 과제는 유지가 아니라 확장입니다.", rx:"이번 분기 갱신 일정을 달력에 먼저 등록하세요. 그리고 내 강점이 채울 수 있는 두 번째 대상군을 하나 정해 가설로 적어 두세요."},
  observer:{badge:"OBSERVER", name:"관찰자", desc:"타인의 부족함은 잘 보는데, 내 강점의 증거가 얇습니다. 방향은 보이는데 연료가 부족한 상태입니다.", rx:"오늘 가까운 두 명에게 \"내가 뭘 할 때 제일 믿음직했는지\" 물어보세요. 답을 그대로 받아 적으면 그것이 강점 증거 1호가 됩니다."},
  holder:{badge:"HOLDER", name:"보유자", desc:"강점은 분명한데 그것이 향할 대상이 흐립니다. 연료는 가득한데 목적지가 비어 있는 상태입니다.", rx:"자주 떠오르는 사람 1명을 정하고, 그가 매일 부족해하는 것 1가지를 일주일간 관찰해 메모하세요. 관찰 7일이면 목적지 후보가 나옵니다."},
  unlinked:{badge:"UNLINKED", name:"미연결", desc:"관찰도 강점도 갖췄는데 둘이 직업 언어로 이어지지 않았습니다. 한 문장이 비어 있을 뿐입니다.", rx:"\"나는 [강점]으로 [대상]의 [부족함]을 채운다\" 빈칸 채우기를 지금 해보세요. 어색해도 일단 적는 것이 연결의 시작입니다."},
  anchored:{badge:"ANCHORED", name:"고정형", desc:"방향은 서 있으나 갱신이 멈춰 있습니다. 5년 전 좌표로 오늘을 항해하고 있을 가능성이 있습니다.", rx:"최근 가장 크게 바뀐 환경(도구·대상·시장) 하나를 적고, 내 방식에서 그대로인 부분 하나를 골라 이번 주에 한 가지만 바꿔보세요."},
  starter:{badge:"STARTER", name:"출발선", desc:"아직 측정값이 낮지만, 그만큼 어느 방향으로든 갈 수 있다는 뜻이기도 합니다. 첫 질문 하나면 충분합니다.", rx:"오늘 단 하나 — 자주 떠오르는 사람의 이름을 적고, 그가 요즘 가장 아쉬워하는 것을 한 줄로 메모하세요. IDEN은 거기서 시작됩니다."}
};
let answers = new Array(QS.length).fill(0);

function start(){
  document.getElementById("intro").style.display="none";
  document.getElementById("quiz").style.display="block";
  const box=document.getElementById("questions");
  box.innerHTML=QS.map((q,i)=>`
    <div class="card">
      <div class="qnum">Q${i+1} · ${AXES[q.a]}</div>
      <div class="qtext">${q.t}</div>
      <div class="opts" data-i="${i}">
        ${[1,2,3,4,5].map(v=>`<button onclick="pick(${i},${v},this)">${v}</button>`).join("")}
      </div>
      <div class="scale-hint"><span>전혀 아니다</span><span>매우 그렇다</span></div>
    </div>`).join("");
}
function pick(i,v,el){
  answers[i]=v;
  el.parentNode.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  el.classList.add("on");
  const n=answers.filter(x=>x>0).length;
  document.getElementById("done").textContent=n;
  document.getElementById("submit").disabled = n<QS.length;
}
function finish(){
  const s={O:0,S:0,C:0,R:0};
  QS.forEach((q,i)=>s[q.a]+=answers[i]);
  const hi=a=>s[a]>=11, lo=a=>s[a]<=8;
  let t;
  if(hi("O")&&hi("S")&&hi("C")&&hi("R")) t=TYPES.designer;
  else if(lo("O")&&lo("S")) t=TYPES.starter;
  else if(hi("O")&&!hi("S")) t=TYPES.observer;
  else if(hi("S")&&!hi("O")) t=TYPES.holder;
  else if(!hi("C")) t=TYPES.unlinked;
  else if(!hi("R")) t=TYPES.anchored;
  else t=TYPES.designer;
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("r-badge").textContent=t.badge;
  document.getElementById("r-name").textContent=t.name+" 유형";
  document.getElementById("r-desc").textContent=t.desc;
  document.getElementById("r-rx").textContent=t.rx;
  document.getElementById("r-code").textContent=`IDEN-${t.badge}-O${s.O}S${s.S}C${s.C}R${s.R}`;
  document.getElementById("r-bars").innerHTML=Object.keys(AXES).map(a=>`
    <div class="bar-row">
      <div class="bar-label">${AXES[a]}</div>
      <div class="bar-track"><div class="bar-fill" data-w="${Math.round(s[a]/15*100)}"></div></div>
      <div class="bar-val">${s[a]}/15</div>
    </div>`).join("");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".bar-fill").forEach(b=>b.style.width=b.dataset.w+"%");
  }));
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
