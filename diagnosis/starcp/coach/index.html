<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>STARCP 강사 화면 | 네다바웨이</title>
<meta name="theme-color" content="#f1ede5">
<link rel="stylesheet" href="/assets/starcp.css">
</head>
<body>
<div class="wrap">
<div class="brand">
  <a href="/" aria-label="네다바웨이 홈"><img src="/assets/brand/nw-wordmark-color.png" width="1128" height="180" alt="NEDABAHWAY"></a>
  <a href="/diagnosis/starcp/">학생 화면 열기</a>
</div>
<header class="head">
  <h1>STARCP 강사 화면</h1>
  <p>과정별 참여 결과를 집계 수치로 봅니다. 이름과 자기소개서 본문은 저장하지 않으므로 이 화면에도 나오지 않습니다.</p>
</header>
<noscript><p class="box strong">이 화면은 JavaScript가 켜져 있어야 쓸 수 있습니다.</p></noscript>

<main>
<form class="field" id="lockForm">
  <div id="lock">
    <label for="pw">비밀번호</label>
    <p class="q">이 화면은 잠겨 있습니다. 비밀번호는 서버에서 확인합니다.</p>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="btns" style="margin-top:8px"><button class="btn pri" type="submit">열기</button></div>
  </div>
  <p class="msg err" id="lockMsg" role="status"></p>
</form>

<div id="board" class="wrap" style="padding:0" hidden>
  <div class="field">
    <label for="course">과정 코드</label>
    <select id="course"></select>
    <div class="btns">
      <button class="btn sm" type="button" id="reload">새로 고침</button>
      <button class="btn sm" type="button" id="logout">잠그기</button>
    </div>
  </div>
  <div id="result" class="wrap" style="padding:0"></div>
</div>
</main>
</div>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/starcp-coach.js"></script>
</body>
</html>
