<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>오프라인 — 네다바웨이</title>
<meta name="description" content="현재 오프라인 상태입니다. 네다바웨이는 진로·AI 리터러시·리더십을 다루는 김창환 강사의 작업실입니다. 연결이 복구되면 다시 시도해 주세요.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.nedabah.org/offline.html">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3a322a">
<style>
:root{
  --c-bg:#fbf6ec;--c-fg:#3a322a;--c-mute:#6a604f;--c-line:#e5d8c4;--c-accent:#b45309;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--c-bg);color:var(--c-fg);
  line-height:1.8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
main{max-width:520px;text-align:center}
.brand{font-size:.78rem;letter-spacing:.18em;font-weight:700;color:var(--c-accent);margin-bottom:1rem}
h1{font-size:1.9rem;line-height:1.35;margin-bottom:1rem}
p{color:var(--c-mute);margin-bottom:1.6rem}
.actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
a.btn,button.btn{display:inline-block;font:inherit;cursor:pointer;border:1px solid var(--c-line);
  background:#fff;color:var(--c-fg);padding:.7rem 1.4rem;border-radius:8px;text-decoration:none;font-weight:600}
a.btn--primary{background:var(--c-fg);color:var(--c-bg);border-color:var(--c-fg)}
footer{margin-top:2.4rem;font-size:.82rem;color:var(--c-mute)}
</style>
</head>
<body>
<main role="main">
  <header>
    <p class="brand">NEDABAHWAY · 네다바웨이</p>
    <h1>지금은 오프라인입니다</h1>
  </header>
  <section aria-label="안내">
    <p>인터넷 연결이 끊어져 이 페이지를 표시할 수 없습니다. 이전에 방문한 페이지는 오프라인에서도 열람할 수 있으며, 연결이 복구되면 아래에서 다시 시도해 주세요.</p>
    <nav class="actions" aria-label="복구 동작">
      <button type="button" class="btn btn--primary" onclick="location.reload()">다시 시도</button>
      <a class="btn" href="/">홈으로</a>
    </nav>
  </section>
  <footer>
    <p>김창환 · 네다바웨이 — 한 사람의 일을 다시 디자인합니다</p>
  </footer>
</main>
</body>
</html>
