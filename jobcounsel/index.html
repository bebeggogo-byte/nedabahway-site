<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직업상담사 2급 합격 학습</title>
<meta name="description" content="직업상담사 2급 필기·실기 문제풀이와 간격 반복 암기 학습 앱">
<meta name="theme-color" content="#1f4fbf">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="직업상담사">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분한 수험 노트. 설명보다 문제와 입력칸이 먼저.
   IDEA: 손으로 넘기는 단어장과 OMR 답안지.
   PICTURE: 첫 화면은 오늘 풀 카드 묶음과 시험까지 남은 날.
   COLOUR and TYPE: 베이지 바탕, 먹색 글자, 코발트 블루 강조. Noto Sans KR.
   LAYOUT: 상단 탭, 한 열의 학습 카드, 넓은 화면에서 옆에 진행 패널. */
:root{color-scheme:light dark;
--bg:light-dark(#f4efe6,#16181d);--card:light-dark(#fffdf8,#1f2229);--ink:light-dark(#1e1c1a,#ece8e0);
--mute:light-dark(#6d665c,#a39d93);--line:light-dark(#e2d9c9,#343844);--blue:light-dark(#1f4fbf,#7ea2ff);
--blue2:light-dark(#e3eafb,#26324f);--red:light-dark(#b8322a,#ff8a80);--red2:light-dark(#fbe6e3,#4a2522);
--ok:light-dark(#1f4fbf,#7ea2ff);--warn:light-dark(#9a6b00,#f2c14e);--warn2:light-dark(#fbf0d6,#40361d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Pretendard,"Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
:root[data-theme=dark] button.pri{color:#10131a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) button.pri{color:#10131a}}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px);flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .dd{margin-left:auto;font-size:14px;color:var(--mute)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 max(4vw,14px) 8px}
nav a{flex:none;text-decoration:none;color:var(--mute);padding:8px 12px;border-radius:999px;font-weight:500;font-size:15px}
nav a.on{background:var(--ink);color:var(--bg)}
main{max-width:1100px;margin:0 auto;padding:20px max(4vw,14px) 80px}
h2{font-size:30px;line-height:1.15;margin:4px 0 14px;letter-spacing:-.02em}
h3{font-size:19px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.big{font-size:clamp(34px,6vw,52px);font-weight:800;line-height:1;letter-spacing:-.03em}
.mute{color:var(--mute)}.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.today{background:var(--blue);color:#fff;border:0}
:root[data-theme=dark] .today{color:#10131a}
.today .mute{color:inherit;opacity:.8}
.today button.pri{background:#fff;color:#1f4fbf;border-color:#fff}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.bars .r{display:grid;grid-template-columns:9.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bars .r b{text-align:right;font-variant-numeric:tabular-nums}
.boxes{display:flex;gap:4px;align-items:flex-end;height:90px;margin-top:8px}
.boxes div{flex:1;background:var(--blue2);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.boxes div span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute)}
.blab{display:flex;gap:4px;font-size:12px;color:var(--mute)}.blab span{flex:1;text-align:center}
/* session */
.sess{max-width:760px;margin:0 auto}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--mute)}
.prog .bar{flex:1}
.tag{display:inline-block;font-size:13px;padding:2px 9px;border-radius:999px;background:var(--blue2);color:var(--blue);font-weight:600;margin-right:6px}
.tag.rev{background:var(--warn2);color:var(--warn)}
.q{font-size:19px;font-weight:600;line-height:1.55;margin:12px 0 16px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;display:flex;gap:10px;padding:12px 14px;font-size:16px}
.opts button .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px}
.opts button.right{border-color:var(--blue);background:var(--blue2)}
.opts button.wrong{border-color:var(--red);background:var(--red2)}
.fb{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:15.5px}
.fb.ok{border-color:var(--blue)}.fb.no{border-color:var(--red)}
.fb strong.ok{color:var(--blue)}.fb strong.no{color:var(--red)}
.ask{margin-top:12px}.ask p{margin:0 0 8px;font-weight:600;font-size:15px}
.cz{font-size:18px;line-height:2.3}
.cz input{border:0;border-bottom:2px solid var(--blue);background:var(--blue2);border-radius:6px 6px 0 0;padding:2px 8px;font-size:17px;min-width:4em;max-width:100%;height:36px}
.cz input.r{border-color:var(--blue);background:transparent;color:var(--blue);font-weight:700}
.cz input.w{border-color:var(--red);background:var(--red2)}
.cz .ans{font-size:14px;color:var(--red);font-weight:600;margin:0 4px}
.mn{margin-top:10px;font-size:15px;color:var(--warn);background:var(--warn2);padding:8px 12px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips button{font-size:15px}
.seq{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seq span{background:var(--blue2);color:var(--blue);padding:6px 10px;border-radius:8px;font-weight:600;font-size:15px}
.seq span.w{background:var(--red2);color:var(--red)}
.mt{display:grid;gap:8px}
.mt .m{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px;align-items:center}
.mt select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 8px;font-size:15px}
.mt select.r{border-color:var(--blue)}.mt select.w{border-color:var(--red);background:var(--red2)}
textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;font-size:16px;line-height:1.6}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.kw span{padding:4px 10px;border-radius:999px;font-size:14px;font-weight:600;background:var(--red2);color:var(--red)}
.kw span.hit{background:var(--blue2);color:var(--blue)}
pre.model{white-space:pre-wrap;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center;vertical-align:middle}
th{font-weight:700;background:var(--bg)}
td.l,th.l{text-align:left}
.scroll{overflow-x:auto}
a{color:var(--blue)}
.list .it{padding:12px 0;border-bottom:1px solid var(--line)}
.pill{font-size:13px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-left:4px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px}
.res td b{font-size:18px}
.fail{color:var(--red);font-weight:700}.pass{color:var(--blue);font-weight:700}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;min-height:32px}
.note{font-size:14px;color:var(--mute);margin-top:6px}
@media(max-width:600px){h2{font-size:25px}.q{font-size:17.5px}.bars .r{grid-template-columns:7.5em minmax(0,1fr) 3em;font-size:14px}table{font-size:13px}
.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute);font-size:12.5px}}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header>
 <div class="top"><h1>직업상담사 2급 합격 학습</h1><span class="dd" id="dd"></span></div>
 <nav id="nav"></nav>
</header>
<main id="app"><p class="mute">문제를 불러오는 중입니다.</p></main>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5, INT=[0,1,3,7,14,30,60];
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[\s·.,()\-–~·'"‘’“”/]/g,'');
const SUBS=['P','C','I','L','R'];
const TYPE={mcq:'4지선다',cloze:'빈칸 쓰기',order:'순서 맞추기',match:'짝 맞추기',prac:'실기 백지 쓰기'};
const KEY='jsa2-progress-v1';
let D=null, S={items:{},log:{},mock:[],past:{},settings:{newCloze:15,newMcq:15,newPrac:2}};
let mem=null;
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- schedule (고용노동부 공고 제2026-518호) ---------- */
const SCHED=[
 {r:'1회',wa:'1.18(월)~1.21(목)',w:'2.12(금)~3.2(화)',wp:'3.10(수)',pa:'3.22(월)~3.25(목)',p:'4.18(일)',f:'6.11(금)'},
 {r:'2회',wa:'4.12(월)~4.15(목)',w:'5.7(금)~5.26(수)',wp:'6.2(수)',pa:'6.15(화)~6.18(금)',p:'7.10(토)',f:'9.10(금)'},
 {r:'3회',wa:'7.20(화)~7.23(금)',w:'8.13(금)~9.1(수)',wp:'9.8(수)',pa:'9.21(화)~9.24(금)',p:'11.6(토) 13:30',f:'12.31(금)'}];
const DDAY=[['필기 접수','2027-01-18'],['필기 시작','2027-02-12'],['실기(필답형)','2027-04-18']];
const PAST=[['2022.04.24','2회','5871861'],['2022.03.05','1회','5763531'],['2021.08.14','3회','5389427'],['2021.05.15','2회','5185001'],['2021.03.07','1회','5008445'],['2020.09.26','4회','4567025'],['2020.08.22','3회','4494935'],['2020.06.06','1·2회 통합','4376398'],['2019.08.04','3회','3721736'],['2019.04.27','2회','3567990'],['2019.03.03','1회','3507483'],['2018.08.19','3회','3100680'],['2018.04.28','2회','2924087'],['2018.03.04','1회','2849760'],['2017.08.26','3회','2849750'],['2017.05.18','2회','2625056'],['2017.03.05','1회','2573205'],['2016.08.21','3회','2564069'],['2016.05.08','2회','2564056']];
const LAW=[
 ['배우자 출산휴가','10일, 출산 후 90일 이내','20일, 출산일부터 120일 이내 청구, 3회 분할','2025.2.23'],
 ['육아휴직','1년, 2회 분할','1년. 부모 각각 3개월 이상 사용·한부모·중증 장애아동 부모는 1년 6개월. 3회 분할','2025.2.23'],
 ['육아기 근로시간 단축','만 8세 이하, 최대 2년, 분할 최소 3개월','만 12세 이하(초6), 1년+미사용 육아휴직의 2배, 분할 최소 1개월','2025.2.23'],
 ['난임치료휴가','연 3일(1일 유급)','연 6일. 유급은 최초 2일, 2026.11.27부터 최초 4일로 확대 보도','2025.2.23'],
 ['미숙아 출산전후휴가','90일','100일','2025.2.23'],
 ['육아휴직급여 상한','월 150만원','1~3개월 250만원, 4~6개월 200만원, 7개월~ 160만원','2025.1.1'],
 ['최저임금','2025년 10,030원','2026년 10,320원 → 2027년 10,700원(월 2,236,300원)','2027.1.1'],
 ['구직급여 1일 상한','66,000원','68,100원(하한=최저임금×80%×8시간, 2026년 66,048원)','2026.1.1'],
 ['배우자 출산전후휴가·유산사산휴가','없음','출산예정일 전 사용, 배우자 유산·사산휴가 신설로 보도(2026 하반기)','시험 직전 국가법령정보센터 확인']];

/* ---------- item helpers ---------- */
let ALL=[];
const st=id=>S.items[id]||(S.items[id]={b:0,due:null,n:0,w:0,c:0});
const isNew=id=>!S.items[id]||S.items[id].n===0;
const isDue=id=>{const x=S.items[id];return x&&x.n>0&&x.due&&x.due<=todayStr()};
function grade(id,result,reason){ // result: 'sure'|'unsure'|'wrong'
 const x=st(id),t=todayStr();x.n++;x.last=t;
 if(result==='wrong'){x.w++;x.b=1;x.due=addDays(t,1);x.reason=reason||x.reason}
 else if(result==='unsure'){x.c++;x.b=Math.max(1,Math.min(x.b,2));x.due=addDays(t,INT[x.b]);x.unsure=(x.unsure||0)+1}
 else{x.c++;x.b=Math.min(6,x.b+1);x.due=addDays(t,INT[x.b])}
 const L=S.log[t]||(S.log[t]={n:0,ok:0});L.n++;if(result!=='wrong')L.ok++;
 save();
}
const subOf=id=>ALL.find(a=>a.id===id)?.s;
function subStats(s){let n=0,ok=0;for(const it of ALL){if(it.s!==s)continue;const x=S.items[it.id];if(x&&x.n){n+=x.n;ok+=x.c}}return{n,ok,p:n?Math.round(ok/n*100):null}}
function weakTopics(){const m={};for(const it of ALL){const x=S.items[it.id];if(!x||!x.n)continue;const k=D.sub[it.s]+' · '+it.t;m[k]=m[k]||{w:0,n:0};m[k].w+=x.w+(x.unsure||0)*.5;m[k].n+=x.n}
 return Object.entries(m).filter(([k,v])=>v.w>0).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n).slice(0,6)}

/* ---------- queue building ---------- */
function interleave(list){const by={};for(const it of list)(by[it.s]=by[it.s]||[]).push(it);const keys=Object.keys(by);const out=[];let k=0;
 while(out.length<list.length){const arr=by[keys[k%keys.length]];if(arr&&arr.length)out.push(arr.shift());k++}return out}
function buildToday(){
 const due=ALL.filter(a=>isDue(a.id));
 const pickNew=(type,n)=>interleave(shuffle(ALL.filter(a=>a.type===type&&isNew(a.id)))).slice(0,n);
 const fresh=[...pickNew('cloze',S.settings.newCloze),...pickNew('mcq',S.settings.newMcq),...pickNew('order',1),...pickNew('match',1),...pickNew('prac',S.settings.newPrac)];
 return interleave(shuffle([...due,...fresh]));
}
function buildFocus(s,type){
 const pool=ALL.filter(a=>(s==='all'||a.s===s)&&(type==='all'||a.type===type));
 const due=pool.filter(a=>isDue(a.id)),nw=pool.filter(a=>isNew(a.id)),rest=pool.filter(a=>!isDue(a.id)&&!isNew(a.id));
 return [...shuffle(due),...shuffle(nw),...shuffle(rest)].slice(0,25);
}
function buildWeak(){return shuffle(ALL.filter(a=>{const x=S.items[a.id];return x&&(x.w>0||x.unsure)})).sort((a,b)=>(S.items[b.id].w-S.items[a.id].w)).slice(0,25)}

/* ---------- session runner ---------- */
let SES=null;
function startSession(list,title){if(!list.length){alertBox('지금 풀 문항이 없습니다. 다른 묶음을 고르십시오.');return}
 SES={q:list.slice(),i:0,title,done:0,ok:0,total:list.length,retry:{}};location.hash='session';render()}
function alertBox(msg){const a=$('#app');const p=document.createElement('div');p.className='fb no pop';p.textContent=msg;a.prepend(p);setTimeout(()=>p.remove(),3500)}
function nextItem(result,reason){
 const it=SES.q[SES.i];grade(it.id,result,reason);SES.done++;if(result!=='wrong')SES.ok++;
 if(result==='wrong'&&(SES.retry[it.id]||0)<2){SES.retry[it.id]=(SES.retry[it.id]||0)+1;const pos=Math.min(SES.q.length,SES.i+4);SES.q.splice(pos,0,it)}
 SES.i++;render();window.scrollTo({top:0})}
function askAfter(ok,el){
 el.insertAdjacentHTML('beforeend',ok?
 `<div class="ask"><p>얼마나 확실했나요?</p><div class="row"><button class="pri" data-g="sure">확실히 알았다</button><button data-g="unsure">헷갈렸다 · 찍었다</button></div></div>`:
 `<div class="ask"><p>틀린 이유를 고르십시오.</p><div class="row"><button data-g="wrong" data-r="몰랐다">몰랐다</button><button data-g="wrong" data-r="헷갈렸다">헷갈렸다</button><button data-g="wrong" data-r="실수">실수했다</button></div></div>`);
 el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>nextItem(b.dataset.g,b.dataset.r));
 el.querySelector('[data-g]').focus({preventScroll:true});
}
function head(it){return `<span class="tag">${esc(D.sub[it.s])}</span><span class="tag">${TYPE[it.type]}</span>${it.rev?'<span class="tag rev">법 개정 반영</span>':''}${it.f===3?'<span class="pill">기출 빈출 ★★★</span>':it.f===2?'<span class="pill">기출 ★★</span>':''}`}
function renderSession(){
 const a=$('#app');
 if(!SES){a.innerHTML=`<div class="card"><p>진행 중인 학습이 없습니다.</p><button class="pri" onclick="location.hash='home'">홈으로</button></div>`;return}
 if(SES.i>=SES.q.length){const p=Math.round(SES.ok/Math.max(1,SES.done)*100);

 const ins=[...el.querySelectorAll('input')];let hinted=false,done=false;ins[0].focus();

function rOrder(it,el){

 <div class="card"><b>기억 상자</b><div class="mute small">왼쪽은 아직 안 본 카드, 오른쪽으로 갈수록 오래 기억하는 카드입니다. 전체 ${ALL.length}개 중 ${seen}개 학습.</div><div class="boxes">${box.map(n=>`<div style="height:${n/mx*100}%"><span>${n}</span></div>`).join('')}</div><div class="blab"><span>새</span><span>1일</span><span>3일</span><span>7일</span><span>14일</span><span>30일</span><span>60일</span></div></div>
 <div class="card"><b>약점 주제</b>${wk.length?`<ol class="small" style="padding-left:20px;margin:8px 0">${wk.map(([k,v])=>`<li>${esc(k)} <span class="mute">(틀림·헷갈림 ${Math.round(v.w)})</span></li>`).join('')}</ol><button id="wgo">약점만 25문항</button>`:'<p class="mute small">문제를 풀면 자주 틀리는 주제가 여기에 모입니다.</p>'}</div>
 <div class="card"><b>이 앱의 학습 방식</b><ul class="small" style="padding-left:18px;margin:8px 0">
 <li><b>인출 연습</b>: 읽지 않고 먼저 풀고 씁니다.</li><li><b>간격 반복</b>: 맞히면 1·3·7·14·30·60일 뒤, 틀리면 다음 날 다시 나옵니다.</li><li><b>직접 쓰기</b>: 암기 항목은 빈칸에 타이핑합니다.</li><li><b>교차 학습</b>: 다섯 과목을 섞어 냅니다.</li><li><b>확신도 점검</b>: 찍어서 맞힌 문항은 짧은 간격으로 다시 냅니다.</li><li><b>오답 원인 기록</b>: 몰랐다·헷갈렸다·실수를 구분합니다.</li></ul></div></div>`;
 $('#tgo').onclick=()=>startSession(buildToday(),'오늘의 학습');bindInstall();const w=$('#wgo');if(w)w.onclick=()=>startSession(buildWeak(),'약점 집중');

function renderPrac(){const a=$('#app');
 a.innerHTML=`<h2>실기 필답형</h2><div class="card"><p>실기는 「○가지 쓰고 설명하시오」 형식이 대부분입니다. 채점은 핵심 용어가 들어 있는지를 중심으로 합니다. 교재를 덮고 백지에 쓰듯 입력한 뒤 채점하십시오.</p>
 <ul class="small"><li>요구한 개수만큼, 확실한 답부터 씁니다.</li><li>용어 뒤에 한 줄 설명을 붙입니다.</li><li>계산 문제는 공식 → 대입 → 답 → 단위를 모두 씁니다.</li><li>실무 경험보다 이론 용어로 답합니다.</li></ul>
 <div class="row"><button class="pri" id="p8">오늘 8문항 쓰기</button><button id="pall">전체 ${D.prac.length}문항 순서대로</button></div></div>
 <h3>문항 목록</h3><div class="card list">${D.prac.map(p=>{const x=S.items[p.id];return `<div class="it"><span class="tag">${esc(D.sub[p.s])}</span><b>${esc(p.t)}</b> ${x&&x.n?`<span class="pill">${x.w?'틀림 '+x.w:'통과'}</span>`:''}<br><span class="small">${esc(p.q)}</span></div>`}).join('')}</div>`;
 $('#p8').onclick=()=>{const PR=ALL.filter(x=>x.type==='prac');const due=PR.filter(p=>isDue(p.id)),nw=PR.filter(p=>isNew(p.id));startSession([...shuffle(due),...nw,...shuffle(PR)].filter((v,i,ar)=>ar.indexOf(v)===i).slice(0,8),'실기 백지 쓰기')};
 $('#pall').onclick=()=>startSession(ALL.filter(x=>x.type==='prac'),'실기 전체');
}
function renderWrong(){const a=$('#app');
 const ws=ALL.filter(x=>{const s=S.items[x.id];return s&&(s.w||s.unsure)}).sort((p,q)=>S.items[q.id].w-S.items[p.id].w);
 const rc={};ws.forEach(x=>{const r=S.items[x.id].reason;if(r)rc[r]=(rc[r]||0)+1});
 a.innerHTML=`<h2>오답 노트</h2><div class="card"><p>틀린 이유: ${Object.keys(rc).length?Object.entries(rc).map(([k,v])=>`<b>${esc(k)}</b> ${v}`).join(' · '):'기록 없음'}</p>
 <p class="small mute">「몰랐다」가 많으면 빈칸 카드로 암기량을 늘리고, 「헷갈렸다」가 많으면 짝 맞추기·순서 맞추기로 구분 연습을, 「실수」가 많으면 문제의 「아닌 것·옳지 않은 것」에 표시하며 읽으십시오.</p>
 <button class="pri" id="wg" ${ws.length?'':'disabled'}>오답·헷갈린 문항 다시 풀기</button></div>
 <div class="card list" style="margin-top:14px">${ws.length?ws.map(x=>{const s=S.items[x.id];return `<div class="it">${head(x)}<br><b>${esc(x.q||x.t)}</b><br><span class="small mute">틀림 ${s.w} · 헷갈림 ${s.unsure||0}${s.reason?' · 최근 이유: '+esc(s.reason):''} · 다음 복습 ${esc(s.due||'')}</span></div>`}).join(''):'<p class="mute">아직 틀린 문항이 없습니다.</p>'}</div>`;
 $('#wg').onclick=()=>startSession(buildWeak(),'오답 다시 풀기');
}
function renderInfo(){const a=$('#app');
 a.innerHTML=`<h2>시험 일정 · 기출 · 개정 수치</h2>
 <div class="card small"><b>근거 자료</b><br>시험 일정: 고용노동부 공고 제2026-518호 「2027년도 국가기술자격 검정시행계획」(2026.11.23) — 직업상담사 2급은 서비스 분야로 1·2·3회 모두 시행 · 시험 구조: Q-Net 직업상담사2급 종목 정보(출제기준 2025.1.1~2027.12.31) · 법령 수치: 고용노동부 고시·보도자료, 국가법령정보센터</div>
 <h3>2027년 정기시험 일정</h3><div class="card scroll"><table class="stack"><thead><tr><th>회차</th><th>필기 접수</th><th>필기 시험(CBT)</th><th>필기 발표</th><th>실기 접수</th><th>실기(필답형)</th><th>최종 발표</th></tr></thead><tbody>${SCHED.map(r=>`<tr><td><b>${r.r}</b></td><td>${r.wa}</td><td>${r.w}</td><td>${r.wp}</td><td>${r.pa}</td><td><b>${r.p}</b></td><td>${r.f}</td></tr>`).join('')}</tbody></table>
 <p class="note">접수 시간: 첫날 10:00 ~ 마지막 날 18:00 · 발표 시간 09:00 · 필답형 실기는 전국 동시 시행(2회는 토요일, 1회는 일요일, 3회는 종목별로 11.6 또는 11.14이며 직업상담사 2급은 11.6 13:30) · 최종 발표는 필답형 중앙채점 종목의 2차 발표일입니다. · 필기 합격 시 발표일부터 2년간 필기 면제 · 응시료 필기 19,400원, 실기 20,800원 · 제주 시험장: 한국산업인력공단 제주지사(제주시 복지로 19, 064-729-0701)</p></div>
 <h3>시험 구조</h3><div class="card scroll"><table class="stack"><thead><tr><th>구분</th><th>내용</th><th>합격 기준</th></tr></thead><tbody><tr><td>필기</td><td class="l">직업심리 · 직업상담 및 취업지원 · 직업정보 · 노동시장 · 고용노동관계법규(Ⅰ), 각 20문항 4지선다, 150분</td><td>과목당 40점 이상 + 평균 60점 이상</td></tr><tr><td>실기</td><td class="l">직업상담실무 필답형, 150분</td><td>100점 만점 60점 이상</td></tr></tbody></table></div>
 <h3>공개 기출문제 (필기)</h3><div class="card"><p class="small">한국산업인력공단은 2022년 2회까지 필기 문제를 공개했고, 2022년 3회부터는 CBT로 바뀌어 공개하지 않습니다. 그 이후 기출은 수험생 기억을 모은 복원본입니다. 아래 공개 회차를 시간을 재고 풀고, 점수를 기록하십시오.</p>
 <p class="small"><b>주의</b> ① 과목명이 2025년에 바뀌었습니다(직업상담학→직업상담 및 취업지원, 노동관계법규→고용노동관계법규(Ⅰ)). ② 2024년 이전 법규 문항은 아래 개정 수치표 기준으로 정답이 달라질 수 있습니다.</p>
 <div class="scroll"><table><thead><tr><th>시행일</th><th>회차</th><th>문제(CBT 전자문제집)</th><th>풀이 기록</th></tr></thead><tbody>${PAST.map(p=>{const v=S.past[p[0]]||'';return `<tr><td>${p[0]}</td><td>${p[1]}</td><td><a href="https://www.comcbt.com/xe/n3/${p[2]}" target="_blank" rel="noopener">열기</a></td><td><input data-p="${p[0]}" value="${esc(v)}" placeholder="평균 점수" inputmode="numeric" style="width:6.5em;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card)"></td></tr>`}).join('')}</tbody></table></div>
 <p class="note">전체 목록: <a href="https://www.comcbt.com/xe/n3" target="_blank" rel="noopener">comcbt.com/xe/n3</a> · 과목 개편 안내: <a href="https://www.moducbt.com/info/job-counselor-2/job-counselor-2-subject-revision" target="_blank" rel="noopener">모두CBT</a> · 2022년 3회 이후 복원 기출과 실기 복원 기출(2019~2025)은 시판 기출문제집(예: 시대에듀 2026 필기 CBT 문제은행, 실기 기출문제해설)에 실려 있습니다.</p></div>
 <h3>법 개정으로 정답이 바뀐 수치</h3><div class="card scroll"><table class="stack"><thead><tr><th>항목</th><th>예전 기출 정답</th><th>현행</th><th>시행</th></tr></thead><tbody>${LAW.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td class="l">${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table>
 <p class="note">2027년에는 최저임금 인상으로 구직급여 하한(68,480원)이 현재 상한(68,100원)보다 높아져 상·하한 개편이 논의 중입니다. 시험 1주 전에 고용노동부 보도자료와 국가법령정보센터에서 다시 확인하십시오.</p></div>
 <h3>학습 기록 옮기기</h3><div class="card small"><p>기록은 이 브라우저에만 저장됩니다. 다른 기기로 옮길 때는 아래 코드를 복사해 그 기기의 같은 칸에 붙여 넣으십시오.</p><div class="row"><button id="cp">기록 코드 복사</button><button id="im">붙여 넣은 코드 불러오기</button></div><textarea id="io" style="min-height:80px;margin-top:8px" placeholder="여기에 기록 코드를 붙여 넣습니다"></textarea>
 <p>하루 새 학습량: 빈칸 <input id="nc" type="number" min="0" max="60" value="${S.settings.newCloze}" style="width:4.5em;min-height:40px"> 문제 <input id="nm2" type="number" min="0" max="60" value="${S.settings.newMcq}" style="width:4.5em;min-height:40px"> 실기 <input id="np" type="number" min="0" max="10" value="${S.settings.newPrac}" style="width:4em;min-height:40px"></p></div>`;
 a.querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>{S.past[i.dataset.p]=i.value;save()});
 $('#cp').onclick=async()=>{const t=JSON.stringify(S);$('#io').value=t;try{await navigator.clipboard.writeText(t);$('#cp').textContent='복사했습니다'}catch(e){$('#io').select();$('#cp').textContent='아래 칸을 직접 복사하십시오'}};
 $('#im').onclick=()=>{try{const v=JSON.parse($('#io').value);if(!v.items)throw 0;S=Object.assign(S,v);save();$('#im').textContent='불러왔습니다'}catch(e){$('#im').textContent='코드가 올바르지 않습니다'}};
 [['nc','newCloze'],['nm2','newMcq'],['np','newPrac']].forEach(([i,k])=>$('#'+i).onchange=e=>{S.settings[k]=Math.max(0,+e.target.value||0);save()});
}

/* ---------- install (home screen) ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if((location.hash.slice(1)||'home')==='home')render()});
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ua=navigator.userAgent||'';
function installCard(){if(standalone())return'';
 const inApp=/KAKAOTALK|Instagram|FBAN|FBAV|NAVER|Line\//i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua);
 let msg;
 if(inApp)msg='카카오톡 등 앱 안의 브라우저에서는 설치가 되지 않습니다. 오른쪽 위(또는 아래) 메뉴에서 「다른 브라우저로 열기」를 누른 뒤 설치하십시오.';
 else if(deferredPrompt)msg='버튼을 누르면 휴대폰 홈 화면에 앱으로 설치됩니다. 설치하면 인터넷이 없어도 공부할 수 있습니다.';
 else if(ios)msg='Safari 아래쪽의 공유 버튼(네모에 위쪽 화살표)을 누르고 「홈 화면에 추가」를 고르십시오.';
 else msg='브라우저 메뉴(⋮)에서 「홈 화면에 추가」 또는 「앱 설치」를 고르십시오.';
 return `<div class="card" style="margin-top:14px"><b>홈 화면에 설치하기</b><p class="small mute" style="margin:6px 0 10px">${msg}</p>${deferredPrompt&&!inApp?'<button class="pri" id="inst">홈 화면에 설치</button>':''}</div>`}
function bindInstall(){const b=$('#inst');if(b)b.onclick=async()=>{deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;render()}}
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

/* ---------- routing ---------- */
const PAGES=[['home','홈'],['session','학습 중'],['focus','과목 집중'],['mock','모의고사'],['prac','실기'],['wrong','오답 노트'],['info','일정·기출·개정']];
function render(){document.onkeydown=null;clearInterval(tick);
 let h=location.hash.slice(1)||'home';if(!PAGES.some(p=>p[0]===h))h='home';
 $('#nav').innerHTML=PAGES.filter(p=>p[0]!=='session'||SES).map(([k,v])=>`<a href="#${k}" class="${k===h?'on':''}">${v}</a>`).join('');
 $('#dd').textContent=dday();
 ({home:renderHome,session:renderSession,focus:renderFocus,mock:renderMock,prac:renderPrac,wrong:renderWrong,info:renderInfo})[h]();
}
window.addEventListener('hashchange',render);
const stackObs=new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,q=c;while(q=q.previousElementSibling)i+=q.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}});stackObs.observe(document.body,{childList:true,subtree:true});
fetch('data.json').then(r=>r.json()).then(d=>{D=d;
 ALL=[...d.mcq.map(x=>({...x,type:'mcq'})),...d.cloze.map(x=>({...x,type:'cloze'})),...d.order.map(x=>({...x,type:'order'})),...d.match.map(x=>({...x,type:'match'})),...d.prac.map(x=>({...x,type:'prac'}))];
 render()}).catch(e=>{$('#app').innerHTML='<div class="card">문제 파일을 불러오지 못했습니다. 페이지를 새로 고침하십시오.</div>'});
}
</script>
