# 17 departments, sixty staff, one operator.
# As described in /blog/posts/2026-04-19_eight-hours-with-my-ai-swarm.html
# Six of these (V, MI, RT, FC, DA, TO) are the "opposing layer".
#
# Each department has a code (D1, D2, ...) used in the today-strip.

D1:
  name: Briefing
  role: Reads yesterday's notebook + calendar + sources, writes the morning brief.
  layer: production
D2:
  name: Research
  role: Opens and tracks long-running research threads.
  layer: production
D3:
  name: Transcript
  role: Cleans meeting recordings into linked notes.
  layer: production
D4:
  name: Proposal
  role: Drafts public-procurement proposals from briefs.
  layer: production
D5:
  name: Curriculum
  role: Drafts workshop outlines, lesson plans, worksheets.
  layer: production
D6:
  name: Notebook
  role: Maintains the daily chronological notebook and weekly digest.
  layer: production
D7:
  name: Editor
  role: Line-edits drafts before they leave the desk.
  layer: production
D8:
  name: Verification
  role: Asks of every claim — what evidence is attached?
  layer: opposing
D9:
  name: Market Intelligence
  role: Refuses vibes as data. Reports what is known; labels the rest UNKNOWN.
  layer: opposing
D10:
  name: Red Team
  role: Writes the failure scenarios. Finds hidden assumptions. Refuses to defend.
  layer: opposing
D11:
  name: Fact Check
  role: Reverifies numbers, dates, cited precedents.
  layer: opposing
D12:
  name: Decision Architect
  role: Rewrites recommendations as balanced options with FACT/ESTIMATE/OPINION labels.
  layer: opposing
D13:
  name: Trust Officer
  role: Final linter. Flags over-confidence, hope-projection, self-referential loops.
  layer: opposing
D14:
  name: Calendar
  role: Surfaces conflicts, prep notes, travel windows.
  layer: production
D15:
  name: Invoicing
  role: Watches outstanding invoices and quietly nags.
  layer: production
D16:
  name: Reminders
  role: Watches commitments. Reminds the operator of what he said he would do.
  layer: production
Chief:
  name: Chief of Staff
  role: Dispatches departments and assembles the daily strip the public sees.
  layer: meta
