<script defer>
document.addEventListener('DOMContentLoaded', () => {
  const $ = (id) => document.getElementById(id);
  const sample = `안녕하세요, 박지민입니다. 5월 16일 금요일 하루 연차 사용하려고 합니다. 가족 행사 때문입니다.\n\n정태호 — 5월 20일~22일 (3일) 연차요. 이전부터 잡혀 있던 여행입니다.\n\n이수연: 6월 3일 오전 반차 신청합니다. 병원 방문 예정이라 오전만 비웁니다.`;
  $('useSample').addEventListener('click', (e) => { e.preventDefault(); $('text').value = sample; });

  $('runBtn').addEventListener('click', async () => {
    const text = $('text').value.trim();
    if (!text) { alert('휴가 신청 텍스트를 붙여넣어주세요.'); return; }
    const result = $('result');
    result.innerHTML = '<div class="result-empty">정리 중...</div>';
    MZ.setLoading($('runBtn'), true);

    const prompt = `다음 텍스트에서 휴가 신청 정보를 추출하세요. 한국어 JSON만 반환.

텍스트:
"""
${text}
"""

JSON 스키마:
{
  "requests": [
    {
      "name":"신청자 이름",
      "type":"연차|반차 오전|반차 오후|재택|기타",
      "start":"YYYY-MM-DD",
      "end":"YYYY-MM-DD (단일이면 start와 동일, 반차도 start=end)",
      "days":0.5 또는 정수,
      "reason":"사유 (간결, 없으면 빈문자열)"
    }
  ]
}

규칙:
- 텍스트에 명시된 정보만. 추측 금지.
- 연도가 명시되지 않은 날짜는 가장 가까운 미래 연도(2026 또는 그 이후)로 해석.
- "오전 반차" → days=0.5, type="반차 오전"`;

    try {
      const data = await MZ.generate(prompt);
      renderRequests(result, data);
    } catch (e) {
      MZ.renderError(result, e);
    } finally {
      MZ.setLoading($('runBtn'), false);
    }
  });

  function renderRequests(target, data) {
    const reqs = data.requests || [];
    const rows = reqs.map((r, i) => `
      <tr>
        <td style="text-align:center;color:var(--muted);">${i+1}</td>
        <td><strong>${MZ.escapeHtml(r.name||'')}</strong></td>
        <td><span class="pill" style="font-size:.7rem;">${MZ.escapeHtml(r.type||'')}</span></td>
        <td style="white-space:nowrap;">${MZ.escapeHtml(r.start||'')} ${r.end && r.end !== r.start ? '~ ' + MZ.escapeHtml(r.end) : ''}</td>
        <td style="text-align:right;">${r.days || ''}일</td>
        <td style="font-size:.85em;color:var(--muted);">${MZ.escapeHtml(r.reason || '—')}</td>
      </tr>
    `).join('');
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <p style="margin:.2rem 0 .8rem;color:var(--muted);font-size:.88rem;">${reqs.length}건 인식</p>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th style="width:32px;">#</th><th>이름</th><th style="width:90px;">종류</th><th>기간</th><th style="width:60px;">일수</th><th>사유</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6"><em>인식 실패</em></td></tr>'}</tbody>
      </table></div>
    `;
    MZ.renderResult(target, {
      title: `휴가 신청 ${reqs.length}건`,
      body: wrap,
      actions: [
        { label: '⬇️ CSV', run: async () => {
          const rows = [['#','이름','종류','시작','종료','일수','사유']];
          reqs.forEach((r, i) => rows.push([i+1, r.name||'', r.type||'', r.start||'', r.end||'', r.days||'', r.reason||'']));
          MZ.downloadFile('leave-requests.csv', '﻿' + MZ.toCSV(rows), 'text/csv;charset=utf-8');
        }},
        { label: '📅 캘린더 등록 텍스트', run: async () => {
          const txt = reqs.map(r => `${r.name} ${r.type} (${r.start}${r.end && r.end !== r.start ? ' ~ ' + r.end : ''})${r.reason ? ' — ' + r.reason : ''}`).join('\n');
          await MZ.copyText(txt);
        }},
        { label: '💬 Slack 승인 카드', run: async () => {
          const txt = reqs.map(r => `📋 *${r.name}* — ${r.type}\n• 기간: ${r.start}${r.end && r.end !== r.start ? ' ~ ' + r.end : ''} (${r.days}일)\n• 사유: ${r.reason || '미기재'}\n• [승인] [반려]`).join('\n\n');
          await MZ.copyText(txt);
        }},
      ]
    });
  }
});
</script>
