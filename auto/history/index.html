<script defer>
(function () {
  const HISTORY_KEY = 'mz:history';

  // 도구 slug → 한글명 (Batch 2 _lib.js TOOLS와 동기화 — sync source는 _lib.js)
  const TOOL_NAMES = {
    'meeting-actions':   '회의록 → 액션아이템',
    'news-digest':       '경쟁사·뉴스 다이제스트',
    'kpi-comment':       '주간 KPI 코멘트',
    'onboarding-kit':    '입사자 환영 키트',
    'leave-summary':     '휴가 신청 정리',
    'pulse-analysis':    '설문 응답 분석',
    'resume-screening':  '이력서 5분 스크리닝',
    'content-calendar':  '30일 콘텐츠 캘린더',
    'lead-scoring':      '리드 스코어링',
    'mention-classifier':'리뷰·멘션 분류기',
    'sales-followup':    '세일즈 콜 후속 메일',
    'mail-reply-drafter':'메일 답장 초안기',
  };

  const $root = document.getElementById('histRoot');
  const $filter = document.getElementById('histFilter');
  const $count = document.getElementById('histCount');
  const $controls = document.getElementById('histControls');
  const $clear = document.getElementById('histClear');

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      return Array.isArray(raw) ? raw : [];
    } catch (_) { return []; }
  }
  function save(arr) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); } catch (_) { /* swallow */ }
  }

  function relTime(iso) {
    const t = new Date(iso).getTime();
    if (isNaN(t)) return '';
    const sec = Math.max(0, Math.floor((Date.now() - t) / 1000));
    if (sec < 60) return '방금 전';
    if (sec < 3600) return Math.floor(sec/60) + '분 전';
    if (sec < 86400) return Math.floor(sec/3600) + '시간 전';
    if (sec < 86400*2) return '어제';
    if (sec < 86400*7) return Math.floor(sec/86400) + '일 전';
    return new Date(iso).toLocaleDateString('ko-KR');
  }

  async function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:absolute;left:-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
    }
  }

  function render() {
    const all = load();
    if (!all.length) {
      $controls.style.display = 'none';
      $root.innerHTML = '<div class="hist-empty">아직 저장된 결과가 없습니다. 도구를 한 번 써 보세요 → <a href="/auto/tools/">도구 모음</a></div>';
      return;
    }
    // 필터 옵션 갱신 (히스토리에 등장한 slug만)
    const slugs = Array.from(new Set(all.map(e => e.slug))).sort();
    const cur = $filter.value;
    $filter.innerHTML = '<option value="">전체 (' + all.length + ')</option>' +
      slugs.map(s => {
        const cnt = all.filter(e => e.slug === s).length;
        const label = (TOOL_NAMES[s] || s) + ' (' + cnt + ')';
        return '<option value="' + escapeHtml(s) + '"' + (s === cur ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
      }).join('');

    const filter = $filter.value;
    const items = filter ? all.filter(e => e.slug === filter) : all;
    $count.textContent = items.length + '개';
    $controls.style.display = 'flex';

    $root.innerHTML = items.map(e => {
      const toolName = TOOL_NAMES[e.slug] || e.slug;
      return `<div class="hist-card" data-id="${escapeHtml(e.id)}">
        <div class="hist-card__head">
          <span class="hist-card__tool">${escapeHtml(toolName)}</span>
          <span class="hist-card__time">${escapeHtml(relTime(e.ts))}</span>
        </div>
        <div class="hist-card__title">${escapeHtml(e.title || '')}</div>
        <p class="hist-card__preview">${escapeHtml(e.preview || '')}${(e.preview || '').length >= 120 ? '…' : ''}</p>
        <div class="hist-card__actions">
          <button type="button" data-act="copy">📋 전체 복사</button>
          <a href="/auto/tools/${escapeHtml(e.slug)}/">🔗 도구 다시 열기</a>
          <button type="button" class="danger" data-act="delete">🗑 이 항목 삭제</button>
        </div>
      </div>`;
    }).join('');
  }

  $filter.addEventListener('change', render);

  $clear.addEventListener('click', () => {
    if (!confirm('저장된 결과 ' + load().length + '개를 모두 삭제할까요? 되돌릴 수 없습니다.')) return;
    try { localStorage.removeItem(HISTORY_KEY); } catch (_) {}
    $filter.value = '';
    render();
  });

  $root.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('[data-act]');
    if (!btn) return;
    const card = btn.closest('.hist-card');
    if (!card) return;
    const id = card.dataset.id;
    const act = btn.dataset.act;
    const all = load();
    const entry = all.find(e => e.id === id);
    if (!entry) return;

    if (act === 'copy') {
      try {
        await copyToClipboard(entry.fullText || entry.preview || '');
        const orig = btn.textContent;
        btn.textContent = '복사됨 ✓';
        btn.classList.add('is-done');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('is-done'); }, 1600);
      } catch (_) { alert('복사에 실패했습니다.'); }
    } else if (act === 'delete') {
      if (!confirm('이 결과 1건을 삭제할까요?')) return;
      save(all.filter(e => e.id !== id));
      render();
    }
  });

  render();
})();
</script>
