name: quant-lab-council-weekly

on:
  schedule:
    # 매주 일요일 18:00 KST (= 09:00 UTC)
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      include_meta:
        description: "Include monthly Meta-Optimizer agent"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: quant-lab-council
  cancel-in-progress: false

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly council (dry-run mode for PR #14)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.include_meta }}" = "true" ]; then
            python -m lab.cli council --include-meta
          else
            python -m lab.cli council
          fi

      - name: Refresh dashboard snapshot
        if: always()
        run: |
          python -m lab.cli snapshot --output ../quant/data

      - name: Commit council artifacts
        if: always()
        run: |
          cd ..
          git add quant/data/ trading/lab/council/agendas/ 2>/dev/null || true
          git add quant/data/council/ quant/data/council-latest.json 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "quant-lab-bot"
            git config user.email "quant-lab-bot@users.noreply.github.com"
            git commit -m "chore(council): weekly meeting $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing"
            git push origin main || echo "push failed"
          else
            echo "no council changes"
          fi
