name: quant-lab-council-weekly

on:
  schedule:
    # 매주 일요일 18:00 KST (= 09:00 UTC)
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      include_meta:
        description: "Include monthly Meta-Optimizer agent"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      force_dry_run:
        description: "Force dry-run mode (skip LLM even if token present)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: quant-lab-council
  cancel-in-progress: false

jobs:
  prepare-agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trading
    outputs:
      llm_enabled: ${{ steps.detect.outputs.llm_enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect LLM mode
        id: detect
        run: |
          if [ "${{ github.event.inputs.force_dry_run }}" = "true" ]; then
            echo "llm_enabled=false" >> $GITHUB_OUTPUT
            echo "forced dry-run via input"
          elif [ -n "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ] || [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "llm_enabled=true" >> $GITHUB_OUTPUT
            echo "LLM mode enabled (token present)"
          else
            echo "llm_enabled=false" >> $GITHUB_OUTPUT
            echo "no LLM token; dry-run mode"
          fi

      - name: Run dry-run council (always — populates agenda)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.include_meta }}" = "true" ]; then
            python -m lab.cli council --include-meta
          else
            python -m lab.cli council
          fi

      - name: Refresh dashboard snapshot (dry-run baseline)
        if: always()
        run: python -m lab.cli snapshot --output ../quant/data

      - name: Commit dry-run artifacts
        if: always()
        run: |
          cd ..
          git add quant/data/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "quant-lab-bot"
            git config user.email "quant-lab-bot@users.noreply.github.com"
            git commit -m "chore(council): agenda + dry-run $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing"
            git push origin main || echo "push failed"
          fi

  llm-council:
    needs: prepare-agenda
    if: needs.prepare-agenda.outputs.llm_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: trading
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LLM council via Claude Code
        # Uses anthropics/claude-code-base-action — runs Claude Code non-interactively.
        # If your repo can't use this action, see SETUP.md for the alternative
        # (run via npx @anthropic-ai/claude-code on a self-hosted runner).
        uses: anthropics/claude-code-base-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: trading/lab/prompts/orchestrator.md
          allowed_tools: "Read,Write,Edit,Bash,Task"
          max_turns: 30
        continue-on-error: true

      - name: Validate LLM output and refresh snapshot
        if: always()
        working-directory: trading
        run: |
          python -m lab.council.parse_llm_output || echo "parse failed; council-latest.json kept from dry-run"
          python -m lab.cli snapshot --output ../quant/data

      - name: Commit LLM council artifacts
        if: always()
        run: |
          git add quant/data/ trading/lab/agents/strategy_agent.py 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "quant-lab-bot"
            git config user.email "quant-lab-bot@users.noreply.github.com"
            git commit -m "council(llm): $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing"
            git push origin main || echo "push failed"
          fi

      - name: Meta-Optimizer auto-PR (if Meta proposed prompt changes)
        if: always() && github.event.inputs.include_meta == 'true'
        working-directory: trading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m lab.council.meta_autopr || echo "meta-autopr skipped (no Meta improvements or branch already exists)"
