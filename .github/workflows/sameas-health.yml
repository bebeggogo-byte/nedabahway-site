name: sameAs URL Health

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday 07:00 UTC (16:00 KST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sameas-health
  cancel-in-progress: true

jobs:
  probe:
    name: Probe external profile URLs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run sameAs probe
        id: probe
        run: |
          set +e
          python3 scripts/check-sameas-urls.py --json > /tmp/sameas.json
          ec=$?
          python3 scripts/check-sameas-urls.py >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open issue if any URL is down
        if: steps.probe.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/sameas.json', 'utf8'));
            const failed = data.results.filter(r => ![200,201,204,301,302,303,304,307,308,401,403,429].includes(r.status));
            if (failed.length === 0) return;
            const body = [
              '## sameAs URL health check failed',
              '',
              'One or more external profile URLs referenced by `knowledge-graph.jsonld` or `_build/seo_patches/*.json` are not responding.',
              '',
              '| Status | Method | URL |',
              '|--:|--|--|',
              ...failed.map(r => `| ${r.status} | ${r.method} | \`${r.url}\` |`),
              '',
              'Action: verify each URL manually. If the profile moved, update both `knowledge-graph.jsonld` and `_build/seo_patches/sameas_supplement.json`, then run `python3 _build/seo_patches/inject_schemas.py` to refresh embedded blocks.',
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const title = `sameAs URL down (${failed.length} URL${failed.length>1?'s':''})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sameas-health',
            });
            const open = existing.data.find(i => i.title.startsWith('sameAs URL down'));
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sameas-health', 'seo'],
              });
            }
