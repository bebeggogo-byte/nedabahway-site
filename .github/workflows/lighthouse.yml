name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'p/**'
      - 'assets/**'
      - '**/*.html'
      - '!_archive_v2/**'
      - '!_archive_magazine_old/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit (/p/* pages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Lighthouse CI
        run: npm install --no-audit --no-fund --prefer-offline -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI on landing pages
        run: lhci autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
