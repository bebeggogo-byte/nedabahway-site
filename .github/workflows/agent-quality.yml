name: Agent Quality

on:
  pull_request:
    paths:
      - '.claude/agents/**'
      - 'scripts/agent-eval.py'
      - '.moai/research/evals/**'
  push:
    paths:
      - '.claude/agents/**'
      - 'scripts/agent-eval.py'
      - '.moai/research/evals/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Agent eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run agent eval
        run: python3 scripts/agent-eval.py

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-scorecard
          path: .moai/research/scorecard.json
