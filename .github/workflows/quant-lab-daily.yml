name: quant-lab-daily

on:
  schedule:
    # KOSPI 마감 후 (15:30 KST = 06:30 UTC), 평일만 실행 (주말 KOSPI 휴장)
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip broker order submission"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: quant-lab-daily
  cancel-in-progress: false

jobs:
  daily-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-flight integration check
        run: python scripts/verify_integration.py

      - name: Run daily cycle (no broker)
        if: ${{ github.event.inputs.dry_run != 'false' }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m lab.cli daily --no-broker

      - name: Run daily cycle (with broker)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          PYTHONUNBUFFERED: "1"
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
          KIS_PAPER: "true"
        run: |
          python -m lab.cli daily

      - name: Export dashboard snapshot
        if: always()
        run: |
          python -m lab.cli snapshot --output ../quant/data

      - name: Commit dashboard snapshot + state DBs
        if: always()
        run: |
          cd ..
          # state DBs persist across Actions runs (CircuitBreaker, equity history)
          git add quant/data/ trading/logs/lab_events.db trading/logs/lab_circuit.db 2>/dev/null || true
          if [ -n "$(git status --porcelain --staged quant/data trading/logs)" ] || [ -n "$(git diff --cached --name-only)" ]; then
            git config user.name "quant-lab-bot"
            git config user.email "quant-lab-bot@users.noreply.github.com"
            git commit -m "chore(quant): daily snapshot $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing to commit"
            git push origin main || echo "push failed (perhaps no changes)"
          else
            echo "no changes to commit"
          fi

      - name: Upload event log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-events-${{ github.run_id }}
          path: trading/logs/*.db
          retention-days: 90
          if-no-files-found: warn
