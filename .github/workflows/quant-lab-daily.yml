name: quant-lab-daily

on:
  schedule:
    # KOSPI 마감 후 (15:30 KST = 06:30 UTC), 평일만 실행 (주말 KOSPI 휴장)
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip broker order submission"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: quant-lab-daily
  cancel-in-progress: false

jobs:
  daily-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily cycle (no broker)
        if: ${{ github.event.inputs.dry_run != 'false' }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m lab.cli daily --no-broker

      - name: Run daily cycle (with broker)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          PYTHONUNBUFFERED: "1"
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
          KIS_PAPER: "true"
        run: |
          python -m lab.cli daily

      - name: Persist event log
        if: always()
        run: |
          if [ -f logs/lab_events.db ]; then
            mkdir -p ../.github/lab-artifacts
            cp logs/lab_events.db ../.github/lab-artifacts/
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-events-${{ github.run_id }}
          path: trading/logs/*.db
          retention-days: 90
          if-no-files-found: warn
