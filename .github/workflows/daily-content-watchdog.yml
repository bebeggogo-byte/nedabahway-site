name: daily-content-watchdog

# Detects stalled daily work on 4 tracks (학습노트, SBM, 관점노트, AI작업실)
# and opens / updates a GitHub issue mentioning @claude so the work resumes
# automatically through the Claude Code GitHub integration.

on:
  schedule:
    # Every day at 21:00 UTC (06:00 KST) — before user's morning.
    - cron: "0 21 * * *"
    # Safety net: also run at 09:00 UTC (18:00 KST) so a one-shot cron failure
    # doesn't silently let the day pass without a check.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      threshold_hours:
        description: "Override staleness threshold (hours) for all tracks"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-content-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run staleness check
        id: check
        run: |
          set -e
          ARGS=""
          if [ -n "${{ inputs.threshold_hours }}" ]; then
            ARGS="--threshold-hours ${{ inputs.threshold_hours }}"
          fi
          python3 scripts/check_daily_progress.py --json $ARGS > report.json
          {
            echo "report<<__END__"
            cat report.json
            echo "__END__"
          } >> "$GITHUB_OUTPUT"
          OVERALL=$(python3 -c "import json; print(json.load(open('report.json'))['overall'])")
          STALE=$(python3 -c "import json; print(','.join(json.load(open('report.json'))['stale_tracks']))")
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"
          echo "stale=$STALE"     >> "$GITHUB_OUTPUT"

      - name: Print human report
        run: python3 scripts/check_daily_progress.py

      - name: Open / update tracking issue when stale
        if: steps.check.outputs.overall == 'stale'
        uses: actions/github-script@v7
        with:
          script: |
            const report = JSON.parse(`${{ steps.check.outputs.report }}`);
            const stale = report.stale_tracks;
            const titleDate = new Date().toISOString().slice(0, 10);
            const title = `[daily-watchdog] ${titleDate} — stalled tracks: ${stale.join(', ')}`;

            const trackLabels = {
              learning:    '학습노트 (learning notes)',
              sbm:         'SBM 성경 관찰',
              perspective: '관점노트 (perspective)',
              ai_studio:   'AI 작업실',
            };

            const trackHints = {
              learning:    '`learning/_data/seeds_queue.jsonl` 상위에서 다음 항목 4개를 골라 batch 발행. 직전 batch 패턴(`batch7`) 그대로 적용.',
              sbm:         '`sbm-progress.json`에서 다음 chapter를 골라 9단계 관찰 노트 작성 후 sbm-progress.json `updated`/`completed_chapters` 갱신.',
              perspective: '`blog/drafts/` 또는 `blog/perspective/`에 신규 초안 1편. 스케줄된 글이 멀리 있다면 다음 schedule slot 채우기.',
              ai_studio:   '`assets/ai-studio/` v2 자산 또는 `ai.html` 점검 / 신규 블럭 추가.',
            };

            let body = `# 일일 작업 정체 감지\n\n`;
            body += `Watchdog가 ${titleDate} 시점에 정체된 트랙을 감지했습니다.\n\n`;
            body += `## 정체 트랙\n\n`;
            for (const t of stale) {
              const info = report.tracks[t];
              const hours = info.hours_since != null ? `${info.hours_since}h` : '알 수 없음';
              const limit = info.threshold_hours != null ? `${info.threshold_hours}h` : '-';
              const last = info.latest_date || '없음';
              body += `### ${trackLabels[t] || t}\n`;
              body += `- 마지막 업데이트: \`${last}\`\n`;
              body += `- 경과 시간: **${hours}** (임계 ${limit})\n`;
              body += `- 다음 단계: ${trackHints[t] || '담당 영역 점검'}\n\n`;
            }

            const healthy = report.healthy_tracks || [];
            if (healthy.length) {
              body += `## 건강 트랙\n\n`;
              for (const t of healthy) {
                body += `- ${trackLabels[t] || t} (\`${report.tracks[t].latest_date}\`)\n`;
              }
              body += `\n`;
            }

            body += `## 자동 재개 요청\n\n`;
            body += `@claude 위 정체된 트랙을 순서대로 진행해 주세요. 학습노트와 SBM이 우선이며, batch 단위는 직전 패턴을 따릅니다.\n\n`;
            body += `---\n\n`;
            body += `\`\`\`json\n${JSON.stringify(report, null, 2)}\n\`\`\`\n\n`;
            body += `_이 이슈는 \`daily-content-watchdog\` 워크플로우가 자동으로 열었습니다. 작업 완료 후 닫아 주세요._\n`;

            const opened = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'daily-watchdog',
              per_page: 100,
            });
            const existing = opened.data.find(i => i.title.startsWith('[daily-watchdog]'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
              });
              core.notice(`Updated existing watchdog issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['daily-watchdog', 'automation'],
              });
              core.notice(`Opened new watchdog issue #${created.data.number}`);
            }

      - name: Auto-close watchdog issues when all tracks healthy
        if: steps.check.outputs.overall == 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const opened = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'daily-watchdog',
              per_page: 100,
            });
            for (const issue of opened.data) {
              if (!issue.title.startsWith('[daily-watchdog]')) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `모든 트랙이 정상 cadence로 복귀했습니다. 이슈를 닫습니다.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.notice(`Closed resolved watchdog issue #${issue.number}`);
            }
