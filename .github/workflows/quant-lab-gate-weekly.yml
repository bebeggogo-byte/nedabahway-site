name: quant-lab-gate-weekly

on:
  schedule:
    # 매주 토요일 22:00 KST (= 13:00 UTC) — council 직전, 의제에 반영 가능
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: quant-lab-gate
  cancel-in-progress: true

jobs:
  evaluate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trading
    outputs:
      all_passed: ${{ steps.run.outputs.all_passed }}
      n_passed: ${{ steps.run.outputs.n_passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Evaluate phase gate
        id: run
        run: |
          python -m lab.cli gate || true
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          gate = json.load(open('../quant/data/phase-gate.json'))
          all_passed = '1' if gate.get('all_passed') else '0'
          n_passed = gate.get('n_passed', 0)
          n_total = gate.get('n_total', 0)
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write(f"all_passed={all_passed}\n")
              f.write(f"n_passed={n_passed}\n")
              f.write(f"n_total={n_total}\n")
          print(f"all_passed={all_passed}, {n_passed}/{n_total}")
          PY

      - name: Refresh dashboard snapshot
        if: always()
        run: python -m lab.cli snapshot --output ../quant/data

      - name: Commit gate report
        if: always()
        run: |
          cd ..
          git add quant/data/phase-gate.json quant/data/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "quant-lab-bot"
            git config user.email "quant-lab-bot@users.noreply.github.com"
            git commit -m "chore(gate): weekly Phase 2→3 evaluation $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing"
            git push origin main || echo "push failed"
          fi

  notify-candidate:
    needs: evaluate-gate
    if: needs.evaluate-gate.outputs.all_passed == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build issue body from gate report
        id: body
        run: |
          python3 - <<'PY' > body.md
          import json
          gate = json.load(open('quant/data/phase-gate.json'))
          print("# Phase 3 진입 후보 — 자동 검증 통과 ✅")
          print()
          print(f"평가: {gate['evaluated_at']}")
          print(f"운영: {gate['paper_days']}일")
          print(f"통과: **{gate['n_passed']} / {gate['n_total']}**")
          print()
          print("## 기준별 결과\n")
          print("| 기준 | 임계값 | 측정 | 결과 |")
          print("|---|---|---|---|")
          for c in gate['criteria']:
              mark = "✅" if c['passed'] else "❌"
              print(f"| {c['label']} | {c['threshold']} | `{c['measured']}` | {mark} |")
          print()
          print("## ⚠️ 자동 전환 안 됨 — 사용자 결정 필요")
          print()
          print("1. 위 기준 모두 통과해도 자동으로 실거래 전환되지 않습니다.")
          print("2. 진입 결정 시 `trading/SETUP.md` 의 **Phase 3 진입** 섹션 참조.")
          print("3. **권장**: 의도 자본의 5~10% 부터 시작, 1개월 모니터링 후 점진 확대.")
          print("4. CRO 의 최근 경고 검토: `quant/data/council-latest.json` 의 vetoes/warnings.")
          print()
          print("이 issue 는 자동 생성됩니다. 진입 결정 후 issue 를 닫으세요.")
          PY

      - name: Open / update issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('body.md', 'utf8');
            const title = '[gate] Phase 3 진입 후보 — 자동 검증 통과';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'phase-gate',
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              console.log(`updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['phase-gate', 'quant-lab', 'needs-decision'],
              });
              console.log(`opened issue #${created.data.number}`);
            }
