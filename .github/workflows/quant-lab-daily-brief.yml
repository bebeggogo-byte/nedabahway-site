name: quant-lab-daily-brief

on:
  schedule:
    # 평일 08:00 KST (= 23:00 UTC 전날) — KOSPI 09:00 개장 1시간 전
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-lab-daily-brief
  cancel-in-progress: true

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily brief
        run: python -m lab.cli report daily

      - name: Refresh dashboard snapshot
        if: always()
        run: python -m lab.cli snapshot --output ../quant/data

      - name: Commit daily brief
        if: always()
        run: |
          cd ..
          git add quant/reports/ quant/data/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "quant-lab-bot"
            git config user.email "quant-lab-bot@users.noreply.github.com"
            git commit -m "chore(brief): daily $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing"
            git push origin main || echo "push failed"
          fi
