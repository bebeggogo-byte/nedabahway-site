# TEMPORARY — checks whether the radio's stream sources answer from the public
# internet and whether a page on nedabah.org may read them (CORS). Remove before merging.
name: Radio stream probe (temporary)
on:
  push:
    branches: [claude/nedabah-radio-5qo4nv]
    paths: ['.github/workflows/radio-stream-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe KBS API, playlist and segment with CORS headers
        run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          O="https://nedabah.org"
          echo "=== API preflight + GET (Origin $O)"
          curl -sS -m 20 -X OPTIONS -D - -o /dev/null -H "Origin: $O" -H "Access-Control-Request-Method: GET" "https://cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/24" | grep -iE "^HTTP|access-control"
          curl -sS -m 20 -D /tmp/h -o /tmp/kbs -H "Origin: $O" -A "$UA" "https://cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/24"; grep -iE "^HTTP|access-control|content-type" /tmp/h
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/kbs'))
          print('keys:', list(d.keys()))
          for it in d.get('channel_item',[]): print('item:', it.get('bitrate'), it.get('media_type'), it.get('service_url','')[:60])
          open('/tmp/m3u8url','w').write(d['channel_item'][0]['service_url'])
          PY
          M=$(cat /tmp/m3u8url)
          echo "=== playlist"
          curl -sS -m 20 -D /tmp/h2 -o /tmp/pl -H "Origin: $O" -A "$UA" "$M"; grep -iE "^HTTP|access-control|content-type|cache-control" /tmp/h2; head -20 /tmp/pl
          base="${M%%\?*}"; base="${base%/*}"; q="${M#*\?}"
          next=$(grep -v '^#' /tmp/pl | grep -m1 .)
          case "$next" in http*) u2="$next";; *) u2="$base/$next";; esac
          echo "=== level 2: $u2" | cut -c1-160
          curl -sS -m 20 -D /tmp/h3 -o /tmp/pl2 -H "Origin: $O" -A "$UA" "$u2"; grep -iE "^HTTP|access-control|content-type" /tmp/h3; head -12 /tmp/pl2
          seg=$(grep -v '^#' /tmp/pl2 | grep -m1 .)
          if [ -n "$seg" ]; then
            case "$seg" in http*) u3="$seg";; *) b2="${u2%%\?*}"; u3="${b2%/*}/$seg";; esac
            echo "=== segment" ; curl -sS -m 20 -D /tmp/h4 -o /tmp/seg -H "Origin: $O" -A "$UA" "$u3" -w "bytes=%{size_download}\n"; grep -iE "^HTTP|access-control|content-type" /tmp/h4
          fi
          echo "=== signed URL expiry (Policy epoch)"; python3 -c "
          import base64,json,re,time
          m=open('/tmp/m3u8url').read(); p=re.search(r'Policy=([^&]+)',m).group(1).replace('_','=').replace('-','+').replace('~','/')
          d=json.loads(base64.b64decode(p+'=='*0)); e=d['Statement'][0]['Condition']['DateLessThan']['AWS:EpochTime']; print('expires in hours:', round((e-time.time())/3600,1))"
          echo "=== bsod with plain UA"; curl -sS -m 15 -o /dev/null -w "%{http_code}\n" "https://radio.bsod.kr/stream/static?stn=kbs&ch=1fm"
