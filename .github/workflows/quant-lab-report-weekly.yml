name: quant-lab-report-weekly

on:
  schedule:
    # 매주 일요일 19:30 KST (= 10:30 UTC) — council (09:00 UTC) 1.5h 후
    - cron: "30 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-lab-report
  cancel-in-progress: true

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trading
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate weekly report
        run: python -m lab.cli report weekly

      - name: Refresh dashboard snapshot
        if: always()
        run: python -m lab.cli snapshot --output ../quant/data

      - name: Commit weekly report
        if: always()
        run: |
          cd ..
          git add quant/reports/ quant/data/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "quant-lab-bot"
            git config user.email "quant-lab-bot@users.noreply.github.com"
            git commit -m "chore(report): weekly $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing"
            git push origin main || echo "push failed"
          fi
