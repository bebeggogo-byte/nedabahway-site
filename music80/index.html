<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>80년대 노래 3초 맞히기</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root{--bg:#F2EBDD;--paper:#FBF8F2;--ink:#22201C;--cob:#1F4FCC;--ora:#C2512A;--gray:#6B655B;--line:#DDD3C2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1A1917;--paper:#26241F;--ink:#ECE6DA;--cob:#7C9BF0;--ora:#E08A63;--gray:#A39B8E;--line:#3A3631}}
:root[data-theme="dark"]{--bg:#1A1917;--paper:#26241F;--ink:#ECE6DA;--cob:#7C9BF0;--ora:#E08A63;--gray:#A39B8E;--line:#3A3631}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
.wrap{min-height:100%;display:flex;flex-direction:column;padding:2.2vw 3vw;gap:1.6vw}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,3.4vw,54px);font-weight:900;line-height:1.15}
header p{margin:.4em 0 0;font-size:clamp(14px,1.3vw,20px);color:var(--gray);font-weight:700}
.round{font-size:clamp(15px,1.4vw,22px);font-weight:900;color:var(--cob);margin:.6vw 0 -.4vw}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2vw}
.tile{border:0;cursor:pointer;background:var(--paper);color:var(--ink);border-radius:16px;padding:1.4vw 1vw;font:inherit;display:flex;flex-direction:column;align-items:center;gap:.4vw;box-shadow:0 2px 0 var(--line);min-height:110px;justify-content:center}
.tile b{font-size:clamp(30px,4vw,64px);font-weight:900;line-height:1;color:var(--cob)}
.tile span{font-size:clamp(12px,1.1vw,17px);font-weight:700;color:var(--gray)}
.tile.done{background:transparent;outline:3px dashed var(--line)}.tile.done b{color:var(--gray)}
.tile:focus-visible,button:focus-visible{outline:3px solid var(--ora);outline-offset:3px}
.teams{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto}
.teams .t{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:6px 8px 6px 16px;font-weight:900;font-size:clamp(14px,1.3vw,20px)}
.teams .t em{font-style:normal;color:var(--cob);min-width:1.6em;text-align:center}
.teams button{border:0;border-radius:999px;width:34px;height:34px;font:inherit;font-weight:900;cursor:pointer;background:var(--cob);color:#fff}
.teams button.m{background:var(--line);color:var(--ink)}
.src{font-size:12px;color:var(--gray)}
/* play view */
.stage{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vw;padding:3vw;text-align:center}
.stage.on{display:flex}
.no{font-size:clamp(20px,2vw,32px);font-weight:900;color:var(--ora)}
.big{font-size:clamp(60px,11vw,180px);font-weight:900;line-height:1}
.ctl{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.ctl button{border:0;border-radius:999px;padding:18px 30px;font:inherit;font-size:clamp(17px,1.7vw,28px);font-weight:900;cursor:pointer;background:var(--paper);color:var(--ink)}
.ctl button.p{background:var(--cob);color:#fff}.ctl button.a{background:var(--ora);color:#fff}
.bar{width:min(560px,80vw);height:14px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--cob)}
.ans{display:none;flex-direction:column;gap:.6vw;align-items:center}.ans.on{display:flex}
.ans .s{font-size:clamp(40px,6vw,96px);font-weight:900;line-height:1.1}
.ans .a{font-size:clamp(22px,2.6vw,42px);font-weight:900;color:var(--cob)}
.ans .r{font-size:clamp(14px,1.4vw,22px);color:var(--gray);font-weight:700}
.ask{font-size:clamp(16px,1.6vw,26px);font-weight:800;background:var(--paper);border-radius:14px;padding:12px 20px}
.pl{position:relative;width:320px;height:180px;border-radius:10px;overflow:hidden}
.pl .cover{position:absolute;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:44px}
.pl.show .cover{display:none}
.tiny{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--gray)}.tiny button{border:1px solid var(--line);background:transparent;color:var(--gray);border-radius:8px;padding:2px 8px;cursor:pointer;font:inherit}
.back{position:absolute;left:2vw;top:2vw;border:0;background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 18px;font:inherit;font-weight:900;cursor:pointer}
.msg{font-size:14px;color:var(--ora);font-weight:700;min-height:1em}
@media (max-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div class="wrap">
 <header><div><h1>80년대 노래, 3초만 듣고 맞히기</h1><p>번호를 누르고 ▶ 3초 듣기 · 손을 먼저 든 팀이 대답 · 맞히면 팀 점수 +1</p></div>
 <div class="src">곡 선정: KBS 가요톱10 1위·10위권 기록(나무위키 「가요톱10/연도」, 한국학중앙연구원 디지털인문학 위키) · 소리: 유튜브 공식 채널 영상</div></header>
 <div class="round">1라운드 · 신나는 노래 다섯 곡</div><div class="grid" id="g1"></div>
 <div class="round">2라운드 · 열 곡</div><div class="grid" id="g2"></div>
 <div class="teams" id="teams"></div>
</div>
<div class="stage" id="stage">
 <button class="back" id="back">← 목록</button>
 <div class="no" id="no"></div>
 <div class="big" id="big">♪</div>
 <div class="bar"><i id="bar"></i></div>
 <div class="ctl"><button class="p" id="play3">▶ 3초 듣기</button><button id="again">한 번 더 3초</button><button id="more">5초 더 듣기</button><button class="a" id="reveal">정답 보기</button></div>
 <div class="msg" id="msg"></div>
 <div class="ans" id="ans"><div class="s" id="as"></div><div class="a" id="aa"></div><div class="r" id="ar"></div>
  <div class="ask">이 노래가 나올 때, 나는 몇 살이었고 어디에 있었나요?</div>
  <div class="ctl"><button class="p" id="cont">▶ 이어서 20초</button><button id="stop">■ 멈춤</button></div></div>
 <div class="pl" id="pl"><div id="yt"></div><div class="cover">🎵</div></div>
 <div class="tiny">시작 위치 <button id="sm">−1초</button><span id="sv"></span><button id="sp">+1초</button><span>(노래가 엉뚱한 곳에서 시작하면 조절 · 이 컴퓨터에 저장)</span></div>
</div>
<script>
const SONGS = [{"artist": "윤수일", "song": "아파트", "rel": 1982, "rank": "가요톱10 1위(1984.1, 3주 연속)", "id": "WvP1g7eic0U", "start": 140}, {"artist": "김흥국", "song": "호랑나비", "rel": 1989, "rank": "가요톱10 1위(1989.10)", "id": "FvRjJJG5RCE", "start": 99}, {"artist": "김종찬", "song": "토요일은 밤이 좋아", "rel": 1987, "rank": "가요톱10 1위(1988.11)", "id": "ssGeVUrpt4c", "start": 21}, {"artist": "이상은", "song": "담다디", "rel": 1988, "rank": "가요톱10 2위(1988)", "id": "AkFUq2WmzJs", "start": 140}, {"artist": "소방차", "song": "어젯밤 이야기", "rel": 1987, "rank": "가요톱10 4위(1988)", "id": "2wyk6mnm1FA", "start": 50}, {"artist": "조용필", "song": "못찾겠다 꾀꼬리", "rel": 1982, "rank": "가요톱10 10주 연속 1위(1982) · 골든컵 제도의 시작", "id": "0N1dN9NxWjQ", "start": 56}, {"artist": "조용필", "song": "친구여", "rel": 1983, "rank": "가요톱10 1위 · 골든컵(1984.3)", "id": "AafOAktPjCc", "start": 178}, {"artist": "이선희", "song": "J에게", "rel": 1984, "rank": "가요톱10 2위(1984)", "id": "9eBeHuSLHYI", "start": 10}, {"artist": "이문세", "song": "난 아직 모르잖아요", "rel": 1985, "rank": "가요톱10 1위(1986.6)", "id": "QZcbGwfgHoQ", "start": 167}, {"artist": "구창모", "song": "아픈만큼 성숙해지고", "rel": 1986, "rank": "가요톱10 1위 · 골든컵(1986.9)", "id": "fiI4t8AoIA8", "start": 121}, {"artist": "높은음자리", "song": "바다에 누워", "rel": 1985, "rank": "가요톱10 1위 · 골든컵(1986.6)", "id": "NHJbymv1naQ", "start": 73}, {"artist": "이재성", "song": "촛불잔치", "rel": 1986, "rank": "가요톱10 1위(1987.2)", "id": "lX1jcWZtRLo", "start": 19}, {"artist": "주현미", "song": "신사동 그 사람", "rel": 1988, "rank": "가요톱10 2위(1988)", "id": "siKZMFkIIwY", "start": 41}, {"artist": "박남정", "song": "널 그리며", "rel": 1988, "rank": "가요톱10 1위(1989.2)", "id": "g21lBGfnzfs", "start": 64}, {"artist": "변진섭", "song": "홀로 된다는 것", "rel": 1988, "rank": "가요톱10 2위(1989)", "id": "Scl7JjcWTiU", "start": 34}];
const TEAMS = 5;
let score = Array(TEAMS).fill(0), done = new Set(), cur = -1, player = null, ready = false, stopT = null, barT = null;
function load(k, d){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}}
function save(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch(e){}}
score = load('m80_score', score); done = new Set(load('m80_done', [])); const offs = load('m80_offs', {});
const $ = id => document.getElementById(id);
function startOf(i){return Math.max(0, SONGS[i].start + (offs[i] || 0))}
function grid(){
  [['g1',0,5],['g2',5,15]].forEach(([g,a,b])=>{const el=$(g);el.innerHTML='';for(let i=a;i<b;i++){const t=document.createElement('button');t.className='tile'+(done.has(i)?' done':'');t.innerHTML=`<b>${i+1}</b><span>${done.has(i)?SONGS[i].song:'3초 듣기'}</span>`;t.onclick=()=>open(i);el.appendChild(t)}});
  const tm=$('teams');tm.innerHTML='';for(let k=0;k<TEAMS;k++){const d=document.createElement('div');d.className='t';d.innerHTML=`${k+1}팀 <em>${score[k]}</em>`;const p=document.createElement('button');p.textContent='+';p.onclick=()=>{score[k]++;save('m80_score',score);grid()};const m=document.createElement('button');m.textContent='−';m.className='m';m.onclick=()=>{score[k]=Math.max(0,score[k]-1);save('m80_score',score);grid()};d.append(m,p);tm.appendChild(d)}
  const r=document.createElement('button');r.textContent='↺';r.title='점수·진행 초기화';r.className='m';r.style.cssText='border:0;border-radius:99px;width:34px;height:34px;cursor:pointer';r.onclick=()=>{if(confirmReset()){score=Array(TEAMS).fill(0);done=new Set();save('m80_score',score);save('m80_done',[]);grid()}};tm.appendChild(r);
}
let resetArm=0;function confirmReset(){const n=Date.now();if(n-resetArm<2500)return true;resetArm=n;const tm=$('teams');const s=document.createElement('span');s.className='src';s.textContent=' 한 번 더 누르면 초기화';tm.appendChild(s);setTimeout(()=>s.remove(),2500);return false}
function open(i){cur=i;$('stage').classList.add('on');$('no').textContent=(i<5?'1라운드 · ':'2라운드 · ')+(i+1)+'번 노래';$('big').textContent='♪ '+(i+1);$('ans').classList.remove('on');$('pl').classList.remove('show');$('sv').textContent=startOf(i)+'초';$('msg').innerHTML='<a href="https://www.youtube.com/watch?v='+SONGS[i].id+'&t='+startOf(i)+'s" target="_blank" style="color:#888;font-weight:400;font-size:12px">재생이 안 되면: 유튜브에서 열기</a>';stop();if(ready)player.cueVideoById({videoId:SONGS[i].id,startSeconds:startOf(i)})}
function play(sec, from){if(!ready){$('msg').textContent='플레이어를 불러오는 중입니다. 인터넷 연결을 확인하고 잠시 뒤 다시 눌러 주세요.';return}
  clearTimeout(stopT);clearInterval(barT);player.seekTo(from,true);player.playVideo();const t0=Date.now();$('bar').style.width='0';
  barT=setInterval(()=>{const p=Math.min(1,(Date.now()-t0)/(sec*1000));$('bar').style.width=(p*100)+'%';if(p>=1)clearInterval(barT)},50);
  stopT=setTimeout(()=>{player.pauseVideo()},sec*1000)}
function stop(){clearTimeout(stopT);clearInterval(barT);$('bar').style.width='0';if(ready)try{player.pauseVideo()}catch(e){}}
$('play3').onclick=()=>play(3,startOf(cur));$('again').onclick=()=>play(3,startOf(cur));$('more').onclick=()=>play(5,startOf(cur)+3);
$('reveal').onclick=()=>{const s=SONGS[cur];$('as').textContent='「'+s.song+'」';$('aa').textContent=s.artist+' · '+s.rel+'년';$('ar').textContent=s.rank;$('ans').classList.add('on');$('pl').classList.add('show');done.add(cur);save('m80_done',[...done])};
$('cont').onclick=()=>play(20,startOf(cur));$('stop').onclick=stop;
$('back').onclick=()=>{stop();$('stage').classList.remove('on');grid()};
$('sm').onclick=()=>{offs[cur]=(offs[cur]||0)-1;save('m80_offs',offs);$('sv').textContent=startOf(cur)+'초'};
$('sp').onclick=()=>{offs[cur]=(offs[cur]||0)+1;save('m80_offs',offs);$('sv').textContent=startOf(cur)+'초'};
document.addEventListener('keydown',e=>{if(!$('stage').classList.contains('on'))return;if(e.key===' '){e.preventDefault();play(3,startOf(cur))}if(e.key==='Enter')$('reveal').click();if(e.key==='Escape')$('back').click()});
window.onYouTubeIframeAPIReady=function(){player=new YT.Player('yt',{width:320,height:180,videoId:SONGS[0].id,playerVars:{controls:0,disablekb:1,rel:0,playsinline:1,modestbranding:1},events:{onReady:()=>{ready=true;if(cur>=0)player.cueVideoById({videoId:SONGS[cur].id,startSeconds:startOf(cur)})},onError:e=>{const u='https://www.youtube.com/watch?v='+SONGS[cur].id+'&t='+startOf(cur)+'s';$('msg').innerHTML='여기서 재생되지 않는 영상입니다. <a href="'+u+'" target="_blank" style="color:var(--cob)">▶ 유튜브에서 열기</a> (노래 시작 지점에서 열립니다)'}}})};
grid();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
