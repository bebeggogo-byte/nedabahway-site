<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — 네다바웨이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:   #1A2D45;
    --teal:   #1A7264;
    --bg:     #F8F7F4;
    --bg-warm:#F5F2EC;
    --stone:  #78726C;
    --text:   #1C1C1C;
    --border: #E0DDD8;
    --red:    #C0392B;
    --green:  #1A7264;
    --radius: 8px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Login Screen ──────────────────────────── */
  #loginScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 40px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .login-logo {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 8px;
  }

  .login-title {
    font-size: 22px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 32px;
  }

  .login-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
    text-align: left;
  }

  .login-field label {
    font-size: 12px;
    font-weight: 500;
    color: var(--stone);
    letter-spacing: 0.05em;
  }

  .login-field input {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
  }

  .login-field input:focus {
    border-color: var(--teal);
    background: #fff;
  }

  .login-btn {
    width: 100%;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 13px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    letter-spacing: 0.04em;
    transition: background 0.15s;
  }

  .login-btn:hover { background: #243d5a; }

  .login-error {
    margin-top: 14px;
    font-size: 13px;
    color: var(--red);
    min-height: 18px;
  }

  /* ── Admin Panel ──────────────────────────── */
  #adminPanel { display: none; }

  .adm-header {
    background: var(--navy);
    color: #fff;
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .adm-header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .adm-logo {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .adm-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .adm-header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .adm-stat {
    font-size: 12px;
    opacity: 0.7;
  }

  .adm-stat span {
    font-weight: 600;
    opacity: 1;
    color: #A8DFCC;
  }

  .adm-logout {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 5px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .adm-logout:hover { background: rgba(255,255,255,0.2); }

  /* ── Toolbar ─────────────────────────────── */
  .adm-toolbar {
    padding: 16px 32px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .filter-group {
    display: flex;
    gap: 6px;
  }

  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    color: var(--stone);
    transition: all 0.15s;
  }

  .filter-btn.active, .filter-btn:hover {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
  }

  .search-input {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    width: 200px;
    transition: border-color 0.15s;
  }

  .search-input:focus {
    border-color: var(--teal);
    background: #fff;
  }

  .spacer { flex: 1; }

  .export-btn {
    background: none;
    border: 1px solid var(--teal);
    color: var(--teal);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .export-btn:hover {
    background: var(--teal);
    color: #fff;
  }

  .clear-all-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--stone);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .clear-all-btn:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* ── Inquiry List ────────────────────────── */
  .adm-body {
    padding: 24px 32px;
    max-width: 1100px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 0;
    color: var(--stone);
  }

  .empty-state p:first-child {
    font-size: 32px;
    margin-bottom: 12px;
  }

  .empty-state p:last-child {
    font-size: 14px;
    opacity: 0.7;
  }

  .inquiry-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .inquiry-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: box-shadow 0.15s;
  }

  .inquiry-card:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  .inquiry-card.unread {
    border-left: 3px solid var(--teal);
  }

  .inquiry-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
  }

  .inquiry-unread-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    flex-shrink: 0;
    display: none;
  }

  .inquiry-card.unread .inquiry-unread-dot {
    display: block;
  }

  .inquiry-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  .inquiry-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--navy);
    white-space: nowrap;
  }

  .inquiry-type-badge {
    background: var(--bg-warm);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--stone);
    white-space: nowrap;
  }

  .inquiry-preview {
    font-size: 13px;
    color: var(--stone);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }

  .inquiry-date {
    font-size: 11px;
    color: var(--stone);
    white-space: nowrap;
    opacity: 0.8;
  }

  .inquiry-chevron {
    font-size: 12px;
    color: var(--stone);
    transition: transform 0.2s;
  }

  .inquiry-card.open .inquiry-chevron {
    transform: rotate(180deg);
  }

  .inquiry-body {
    display: none;
    border-top: 1px solid var(--border);
    padding: 20px 24px;
    background: var(--bg);
  }

  .inquiry-card.open .inquiry-body {
    display: block;
  }

  .inquiry-detail-grid {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 8px 16px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .inquiry-detail-label {
    color: var(--stone);
    font-weight: 500;
  }

  .inquiry-detail-value {
    color: var(--text);
    word-break: break-all;
  }

  .inquiry-message-box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    margin-bottom: 16px;
  }

  .inquiry-actions {
    display: flex;
    gap: 8px;
  }

  .action-btn {
    border-radius: 5px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .action-btn.read-toggle {
    background: var(--teal);
    border: 1px solid var(--teal);
    color: #fff;
  }

  .action-btn.read-toggle:hover {
    background: var(--teal-2, #0F5A50);
    border-color: var(--teal-2, #0F5A50);
  }

  .action-btn.delete-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--stone);
  }

  .action-btn.delete-btn:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* ── Result count ─────────────────────────── */
  .result-count {
    font-size: 12px;
    color: var(--stone);
    margin-bottom: 14px;
    padding: 0 2px;
  }

  /* ── Toast ───────────────────────────────── */
  #adminToast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--navy);
    color: #fff;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    pointer-events: none;
    z-index: 100;
  }

  #adminToast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Responsive ──────────────────────────── */
  @media (max-width: 640px) {
    .adm-header { padding: 0 16px; }
    .adm-toolbar { padding: 12px 16px; }
    .adm-body { padding: 16px; }
    .inquiry-preview { display: none; }
    .inquiry-detail-grid { grid-template-columns: 80px 1fr; }
    .adm-stat { display: none; }
  }
</style>
<meta name="robots" content="noindex,nofollow">
</head>
<body>

<!-- ── Login ─────────────────────────────────────── -->
<div id="loginScreen">
  <div class="login-card">
    <p class="login-logo">Nedabah Way</p>
    <h1 class="login-title">관리자 로그인</h1>
    <div class="login-field">
      <label for="adminUser">아이디</label>
      <input type="text" id="adminUser" placeholder="admin" autocomplete="username">
    </div>
    <div class="login-field">
      <label for="adminPass">비밀번호</label>
      <input type="password" id="adminPass" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn">로그인</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<!-- ── Admin Panel ────────────────────────────────── -->
<div id="adminPanel">

  <header class="adm-header">
    <div class="adm-header-left">
      <span class="adm-logo">IDEN</span>
      <span class="adm-title">문의 관리</span>
    </div>
    <div class="adm-header-right">
      <span class="adm-stat">전체 <span id="statTotal">0</span>건</span>
      <span class="adm-stat">미확인 <span id="statUnread">0</span>건</span>
      <button class="adm-logout" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="adm-toolbar">
    <div class="filter-group" id="filterGroup">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="unread">미확인</button>
      <button class="filter-btn" data-filter="read">확인완료</button>
    </div>
    <input class="search-input" type="search" id="searchInput" placeholder="이름 · 연락처 · 내용 검색…">
    <div class="spacer"></div>
    <button class="export-btn" id="exportBtn">CSV 내보내기</button>
    <button class="clear-all-btn" id="clearAllBtn">전체 삭제</button>
  </div>

  <div class="adm-body">
    <p class="result-count" id="resultCount"></p>
    <div id="inquiryList"></div>
  </div>
</div>

<div id="adminToast"></div>

<script>
'use strict';

const INQUIRY_KEY   = 'ndw_inquiries_v1';
const SESSION_KEY   = 'ndw_admin_session';

/* ── Credentials ─────────────────────────────
   Change ADMIN_USER / ADMIN_PASS below.
   These are stored only in the browser; this is
   a lightweight client-side guard, NOT server auth.
─────────────────────────────────────────────── */
const ADMIN_USER = 'nedabah';
const ADMIN_PASS = 'iden2024!';

/* ── Login ──────────────────────────────────── */
const loginScreen = document.getElementById('loginScreen');
const adminPanel  = document.getElementById('adminPanel');
const loginError  = document.getElementById('loginError');

function checkSession() {
  return sessionStorage.getItem(SESSION_KEY) === 'ok';
}

function showAdmin() {
  loginScreen.style.display = 'none';
  adminPanel.style.display  = 'block';
  renderAll();
}

if (checkSession()) showAdmin();

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('adminPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('adminUser').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('adminPass').focus();
});

function doLogin() {
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value;
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    sessionStorage.setItem(SESSION_KEY, 'ok');
    loginError.textContent = '';
    showAdmin();
  } else {
    loginError.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
    document.getElementById('adminPass').value = '';
    document.getElementById('adminPass').focus();
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
});

/* ── Data helpers ───────────────────────────── */
function loadList() {
  try { return JSON.parse(localStorage.getItem(INQUIRY_KEY) || '[]'); }
  catch { return []; }
}

function saveList(list) {
  localStorage.setItem(INQUIRY_KEY, JSON.stringify(list));
}

/* ── State ──────────────────────────────────── */
let currentFilter = 'all';
let searchQuery   = '';

/* ── Render ─────────────────────────────────── */
function renderAll() {
  const list = loadList();
  updateStats(list);

  const filtered = list.filter(item => {
    if (currentFilter === 'unread' && item.read)  return false;
    if (currentFilter === 'read'   && !item.read) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return (item.name    || '').toLowerCase().includes(q)
          || (item.contact || '').toLowerCase().includes(q)
          || (item.message || '').toLowerCase().includes(q)
          || (item.type    || '').toLowerCase().includes(q);
    }
    return true;
  });

  const rc = document.getElementById('resultCount');
  rc.textContent = `${filtered.length}건 표시 중 (전체 ${list.length}건)`;

  const container = document.getElementById('inquiryList');
  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <p>📭</p>
        <p>${searchQuery ? '검색 결과가 없습니다.' : '접수된 문의가 없습니다.'}</p>
      </div>`;
    return;
  }

  container.innerHTML = '';
  filtered.forEach(item => {
    container.appendChild(buildCard(item));
  });
}

function updateStats(list) {
  document.getElementById('statTotal').textContent  = list.length;
  document.getElementById('statUnread').textContent = list.filter(i => !i.read).length;
}

function buildCard(item) {
  const card = document.createElement('div');
  card.className = 'inquiry-card' + (item.read ? '' : ' unread');
  card.dataset.id = item.id;

  const preview = (item.message || '').replace(/\n/g, ' ').slice(0, 60);

  card.innerHTML = `
    <div class="inquiry-header">
      <div class="inquiry-unread-dot"></div>
      <div class="inquiry-meta">
        <span class="inquiry-name">${esc(item.name || '(이름없음)')}</span>
        <span class="inquiry-type-badge">${esc(item.type || '유형없음')}</span>
        <span class="inquiry-preview">${esc(preview)}${preview.length >= 60 ? '…' : ''}</span>
      </div>
      <span class="inquiry-date">${esc(item.date || '')}</span>
      <span class="inquiry-chevron">▼</span>
    </div>
    <div class="inquiry-body">
      <div class="inquiry-detail-grid">
        <span class="inquiry-detail-label">이름</span>
        <span class="inquiry-detail-value">${esc(item.name || '')}</span>
        <span class="inquiry-detail-label">연락처</span>
        <span class="inquiry-detail-value">${esc(item.contact || '')}</span>
        <span class="inquiry-detail-label">문의유형</span>
        <span class="inquiry-detail-value">${esc(item.type || '')}</span>
        <span class="inquiry-detail-label">접수일시</span>
        <span class="inquiry-detail-value">${esc(item.date || '')}</span>
      </div>
      <div class="inquiry-message-box">${esc(item.message || '')}</div>
      <div class="inquiry-actions">
        <button class="action-btn read-toggle" data-id="${item.id}">
          ${item.read ? '미확인으로 변경' : '확인 완료'}
        </button>
        <button class="action-btn delete-btn" data-id="${item.id}">삭제</button>
      </div>
    </div>`;

  /* Toggle open/close */
  card.querySelector('.inquiry-header').addEventListener('click', () => {
    const wasOpen = card.classList.contains('open');
    card.classList.toggle('open', !wasOpen);
    /* Mark read when opening */
    if (!wasOpen && !item.read) {
      markRead(item.id, true);
    }
  });

  /* Read toggle */
  card.querySelector('.read-toggle').addEventListener('click', e => {
    e.stopPropagation();
    markRead(item.id, !item.read);
  });

  /* Delete */
  card.querySelector('.delete-btn').addEventListener('click', e => {
    e.stopPropagation();
    if (confirm('이 문의를 삭제하시겠습니까?')) {
      deleteInquiry(item.id);
    }
  });

  return card;
}

function markRead(id, read) {
  const list = loadList().map(i => i.id === id ? { ...i, read } : i);
  saveList(list);
  renderAll();
  showToast(read ? '확인 완료로 표시했습니다.' : '미확인으로 변경했습니다.');
}

function deleteInquiry(id) {
  saveList(loadList().filter(i => i.id !== id));
  renderAll();
  showToast('삭제되었습니다.');
}

/* ── Filters ────────────────────────────────── */
document.getElementById('filterGroup').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderAll();
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderAll();
});

/* ── Export CSV ─────────────────────────────── */
document.getElementById('exportBtn').addEventListener('click', () => {
  const list = loadList();
  if (list.length === 0) { showToast('내보낼 데이터가 없습니다.'); return; }

  const header = ['접수일시', '이름', '연락처', '문의유형', '내용', '확인여부'];
  const rows = list.map(i => [
    i.date    || '',
    i.name    || '',
    i.contact || '',
    i.type    || '',
    (i.message || '').replace(/"/g, '""').replace(/\n/g, ' '),
    i.read ? '확인' : '미확인'
  ].map(v => `"${v}"`).join(','));

  const csv = '\uFEFF' + [header.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), {
    href: url,
    download: `nedabah_inquiries_${new Date().toISOString().slice(0,10)}.csv`
  });
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('CSV로 내보냈습니다.');
});

/* ── Clear All ──────────────────────────────── */
document.getElementById('clearAllBtn').addEventListener('click', () => {
  const list = loadList();
  if (list.length === 0) { showToast('삭제할 데이터가 없습니다.'); return; }
  if (confirm(`전체 ${list.length}건의 문의를 모두 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) {
    saveList([]);
    renderAll();
    showToast('전체 삭제되었습니다.');
  }
});

/* ── Toast ──────────────────────────────────── */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('adminToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── Escape helper ──────────────────────────── */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
</script>
