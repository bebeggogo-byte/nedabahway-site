# Lychee link checker config — internal + external link validation
# https://lychee.cli.rs/usage/config/

# 검사 범위
include_verbatim = false
include_fragments = true
max_concurrency = 16
max_redirects = 5
max_retries = 2
retry_wait_time = 2
timeout = 20

# 검사 대상 — HTML만, 아카이브·외부 의존성 제외
include = [
  "*.html",
  "blog/**/*.html",
  "p/**/*.html",
  "magazine/**/*.html",
  "resources/**/*.html"
]

exclude_path = [
  "_archive_v2",
  "_archive_magazine_old",
  "node_modules",
  ".moai",
  ".claude",
  ".git",
  ".github",
  "blog/perspective/_archive_v2_20",
  "blog/perspective/perspective_old_129",
  "resources/_console",
  "resources/_data",
  "resources/_build",
  "_build"
]

# 외부 도메인은 별도 도구에서 — CI에서는 내부 링크만 검증
exclude = [
  "^https?://localhost",
  "^http://127.0.0.1",
  "^mailto:",
  "^tel:",
  "^javascript:",
  "^https://www.youtube.com/channel/",
  "^https://blog.naver.com/",
  "^https://www.linkedin.com/",
  "^https://github.com/",
  "^https://schema.org",
  "^https://orcid.org",
  "^https://www.googletagmanager.com",
  "^https://www.google.com",
  "^https://www.youtube.com/embed/",
  "^https://i.ytimg.com",
  "^https://chatgpt.com",
  "^https://chat.openai.com",
  "^https://gpters.org",
  "^https://kmong.com",
  "^https://www.saramin.co.kr",
  "^https://mcc.megastudy.net",
  "^https://www.nedabah.org/p/.*\\.html#",
  "^https://www.nedabah.org/contact"
]

# 외부 링크는 워닝으로만
accept = ["200", "204", "206", "301", "302", "304", "307", "308", "401", "403", "429"]

# 본문이 변경된 PR에서만 활성화 — 캐시 사용
cache = true
max_cache_age = "1d"

# 경로 구성
base = "."
