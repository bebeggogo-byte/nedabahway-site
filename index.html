<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFBFC">
<title>네다바웨이 | nedabahway</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* ========================================
   DESIGN TOKENS
   ======================================== */
:root {
  --c-pri: #2C6E63;
  --c-pri-l: #4A9E8F;
  --c-pri-bg: #EFF7F5;
  --c-pri-bg2: #D8EEEA;
  --c-sec: #C48B5C;
  --c-sec-l: #D4A87A;
  --c-sec-bg: #FDF6F0;
  --c-acc: #5B7EC2;
  --c-acc-bg: #EEF2FA;
  --c-txt: #2D3436;
  --c-txt2: #636E72;
  --c-txt3: #95A5A6;
  --c-bg: #FAFBFC;
  --c-card: #FFFFFF;
  --c-bdr: #E8ECEF;
  --c-div: #F3F5F6;
  --ff: 'Pretendard Variable', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --sh-xs: 0 1px 2px rgba(0,0,0,.04);
  --sh-sm: 0 2px 8px rgba(0,0,0,.05);
  --sh-md: 0 4px 16px rgba(0,0,0,.07);
  --sh-lg: 0 8px 30px rgba(0,0,0,.09);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --ease-out: cubic-bezier(.25,.46,.45,.94);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}

/* ========================================
   RESET & BASE
   ======================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--ff);
  color: var(--c-txt);
  background: var(--c-bg);
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
  min-height: 100dvh;
}
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; border: none; background: none; outline: none; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
img { display: block; max-width: 100%; }
svg { display: inline-block; vertical-align: middle; }
ul, ol { list-style: none; }

/* ========================================
   APP SHELL
   ======================================== */
#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
  background: var(--c-bg);
}

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: rgba(250,251,252,.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid transparent;
  transition: border-color .3s, background .3s;
}
.header.scrolled {
  border-bottom-color: var(--c-bdr);
  background: rgba(255,255,255,.95);
}
.header__logo {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 1.15rem;
  letter-spacing: -.01em;
}
.header__logo-b { font-weight: 700; color: var(--c-pri); }
.header__logo-l { font-weight: 300; color: var(--c-txt2); }

/* Main Content */
.main {
  padding: 0 0 calc(68px + var(--safe-b));
  min-height: calc(100dvh - 58px);
}

/* Bottom Nav */
.nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  height: calc(62px + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--c-bdr);
  display: flex;
  justify-content: space-around;
  align-items: flex-start;
  padding-top: 6px;
  z-index: 100;
}
.nav__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 52px;
  padding: 4px 6px;
  color: var(--c-txt3);
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .02em;
  transition: color .25s;
  position: relative;
}
.nav__item::before {
  content: '';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%) scaleX(0);
  width: 20px;
  height: 3px;
  border-radius: 2px;
  background: var(--c-pri);
  transition: transform .3s var(--ease-spring);
}
.nav__item.active { color: var(--c-pri); font-weight: 600; }
.nav__item.active::before { transform: translateX(-50%) scaleX(1); }
.nav__item svg { width: 22px; height: 22px; stroke-width: 1.8; }

/* ========================================
   VIEW TRANSITIONS
   ======================================== */
.v-enter { animation: fadeSlideIn .4s var(--ease-out) forwards; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Scroll-reveal */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity .6s var(--ease-out), transform .6s var(--ease-out);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-d1 { transition-delay: .1s; }
.reveal-d2 { transition-delay: .2s; }
.reveal-d3 { transition-delay: .3s; }
.reveal-d4 { transition-delay: .4s; }

/* ========================================
   COMPONENTS
   ======================================== */

/* Section */
.section { padding: 0 20px; }
.section__label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--c-pri);
  margin-bottom: 8px;
}
.section__title {
  font-size: 1.35rem;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -.02em;
  color: var(--c-txt);
  margin-bottom: 6px;
}
.section__desc {
  font-size: .9rem;
  color: var(--c-txt2);
  line-height: 1.7;
  margin-bottom: 20px;
}

/* Card */
.card {
  background: var(--c-card);
  border-radius: var(--r-lg);
  padding: 24px;
  box-shadow: var(--sh-sm);
  border: 1px solid rgba(0,0,0,.03);
  transition: transform .2s, box-shadow .2s;
}
.card:hover { box-shadow: var(--sh-md); }
.card--tap { cursor: pointer; }
.card--tap:active { transform: scale(.985); }
.card--flat { box-shadow: none; border: 1px solid var(--c-bdr); }
.card--accent { border-left: 4px solid var(--c-pri); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 48px;
  padding: 0 28px;
  border-radius: 24px;
  font-size: .92rem;
  font-weight: 600;
  transition: all .2s;
}
.btn--pri {
  background: var(--c-pri);
  color: #fff;
}
.btn--pri:active { background: #245A52; transform: scale(.97); }
.btn--sec {
  background: var(--c-pri-bg);
  color: var(--c-pri);
}
.btn--sec:active { background: var(--c-pri-bg2); }
.btn--outline {
  background: transparent;
  border: 1.5px solid var(--c-bdr);
  color: var(--c-txt2);
}
.btn--outline:active { background: var(--c-div); }
.btn--sm { height: 38px; padding: 0 18px; font-size: .82rem; border-radius: 19px; }
.btn--full { width: 100%; }
.btn--warm {
  background: var(--c-sec);
  color: #fff;
}

/* Tag / Chip */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: .75rem;
  font-weight: 500;
  background: var(--c-div);
  color: var(--c-txt2);
}
.tag--pri { background: var(--c-pri-bg); color: var(--c-pri); }

/* Quote Block */
.quote-block {
  position: relative;
  padding: 28px 24px 24px 28px;
  background: var(--c-sec-bg);
  border-radius: var(--r-lg);
  border-left: 4px solid var(--c-sec-l);
}
.quote-block::before {
  content: '\201C';
  position: absolute;
  top: 8px;
  left: 14px;
  font-size: 2.5rem;
  color: var(--c-sec-l);
  line-height: 1;
  font-family: Georgia, serif;
}
.quote-block__text {
  font-size: .95rem;
  line-height: 1.8;
  color: var(--c-txt);
  font-weight: 500;
}
.quote-block__ref {
  margin-top: 10px;
  font-size: .78rem;
  color: var(--c-txt3);
}

/* Step Indicator */
.steps {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 8px;
}
.step {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  position: relative;
}
.step__num {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .82rem;
  font-weight: 700;
  background: var(--c-pri);
  color: #fff;
  position: relative;
  z-index: 2;
}
.step__label {
  margin-top: 8px;
  font-size: .78rem;
  font-weight: 600;
  color: var(--c-txt);
  text-align: center;
}
.step__desc {
  font-size: .68rem;
  color: var(--c-txt3);
  text-align: center;
  margin-top: 2px;
  line-height: 1.4;
}
.step-line {
  flex: 0 0 auto;
  width: 32px;
  height: 2px;
  background: var(--c-pri-bg2);
  margin: 0 -4px;
  margin-bottom: 28px;
}

/* Accordion */
.accordion { border-radius: var(--r-lg); overflow: hidden; }
.accordion__item {
  background: var(--c-card);
  border: 1px solid var(--c-bdr);
  margin-bottom: -1px;
}
.accordion__item:first-child { border-radius: var(--r-lg) var(--r-lg) 0 0; }
.accordion__item:last-child { border-radius: 0 0 var(--r-lg) var(--r-lg); }
.accordion__item.open .accordion__body { display: block; }
.accordion__item.open .accordion__icon { transform: rotate(180deg); }
.accordion__head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 20px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.accordion__head:active { background: var(--c-div); }
.accordion__emoji {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.accordion__title {
  flex: 1;
  font-size: .92rem;
  font-weight: 600;
  color: var(--c-txt);
}
.accordion__sub {
  font-size: .75rem;
  color: var(--c-txt3);
  font-weight: 400;
  margin-top: 2px;
}
.accordion__icon {
  color: var(--c-txt3);
  transition: transform .3s var(--ease-out);
  flex-shrink: 0;
}
.accordion__body {
  display: none;
  padding: 0 20px 20px 74px;
  font-size: .88rem;
  color: var(--c-txt2);
  line-height: 1.75;
}
.accordion__cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
  padding: 11px 0;
  border-radius: 12px;
  font-size: .84rem;
  font-weight: 600;
  transition: all .2s;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
}
.accordion__cta:active { transform: scale(.97); filter: brightness(.95); }

/* Contact Category */
.contact-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  background: var(--c-card);
  border-radius: var(--r-md);
  border: 1px solid var(--c-bdr);
  cursor: pointer;
  transition: all .2s;
  -webkit-tap-highlight-color: transparent;
}
.contact-card:active { background: var(--c-div); transform: scale(.985); }
.contact-card__icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.contact-card__text { flex: 1; }
.contact-card__title { font-size: .88rem; font-weight: 600; }
.contact-card__desc { font-size: .75rem; color: var(--c-txt3); margin-top: 1px; }
.contact-card__arrow { color: var(--c-txt3); flex-shrink: 0; }
.contact-card__detail {
  display: none;
  padding: 16px 20px 18px 76px;
  border-top: 1px solid var(--c-bdr);
  font-size: .84rem;
  color: var(--c-txt2);
  line-height: 1.75;
}
.contact-card__detail.open { display: block; }
.contact-card-wrap {
  border-radius: var(--r-md);
  border: 1px solid var(--c-bdr);
  overflow: hidden;
  background: var(--c-card);
  transition: all .2s;
}
.contact-card-wrap .contact-card { border: none; border-radius: 0; }
.email-copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 10px;
  background: var(--c-pri-bg);
  color: var(--c-pri);
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  -webkit-tap-highlight-color: transparent;
  border: 1.5px solid var(--c-pri-bg2);
  margin-top: 12px;
}
.email-copy-btn:active { transform: scale(.96); background: var(--c-pri-bg2); }

/* Form */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: .82rem;
  font-weight: 600;
  color: var(--c-txt2);
  margin-bottom: 6px;
}
.form-input, .form-textarea {
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid var(--c-bdr);
  border-radius: var(--r-md);
  font-size: .92rem;
  background: var(--c-card);
  transition: border-color .2s, box-shadow .2s;
}
.form-input:focus, .form-textarea:focus {
  border-color: var(--c-pri-l);
  box-shadow: 0 0 0 3px rgba(44,110,99,.1);
}
.form-textarea { min-height: 110px; resize: vertical; line-height: 1.7; }

/* Toast */
.toast {
  position: fixed;
  bottom: calc(76px + var(--safe-b));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  background: var(--c-txt);
  color: #fff;
  padding: 11px 24px;
  border-radius: 24px;
  font-size: .84rem;
  font-weight: 500;
  z-index: 500;
  transition: all .3s var(--ease-out);
  pointer-events: none;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--c-card);
  border-radius: var(--r-xl);
  max-width: 420px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 28px;
  animation: modalIn .35s var(--ease-out);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.92) translateY(12px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

/* Floating CTA */
.fab {
  position: fixed;
  bottom: calc(80px + var(--safe-b));
  right: 20px;
  z-index: 200;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 48px;
  padding: 0 22px;
  border-radius: 24px;
  background: var(--c-pri);
  color: #fff;
  font-size: .88rem;
  font-weight: 600;
  box-shadow: 0 4px 20px rgba(44,110,99,.35);
  cursor: pointer;
  transition: all .2s;
  -webkit-tap-highlight-color: transparent;
  border: none;
}
.fab:active { transform: scale(.95); }

/* Bottom Sheet */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 400;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.sheet-overlay.open { display: flex; }
.sheet {
  background: var(--c-card);
  border-radius: 24px 24px 0 0;
  max-width: 520px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 8px 24px calc(24px + var(--safe-b));
  animation: sheetUp .35s var(--ease-out);
}
@keyframes sheetUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.sheet__handle {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--c-bdr);
  margin: 8px auto 20px;
}
.sheet__close {
  position: absolute;
  top: 16px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--c-div);
  cursor: pointer;
  border: none;
}
.inquiry-type {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.inquiry-chip {
  padding: 8px 16px;
  border-radius: 20px;
  font-size: .82rem;
  font-weight: 500;
  border: 1.5px solid var(--c-bdr);
  background: var(--c-card);
  color: var(--c-txt2);
  cursor: pointer;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.inquiry-chip.active {
  border-color: var(--c-pri);
  background: var(--c-pri-bg);
  color: var(--c-pri);
  font-weight: 600;
}

/* ========================================
   HERO DECORATIONS (CSS Only)
   ======================================== */
.hero-bg {
  position: relative;
  overflow: hidden;
  background: linear-gradient(168deg, var(--c-pri-bg) 0%, var(--c-bg) 50%, var(--c-sec-bg) 100%);
  padding: 52px 24px 44px;
}
.hero-bg::before {
  content: '';
  position: absolute;
  top: -60px;
  right: -40px;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: rgba(44,110,99,.04);
}
.hero-bg::after {
  content: '';
  position: absolute;
  bottom: -30px;
  left: -50px;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: rgba(196,139,92,.04);
}

/* Feature Card Grid */
.feat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.feat-card {
  background: var(--c-card);
  border-radius: var(--r-lg);
  padding: 22px 18px;
  text-align: center;
  box-shadow: var(--sh-sm);
  border: 1px solid rgba(0,0,0,.03);
  cursor: pointer;
  transition: all .25s;
}
.feat-card:active { transform: scale(.97); box-shadow: var(--sh-md); }
.feat-card__icon {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
}
.feat-card__title {
  font-size: .92rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.feat-card__desc {
  font-size: .72rem;
  color: var(--c-txt3);
  line-height: 1.5;
}

/* Stat Row */
.stat-row {
  display: flex;
  gap: 12px;
}
.stat-item {
  flex: 1;
  text-align: center;
  padding: 18px 8px;
  background: var(--c-card);
  border-radius: var(--r-md);
  border: 1px solid var(--c-bdr);
}
.stat-num {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--c-pri);
  letter-spacing: -.03em;
}
.stat-label {
  font-size: .7rem;
  color: var(--c-txt3);
  margin-top: 2px;
}

/* Donation */
.donation-box {
  background: linear-gradient(135deg, var(--c-pri-bg) 0%, #F5F0EB 100%);
  border-radius: var(--r-lg);
  padding: 28px 24px;
  text-align: center;
}
.donation-box__acct {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--c-card);
  padding: 10px 20px;
  border-radius: 12px;
  font-size: .88rem;
  font-weight: 600;
  color: var(--c-txt);
  box-shadow: var(--sh-xs);
  margin-top: 14px;
  cursor: pointer;
  transition: all .2s;
}
.donation-box__acct:active { transform: scale(.97); }

/* Helpers */
.px-5 { padding-left: 20px; padding-right: 20px; }
.py-5 { padding-top: 20px; padding-bottom: 20px; }
.py-8 { padding-top: 32px; padding-bottom: 32px; }
.py-10 { padding-top: 40px; padding-bottom: 40px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.mb-4 { margin-bottom: 16px; }
.mb-5 { margin-bottom: 20px; }

/* Divider */
.divider {
  width: 40px;
  height: 3px;
  border-radius: 2px;
  background: var(--c-pri-bg2);
  margin: 0 auto;
}

/* Book Promo */
.book-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
  border-radius: var(--r-xl);
  padding: 32px 24px;
  color: #fff;
  box-shadow: 0 8px 32px rgba(15,52,96,.25);
}
.book-card::before {
  content: '';
  position: absolute;
  top: -40px;
  right: -30px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,.04);
}
.book-card::after {
  content: '';
  position: absolute;
  bottom: -20px;
  left: -20px;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: rgba(196,139,92,.08);
}
.book-card__badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .06em;
  background: rgba(255,255,255,.12);
  color: rgba(255,255,255,.85);
  margin-bottom: 16px;
}
.book-card__en {
  font-size: .78rem;
  font-weight: 400;
  color: rgba(255,255,255,.5);
  letter-spacing: .04em;
  margin-bottom: 4px;
  font-style: italic;
}
.book-card__title {
  font-size: 1.25rem;
  font-weight: 800;
  line-height: 1.4;
  letter-spacing: -.02em;
  margin-bottom: 12px;
  position: relative;
  z-index: 1;
}
.book-card__desc {
  font-size: .84rem;
  line-height: 1.75;
  color: rgba(255,255,255,.7);
  position: relative;
  z-index: 1;
  margin-bottom: 18px;
}
.book-card__divider {
  width: 36px;
  height: 2px;
  background: var(--c-sec-l);
  border-radius: 1px;
  margin-bottom: 18px;
}
.book-card__cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  border-radius: 22px;
  font-size: .84rem;
  font-weight: 600;
  background: rgba(255,255,255,.12);
  color: #fff;
  border: 1px solid rgba(255,255,255,.15);
  transition: all .25s;
  position: relative;
  z-index: 1;
  cursor: pointer;
}
.book-card__cta:active {
  background: rgba(255,255,255,.2);
  transform: scale(.97);
}

/* ========================================
   DIAGNOSTIC TEST UI
   ======================================== */
.diag-progress {
  height: 6px;
  background: var(--c-div);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}
.diag-progress__bar {
  height: 100%;
  background: var(--c-pri);
  border-radius: 3px;
  transition: width .4s var(--ease-out);
}
.diag-q {
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 20px;
  color: var(--c-txt);
}
.diag-opt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  background: var(--c-card);
  border: 1.5px solid var(--c-bdr);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: all .2s;
  margin-bottom: 10px;
  -webkit-tap-highlight-color: transparent;
}
.diag-opt:active { transform: scale(.98); border-color: var(--c-pri); }
.diag-opt__num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--c-bdr);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .78rem;
  font-weight: 700;
  color: var(--c-txt3);
  flex-shrink: 0;
  transition: all .2s;
}
.diag-opt:active .diag-opt__num {
  border-color: var(--c-pri);
  background: var(--c-pri);
  color: #fff;
}
.diag-opt__text { font-size: .88rem; color: var(--c-txt); line-height: 1.5; }

/* My Page */

<script>
/* ================================================
   CORE UTILITIES
   ================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const mainEl = () => $('#main');

function icon(name, w = 20, h = 20) {
  return '<svg width="' + w + '" height="' + h + '"><use href="#' + name + '"/></svg>';
}

function toast(msg, ms) {
  ms = ms || 2200;
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, ms);
}

function openModal(html) {
  $('#modal-c').innerHTML = html;
  $('#modal-ov').classList.add('open');
}
function closeModal() { $('#modal-ov').classList.remove('open'); }

function scrollTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Header scroll effect */
var header = $('#app-header');
var lastScroll = 0;
window.addEventListener('scroll', function() {
  var y = window.scrollY || document.documentElement.scrollTop;
  header.classList.toggle('scrolled', y > 10);
  lastScroll = y;
}, { passive: true });

/* Scroll-reveal observer */
var revealObserver = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

function initReveals() {
  $$('.reveal').forEach(function(el) {
    el.classList.remove('visible');
    revealObserver.observe(el);
  });
}

/* Set active nav */
function setNav(key) {
  $$('.nav__item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.nav === key);
  });
}

/* ================================================
   ROUTER
   ================================================ */
var routes = {};
function route(path, fn) { routes[path] = fn; }

window.resolve = function resolve() {
  var hash = location.hash.slice(1) || '/';
  for (var p in routes) {
    if (routes.hasOwnProperty(p)) {
      var paramNames = [];
      var re = new RegExp('^' + p.replace(/:(\w+)/g, function(_, n) {
        paramNames.push(n);
        return '([^/]+)';
      }) + '$');
      var m = hash.match(re);
      if (m) {
        var params = {};
        paramNames.forEach(function(n, i) { params[n] = m[i + 1]; });
        var fn = routes[p];
        fn(params);
        window.scrollTo(0, 0);
        setTimeout(initReveals, 60);
        return;
      }
    }
  }
  if (routes['/']) { routes['/'](); window.scrollTo(0, 0); setTimeout(initReveals, 60); }
};

window.addEventListener('hashchange', resolve);

/* ================================================
   ACCORDION TOGGLE
   ================================================ */
window.toggleAccordion = function(idx) {
  var items = $$('.accordion__item');
  items.forEach(function(item, i) {
    if (i === idx) {
      item.classList.toggle('open');
    } else {
      item.classList.remove('open');
    }
  });

/* Copy account */
function copyText(text, successMsg) {
  successMsg = successMsg || '복사되었습니다';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      toast(successMsg);
    }).catch(function() { fallbackCopy(text, successMsg); });
  } else {
    fallbackCopy(text, successMsg);
  }
}
function fallbackCopy(text, successMsg) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); toast(successMsg || '복사되었습니다'); }
  catch(e) { toast('복사에 실패했습니다'); }
  document.body.removeChild(ta);
}

function getDiagScore(testId) {
  var d = loadDiag();
  if (!d[testId]) return null;
  var test = DIAG_TESTS[testId];
  var total = 0;
  d[testId].forEach(function(ans) { total += test.scoring[ans]; });
  return total;
}

function getDiagAxisScores(testId) {
  var d = loadDiag();
  if (!d[testId]) return null;
  var test = DIAG_TESTS[testId];
  var axes = {};
  test.axes.forEach(function(a) { axes[a] = { total: 0, count: 0 }; });
  d[testId].forEach(function(ans, i) {
    var axisIdx = test.axisMap[i];
    var axisName = test.axes[axisIdx];
    axes[axisName].total += test.scoring[ans];
    axes[axisName].count++;
  });
  var result = [];
  test.axes.forEach(function(a) {
    var maxPossible = axes[a].count * 4;
    result.push({ name: a, score: axes[a].total, max: maxPossible, pct: Math.round(axes[a].total / maxPossible * 100) });
  });
  return result;
}

function getDiagInterp(testId) {
  var score = getDiagScore(testId);
  if (score === null) return null;
  var test = DIAG_TESTS[testId];
  for (var i = 0; i < test.interp.length; i++) {
    if (score >= test.interp[i].min) return test.interp[i];
  }
  return test.interp[test.interp.length - 1];
}

window.diagAnswer = function(testId, optIdx) {
  var d = loadDiag();

  d[testId].push(optIdx);
  saveDiag(d);
  renderDiagTest(testId);
};

window.resetDiag = function(testId) {
  var d = loadDiag();

  saveDiag(d);
  renderDiagTest(testId);
};

        '<p class="text-xs c-txt3" style="margin-top:10px;text-align:center">복사된 내용을 이메일에 붙여넣어 보내주세요</p>' +
      '</div>' +
    '</div>' +

    '<div class="spacer-md"></div>' +

    /* Quick Links */
    '<div class="section reveal">' +
      '<div class="flex gap-3">' +
        '<button class="btn btn--pri btn--sm flex-1" onclick="openInquiry()">' + icon('i-mail', 15, 15) + ' 상담 신청</button>' +
        '<a href="#/together" class="btn btn--outline btn--sm flex-1">' + icon('i-together', 15, 15) + ' 동행</a>' +
      '</div>' +
    '</div>' +

    '<div class="spacer-lg"></div>' +

    '</div>';
});

window.toggleResult = function(id) {
  var el = document.getElementById('rc-' + id);
  if (el) el.classList.toggle('open');
};
window.toggleQBreakdown = function(id) {
  var el = document.getElementById('qb-' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
};

window.saveName = function() {
  var inp = document.getElementById('mp-name');
  if (inp && inp.value.trim()) {
    localStorage.setItem('nedabah_username', inp.value.trim());
    resolve();
  } else {
    toast('이름을 입력해주세요');
  }
};

window.editName = function() {
  localStorage.removeItem('nedabah_username');
  resolve();
};

/* ================================================
   INIT — migrate stale diagnostic data
   ================================================ */
(function migrateDiag() {
  try {
    var raw = localStorage.getItem('nedabah_diag_v2');
    if (!raw) return;
    var d = JSON.parse(raw);
    var dirty = false;
    ['study', 'career', 'express', 'leader'].forEach(function(id) {
      if (d[id] && d[id].length > 0 && d[id].length < DIAG_TESTS[id].questions.length) {
        /* Incomplete data from a different question set — reset */
        delete d[id];
        dirty = true;
      }
    });
    if (dirty) localStorage.setItem('nedabah_diag_v2', JSON.stringify(d));
  } catch(e) {}
})();

if (!location.hash) location.hash = '#/';
resolve();
</script>
