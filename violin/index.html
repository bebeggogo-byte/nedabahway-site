<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>바이올린 개방현 놀이 — 솔·레·라·미와 조표 배우기</title>
<meta name="description" content="바이올린 개방현 네 줄(솔·레·라·미)의 오선지 위치와 소리, 그리고 조표를 놀이처럼 익히는 어린이 학습 게임. 8단계 커리큘럼, 소리 자동 재생, 진행 저장.">
<meta name="theme-color" content="#FBF4E4">
<meta name="author" content="네다바웨이 NEDABAHWAY">
<link rel="canonical" href="https://www.nedabah.org/violin/">
<meta property="og:type" content="website">
<meta property="og:title" content="바이올린 개방현 놀이 — 솔·레·라·미와 조표 배우기">
<meta property="og:description" content="바이올린 개방현 네 줄의 오선지 위치·소리·조표를 놀이처럼 익히는 어린이 학습 게임.">
<meta property="og:url" content="https://www.nedabah.org/violin/">
<meta property="og:locale" content="ko_KR">
<style>
:root{
  --cream:#FBF4E4; --cream2:#F3E7CE; --paper:#FFFDF6;
  --ink:#332F29; --ink2:#6A6158; --line:#332F29;
  --yellow:#F6D46A; --yellow-d:#E4B93C;
  --sky:#9CD3E6; --sky-d:#6FB6CE;
  --green:#9FD183; --green-d:#3C7A2C;
  --coral:#F29E86; --coral-d:#C4603F;
  --brown:#B98A5E;
  --ok:#2C6E3B; --hint:#8A5A16;
  --ff: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:20px;-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:var(--ff); color:var(--ink); background:var(--cream);
  line-height:1.45; word-break:keep-all; height:100%; overflow:hidden; overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:1rem}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--ink2)}

/* ── 한 화면 틀: 폰 높이에 딱 맞춘다. 버튼·글자는 크기를 지키고, 그림(.fig)만 남는 공간에 맞춰 줄어든다 ── */
.wrap{
  height:100vh; height:100dvh; max-width:620px; margin:0 auto;
  display:flex; flex-direction:column;
  padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
}
.topbar{flex:none;display:flex;align-items:center;gap:6px;padding-bottom:6px}
.brandmini{flex:1;min-width:0;font-size:.7rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  flex:none;min-width:44px;min-height:44px;border:2px solid var(--line);border-radius:12px;
  background:var(--paper);font-size:1rem;display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn:active{transform:translateY(1px)}
#app{flex:1;min-height:0;display:flex;flex-direction:column}

.card{
  flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:12px;
  box-shadow:4px 5px 0 rgba(51,47,41,.13);
}
/* 폰에서는 카드 테두리를 걷어 가로 폭을 버튼에 돌려준다 */
@media (max-width:480px){ .card{background:none;border:0;border-radius:0;box-shadow:none;padding:2px 0 0} }
.hd{flex:none}
.fig{flex:1 1 0;min-height:64px;display:flex;align-items:center;justify-content:center;gap:6px}
.fig.col{flex-direction:column;text-align:center;gap:6px}
.ctrl{flex:none;display:flex;flex-direction:column;gap:8px}

h1{font-size:1.45rem;line-height:1.25}
h2{font-size:1.1rem;line-height:1.3}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink2);font-size:.8rem}
.small{font-size:.74rem;line-height:1.4}
.center{text-align:center}
.lead{font-weight:800;font-size:1rem;line-height:1.35}

.bigbtn{
  display:block;width:100%;min-height:52px;border:3px solid var(--line);border-radius:18px;
  background:var(--yellow);font-size:1.08rem;font-weight:700;padding:6px 12px;line-height:1.2;
  box-shadow:3px 4px 0 var(--line);
}
.bigbtn small{font-size:.78rem;font-weight:700;opacity:.8}
.bigbtn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}
.bigbtn.sky{background:var(--sky)} .bigbtn.green{background:var(--green)}
.bigbtn.plain{background:var(--paper)}
.bigbtn[disabled]{opacity:.45;box-shadow:none;cursor:default}
.btnrow{display:flex;gap:8px}
.btnrow .bigbtn{flex:1 1 0;width:auto;min-width:0}
.btnrow.small .bigbtn{min-height:46px;font-size:.92rem;padding:4px 6px;border-width:2.5px;box-shadow:2px 3px 0 var(--line)}
.btnrow.three .bigbtn{padding:4px 2px;white-space:nowrap;font-size:1rem}

/* 계이름·손가락 버튼 — 64×64 이상, 글자 28px 이상 */
.namegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.namegrid.five{grid-template-columns:repeat(5,1fr);gap:4px}
.namebtn{
  min-height:64px;min-width:0;border:3px solid var(--line);border-radius:16px;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:3px 4px 0 var(--line);padding:3px 0;
}
.namebtn .ko{font-size:1.6rem;font-weight:800;line-height:1.05}
.namegrid.five .namebtn .ko{font-size:1.45rem}
.namebtn .en{font-size:.62rem;color:var(--ink2);letter-spacing:.04em}
.namebtn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}
.namebtn.is-on{background:var(--yellow)}
.namebtn[disabled]{opacity:.5;box-shadow:none}

/* 오선지 · 바이올린 · 캐릭터 — 남는 높이에 맞춰 줄어든다 */
.staffwrap{flex:1 1 auto;min-width:0;align-self:stretch;display:flex;align-items:center;justify-content:center;background:var(--paper);border-radius:16px}
.stafffig{display:block;width:100%;height:100%;max-width:560px;touch-action:manipulation}
.staffwrap.pick{cursor:pointer;touch-action:none}
.staffwrap.pick:focus-visible{outline:4px solid var(--sky-d);outline-offset:3px}
.bigbtn:focus-visible,.namebtn:focus-visible,.station:focus-visible,.iconbtn:focus-visible,.switch:focus-visible,.keypick button:focus-visible,.listen:focus-visible{outline:4px solid var(--sky-d);outline-offset:3px}
/* 바이올린은 오선지 옆에서 보조로만 — 폭의 26%를 넘지 않게 해 오선지 줄 간격을 지킨다 */
.vio{flex:none;align-self:center;height:100%;max-height:240px;max-width:26%;aspect-ratio:12/25;display:flex;align-items:center}
.violinfig{display:block;width:100%;height:100%}
.chars{height:100%;max-height:170px;display:flex;justify-content:center;gap:2px}
.chars svg{height:100%;width:auto;max-width:32%}
.fingerchart{display:block;width:100%;max-width:400px;height:auto;margin:0 auto}
.fline{text-align:center;line-height:1.25}
.fline b{font-size:1.2rem}
.fline span{display:block;font-size:.74rem;color:var(--ink2)}
.target{font-size:1.9rem;font-weight:800;line-height:1.1;text-align:center;margin-top:4px}
.target small{font-size:.8rem;color:var(--ink2);font-weight:700}
.listen{
  height:100%;max-height:190px;aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--sky);
  box-shadow:3px 4px 0 var(--line);font-size:2.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.listen span{font-size:.85rem;font-weight:800}
.keypick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keypick button{min-height:52px;border:3px solid var(--line);border-radius:14px;background:var(--paper);
  box-shadow:3px 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;line-height:1.15}
.keypick button b{font-size:.84rem}
.keypick button span{font-size:.68rem;color:var(--ink2)}
.keypick button.is-on{background:var(--yellow)}
.keypick button:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}

/* 퀴즈 머리줄 */
.qrow{display:flex;align-items:center;gap:6px}
.qrow .qt{flex:1;min-width:0;font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .qt small{color:var(--ink2);font-weight:700;font-size:.78rem}
.chip{flex:none;border:2px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.74rem;font-weight:800;background:var(--cream2);white-space:nowrap}
.chip.sky{background:var(--sky)}
.scorechip{flex:none;font-weight:800;font-size:.78rem;border:2px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--paper)}
.pips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.pip.done{background:var(--green)} .pip.miss{background:var(--coral)} .pip.now{background:var(--yellow)}

/* 말풍선 — 상태는 색만이 아니라 표시(✓ ↺ !)와 글로도 알린다 */
.say{display:flex;align-items:center;gap:8px}
.say .charbox{flex:none;width:50px}
.say .charbox svg{display:block;width:100%;height:auto}
.bubble{
  position:relative;flex:1;min-width:0;border:2.5px solid var(--line);border-radius:14px;background:var(--paper);
  padding:6px 10px;font-size:.9rem;font-weight:700;min-height:44px;display:flex;align-items:center;gap:6px;line-height:1.3;
}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-5px;width:10px;height:10px;background:inherit;border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}
.bubble .mark{flex:none;width:26px;height:26px;border:2.5px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;background:var(--paper)}
.bubble.ok{background:#E8F5E1} .bubble.ok .mark{background:var(--green)}
.bubble.retry{background:#FDF0E7} .bubble.retry .mark{background:var(--coral)}
.bubble.hint .mark{background:var(--yellow)}

/* 단계 지도 — 2열로 펼쳐 남는 높이를 나눠 쓴다 */
.stations{flex:1 1 0;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(50px,1fr);gap:8px;align-items:stretch;justify-content:stretch}
.station{display:flex;align-items:center;gap:8px;padding:5px 8px;border:3px solid var(--line);border-radius:16px;background:var(--paper);text-align:left;box-shadow:3px 4px 0 var(--line);min-width:0}
.station:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}
.station[disabled]{opacity:.55;box-shadow:none;background:var(--cream2)}
.station .no{flex:none;width:34px;height:34px;border:2.5px solid var(--line);border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem}
.station.current .no{background:var(--sky)}
.station .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.station .tt b{font-size:.8rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.station .tt span{font-size:.62rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.station .tt .st{color:var(--yellow-d);font-weight:800}

.starrow{font-size:2.4rem;letter-spacing:6px;color:var(--yellow-d);line-height:1.1}
.misslist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.misschip{border:2px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--cream2);font-size:.8rem;font-weight:700}

/* 학부모·교사 화면 */
.sec{font-size:.8rem;font-weight:800;align-self:flex-start}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:100%}
.stat{border:2px solid var(--line);border-radius:10px;background:var(--paper);text-align:center;padding:3px 2px;line-height:1.25}
.stat b{display:block;font-size:.68rem;white-space:nowrap}
.stat .s{font-size:.6rem;color:var(--yellow-d);letter-spacing:-1px}
.stat .r{display:block;font-size:.7rem;color:var(--ink2);font-weight:700}
.switchrow{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:4px 10px;background:var(--paper)}
.switchrow .lbl{flex:1;font-size:.85rem;font-weight:700}
.switch{min-width:72px;min-height:44px;border:3px solid var(--line);border-radius:999px;background:var(--cream2);font-weight:700;font-size:.85rem}
.switch.on{background:var(--green)}

/* 수료증 */
.cert{border:5px double var(--line);border-radius:18px;padding:8px;background:var(--paper);justify-content:center}
.cert .ttl{font-size:1.3rem;font-weight:800;letter-spacing:.04em}
.cert .who{font-size:1.45rem;font-weight:800;border-bottom:3px dotted var(--line);padding:0 14px 2px;min-width:150px}
.cert .line{font-weight:700;font-size:.85rem}
.certchars{flex:1 1 0;min-height:40px;max-height:120px;display:flex;justify-content:center;gap:2px}
.certchars svg{height:100%;width:auto}
.namerow{display:flex;gap:8px}
.namerow input{flex:1;min-width:0;font-family:inherit;font-size:1.05rem;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:14px;padding:6px;background:var(--cream2);min-height:52px}
.namerow .bigbtn{flex:none;width:auto}

/* 가로로 눕힌 폰: 그림은 왼쪽, 버튼은 오른쪽 */
@media (orientation:landscape) and (max-height:520px){
  .wrap{max-width:none}
  .topbar{padding-bottom:3px}
  .card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-rows:auto minmax(0,1fr);column-gap:10px;row-gap:4px}
  .hd{grid-column:1 / -1}
  .fig{grid-column:1;grid-row:2;min-height:0}
  .ctrl{grid-column:2;grid-row:2;overflow-y:auto;justify-content:center;gap:6px}
  /* 높이가 모자라니 글·여백을 한 단계 줄인다 (누르는 버튼은 44px 이상 유지) */
  .bigbtn{min-height:46px;font-size:1rem;padding:3px 10px}
  .btnrow.small .bigbtn{min-height:44px}
  .hrow h2,.qrow .qt{font-size:.9rem}
  .pips{margin-top:3px}
  .target{position:absolute;right:14px;margin:0;font-size:1.3rem}
  .hd{position:relative}
  .say .charbox{width:40px}
  .bubble{min-height:44px;padding:4px 8px;font-size:.84rem}
  .statgrid{grid-template-columns:repeat(8,1fr)}
  .stat{padding:1px}
  .fig.col{gap:3px}
  .cert{padding:4px}
  .cert .ttl{font-size:1.05rem}
  .cert .who{font-size:1.15rem}
  .stations{grid-template-columns:repeat(4,1fr)}
  /* 글이 많은 화면(수료증·학부모)은 좌우로 나누지 않고 위아래로 쌓고 버튼을 한 줄로 */
  .card.stack{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .card.stack .fig{grid-column:1;grid-row:2}
  .card.stack .ctrl{grid-column:1;grid-row:3;flex-direction:row;align-items:center;overflow:visible}
  .card.stack .ctrl > *{flex:1 1 0;min-width:0}
  .card.stack .ctrl > .namerow{flex:2 1 0}
  .card.stack .ctrl > .switchrow{flex:1.3 1 0}
  .card.parent .statgrid{grid-template-columns:repeat(8,1fr)}
  .card.parent p.sec{display:none}
  .cert .muted.small{display:none}
  .certchars{min-height:24px}
  .cert{gap:2px}
}
/* 키가 낮은 화면에서는 학부모 화면의 보조 설명을 접는다 */
@media (max-height:520px){ .card.parent .note{display:none} .card.parent .fig{gap:3px} }

.sparkles{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.spark{position:absolute;font-size:1.5rem;animation:fly .9s ease-out forwards}
@keyframes fly{ from{opacity:1;transform:translate(0,0) scale(.6)} to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)} }
.pop{animation:pop .35s ease-out}
@keyframes pop{ 0%{transform:scale(.9)} 60%{transform:scale(1.02)} 100%{transform:scale(1)} }
.glow{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{ from{opacity:.55} to{opacity:1} }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brandmini">네다바웨이 · 바이올린 개방현 놀이</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="muteBtn" aria-pressed="false" aria-label="소리 끄기">🔊</button>
    <button class="iconbtn" id="gearBtn" aria-label="학부모·교사 화면 (3초 길게 누르기)">⚙️</button>
  </div>
  <main id="app"></main>
  <div id="live" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<div class="sparkles" id="sparkLayer" aria-hidden="true"></div>
<script>
"use strict";
/* ============================================================
   1. 음악 데이터 (교사가 값만 바꿔도 확장 가능한 상수 영역)
   ------------------------------------------------------------
   step = 높은음자리표 기준 '아래 첫째 줄(E4)'에서 센 온음계 칸수
          E4=0, F4=1, G4=2, A4=3, B4=4, C5=5, D5=6, E5=7, F5=8, G5=9
          D4=-1, C4=-2, B3=-3, A3=-4, G3=-5
   ============================================================ */
/* 첫째 자리(1지) 음 전체. acc:1 이면 음표 앞에 샵이 붙는다.
   높은 2지 고정 — 네 줄 모두 같은 손 모양. */
var TONES = {
  G3 : { ko:'솔', en:'G', acc:0, freq:196.00, step:-5 },
  A3 : { ko:'라', en:'A', acc:0, freq:220.00, step:-4 },
  B3 : { ko:'시', en:'B', acc:0, freq:246.94, step:-3 },
  C4 : { ko:'도', en:'C', acc:0, freq:261.63, step:-2 },
  D4 : { ko:'레', en:'D', acc:0, freq:293.66, step:-1 },
  E4 : { ko:'미', en:'E', acc:0, freq:329.63, step: 0 },
  Fs4: { ko:'파', en:'F', acc:1, freq:369.99, step: 1 },
  G4 : { ko:'솔', en:'G', acc:0, freq:392.00, step: 2 },
  A4 : { ko:'라', en:'A', acc:0, freq:440.00, step: 3 },
  B4 : { ko:'시', en:'B', acc:0, freq:493.88, step: 4 },
  Cs5: { ko:'도', en:'C', acc:1, freq:554.37, step: 5 },
  D5 : { ko:'레', en:'D', acc:0, freq:587.33, step: 6 },
  E5 : { ko:'미', en:'E', acc:0, freq:659.25, step: 7 },
  Fs5: { ko:'파', en:'F', acc:1, freq:739.99, step: 8 },
  Gs5: { ko:'솔', en:'G', acc:1, freq:830.61, step: 9 },
  A5 : { ko:'라', en:'A', acc:0, freq:880.00, step:10 },
  B5 : { ko:'시', en:'B', acc:0, freq:987.77, step:11 }
};
function toneKo(id){ var t = TONES[id]; return t.ko + (t.acc ? '#' : ''); }
function toneEn(id){ var t = TONES[id]; return t.en + (t.acc ? '#' : ''); }

/* 줄마다 0~4번 손가락이 짚는 음 (높은 2지) */
var FINGERS = {
  A4: ['A4','B4','Cs5','D5','E5'],   /* 라줄 — 라 시 도# 레 미 */
  E5: ['E5','Fs5','Gs5','A5','B5'],  /* 미줄 — 미 파# 솔# 라 시 */

/* ============================================================
   2. 오선지 SVG (모두 직접 그림 — 외부 폰트·이미지 없음)
   ============================================================ */
var S = 20;            /* viewBox 내부 줄 간격 */
var VB_W = 404, VB_H = 214;
var QW = 300;          /* 음표 하나만 올리는 오선지의 폭 — 좁은 틀에서도 줄 간격이 넉넉하다 */
var BASE_Y = 134;      /* 아래 첫째 줄(E4)의 y */
function lineY(k){ return BASE_Y - (k-1)*S; }            /* k=1..5 */
function stepY(step){ return BASE_Y - step*(S/2); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* 높은음자리표 — 나선 랜드마크를 Catmull-Rom으로 이어 직접 그림
   좌표 단위는 줄 간격 S, 원점은 둘째 줄(G4) 위 나선 중심.
   교사가 아래 좌표만 조정해도 모양을 바꿀 수 있다. */
var CLEF_PTS = [
  [-0.06, -0.02],   /* 나선 안쪽 끝 — 솔(G4) 줄 위, 기둥에 닿는다 */
  [ 0.22, -0.32],
  [ 0.58, -0.22],
  [ 0.86,  0.28],
  [ 0.72,  0.90],
  [ 0.24,  1.32],
  [-0.36,  1.36],   /* 아래 큰 고리의 바닥 */
  [-0.88,  1.02],
  [-1.14,  0.42],
  [-1.16, -0.25],   /* 아래 큰 고리의 왼쪽 끝 */
  [-1.00, -0.86],
  [-0.70, -1.36],
  [-0.52, -1.96],
  [-0.44, -2.72],
  [-0.30, -3.26],
  [-0.02, -3.62],   /* 맨 위 */
  [ 0.26, -3.38],
  [ 0.32, -2.86],
  [ 0.30, -1.90],
  [ 0.24, -1.20],
  [ 0.15, -0.45],
  [ 0.05,  0.65],
  [-0.01,  1.70],
  [-0.07,  2.50],
  [-0.24,  2.95],
  [-0.62,  2.92],
  [-0.74,  2.52],
  [-0.48,  2.38]    /* 아래 갈고리 끝 */
];
/* Catmull-Rom 스플라인을 3차 베지에로 변환 */
function smoothPath(pts, map){
  var d, i, p0, p1, p2, p3, c1, c2;
  function mp(p){ var q = map(p[0], p[1]); return q[0].toFixed(2) + ' ' + q[1].toFixed(2); }
  d = 'M' + mp(pts[0]);
  for (i=0;i<pts.length-1;i++){
    p0 = pts[i-1] || pts[0];
    p1 = pts[i];
    p2 = pts[i+1];
    p3 = pts[i+2] || pts[pts.length-1];
    c1 = [ p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6 ];
    c2 = [ p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6 ];
    d += ' C' + mp(c1) + ', ' + mp(c2) + ', ' + mp(p2);
  }
  return d;
}
function clefPath(cx, S_){
  var gy = lineY(2);
  return smoothPath(CLEF_PTS, function(x,y){ return [cx + x*S_, gy + y*S_]; });
}
function clefSVG(cx){
  return '<path d="'+clefPath(cx,S)+'" fill="none" stroke="var(--ink)" stroke-width="'+(S*0.165).toFixed(2)+
         '" stroke-linecap="round" stroke-linejoin="round"/>';
}

/* 샵(#) — 세로 2줄 + 비스듬한 가로 2줄 */
function sharpSVG(cx, step, opts){
  opts = opts || {};
  var y = stepY(step), c = opts.color || 'var(--ink)', w = S*0.13;
  var g = '';
  g += '<line x1="'+(cx-S*0.20)+'" y1="'+(y-S*0.66)+'" x2="'+(cx-S*0.20)+'" y2="'+(y+S*0.74)+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/>';
  g += '<line x1="'+(cx+S*0.20)+'" y1="'+(y-S*0.80)+'" x2="'+(cx+S*0.20)+'" y2="'+(y+S*0.60)+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/>';
  g += '<line x1="'+(cx-S*0.44)+'" y1="'+(y-S*0.06)+'" x2="'+(cx+S*0.44)+'" y2="'+(y-S*0.26)+'" stroke="'+c+'" stroke-width="'+(S*0.19)+'" stroke-linecap="round"/>';
  g += '<line x1="'+(cx-S*0.44)+'" y1="'+(y+S*0.40)+'" x2="'+(cx+S*0.44)+'" y2="'+(y+S*0.20)+'" stroke="'+c+'" stroke-width="'+(S*0.19)+'" stroke-linecap="round"/>';
  return g;
}

/* 덧줄 — C4(-2) 이하, A5(10) 이상에서 짝수 step마다 */
function ledgerSVG(cx, step){
  var out = '', k, w = S*0.92;
  if (step <= -2) { for (k=-2; k>=step; k-=2) out += ledgerLine(cx,k,w); }
  if (step >= 10) { for (k=10; k<=step; k+=2) out += ledgerLine(cx,k,w); }
  return out;
}
function ledgerLine(cx,k,w){
  var y = stepY(k);
  return '<line x1="'+(cx-w)+'" y1="'+y+'" x2="'+(cx+w)+'" y2="'+y+'" stroke="var(--ink)" stroke-width="'+(S*0.115)+'" stroke-linecap="round"/>';
}

/* 4분음표 — 셋째 줄(B4, step 4) 이상이면 기둥 아래, 미만이면 위 */
function stemUp(step){ return step < 4; }
function noteSVG(cx, step, opts){
  opts = opts || {};
  var y = stepY(step), color = opts.color || 'var(--ink)', op = (opts.opacity==null?1:opts.opacity);
  var rx = S*0.63, ry = S*0.45, up = stemUp(step), len = S*3.1;
  var extra = '';
  if (opts.acc) extra += sharpSVG(cx - S*1.5, step, { color:color });
  if (opts.label != null){
    extra += '<text x="'+cx+'" y="'+(BASE_Y + S*3.4)+'" text-anchor="middle" font-size="'+(S*1.15)+
             '" font-weight="800" fill="'+(opts.labelColor||color)+'" font-family="var(--ff)">'+esc(opts.label)+'</text>';
  }
  var sx = up ? cx + rx*0.92 : cx - rx*0.92;
  var sy1 = y + (up ? -S*0.12 : S*0.12);
  var sy2 = up ? y - len : y + len;
  var g = '<g opacity="'+op+'">';
  g += ledgerSVG(cx, step).replace(/var\(--ink\)/g, color);
  g += '<ellipse cx="'+cx+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="'+color+'" transform="rotate(-22 '+cx+' '+y+')"/>';
  g += '<line x1="'+sx+'" y1="'+sy1+'" x2="'+sx+'" y2="'+sy2+'" stroke="'+color+'" stroke-width="'+(S*0.13)+'" stroke-linecap="round"/>';
  g += extra + '</g>';
  return g;
}

/* 오선지 전체
   opts: { sharps:[keyIds], notes:[{step,color,opacity}], pick:boolean, wide:boolean } */
function staffSVG(opts){
  opts = opts || {};
  var sharps = opts.sharps || [];
  var W = opts.w || VB_W;
  var pad = 14, clefX = pad + S*1.48;
  var keyX = pad + S*3.35, gap = S*0.98;
  var keyEnd = keyX + (sharps.length ? (sharps.length-1)*gap + S*0.6 : -S*0.6);
  var right = W - 18;
  var noteX = opts.noteX || Math.round((keyEnd + right)/2);
  var g = '';
  var i;
  for (i=1;i<=5;i++){
    g += '<line x1="'+pad+'" y1="'+lineY(i)+'" x2="'+right+'" y2="'+lineY(i)+'" stroke="var(--ink)" stroke-width="'+(S*0.085)+'" stroke-linecap="round"/>';
  }
  g += clefSVG(clefX);
  for (i=0;i<sharps.length;i++){
    g += '<g class="ksharp">'+sharpSVG(keyX + i*gap, SHARP_STEP[sharps[i]])+'</g>';
  }
  var notes = opts.notes || [];
  for (i=0;i<notes.length;i++){
    g += noteSVG(notes[i].x == null ? noteX : notes[i].x, notes[i].step, notes[i]);
  }
  var extra = opts.extra || '';
  /* 위아래 여백은 이 오선지에 실제로 그린 것만큼만 둔다 — 같은 공간에서 오선지가 더 크게 보인다.
     음표를 끌어 옮기는 오선지(fit:false)는 옮길 수 있는 범위 전체를 남겨 둔다. */
  var y0 = 0, h = VB_H;
  if (opts.fit !== false){
    var top = 36, bot = 177, j, y;
    for (j=0;j<sharps.length;j++) top = Math.min(top, stepY(SHARP_STEP[sharps[j]]) - S*0.9);
    for (j=0;j<notes.length;j++){
      y = stepY(notes[j].step);
      top = Math.min(top, y - S*0.9, stemUp(notes[j].step) ? y - S*3.2 : top);
      bot = Math.max(bot, y + S*0.9, stemUp(notes[j].step) ? bot : y + S*3.2);
      if (notes[j].label != null) bot = Math.max(bot, BASE_Y + S*3.7);
    }
    y0 = Math.floor(top - 4); h = Math.ceil(bot + 4) - y0;
  }
  return '<svg class="stafffig" viewBox="0 '+y0+' '+W+' '+h+'" role="img" aria-label="'+esc(opts.label||'오선지')+
         '" xmlns="http://www.w3.org/2000/svg">'+g+extra+'</svg>';
}
function noteXFor(sharps, w){
  var pad = 14, keyX = pad + S*3.35, gap = S*0.98;
  var n = sharps ? sharps.length : 0;
  var keyEnd = keyX + (n ? (n-1)*gap + S*0.6 : -S*0.6);
  return Math.round((keyEnd + ((w || VB_W)-18))/2);
}

/* 조표 카드용 작은 오선지 (샵을 하나씩 눌러 볼 수 있음) */
function keyStaffSVG(keyId, tapped){
  var k = KEYS[keyId], i, g = '', pad = 14, right = 196;
  for (i=1;i<=5;i++){
    g += '<line x1="'+pad+'" y1="'+lineY(i)+'" x2="'+right+'" y2="'+lineY(i)+'" stroke="var(--ink)" stroke-width="'+(S*0.085)+'" stroke-linecap="round"/>';
  }
  g += clefSVG(pad + S*1.48);
  var keyX = pad + S*3.8, gap = S*1.5;
  for (i=0;i<k.sharps.length;i++){
    var sid = k.sharps[i], on = tapped && tapped.indexOf(sid)>=0;
    var cx = keyX + i*gap;
    g += '<g class="tapsharp" data-sharp="'+sid+'" style="cursor:pointer">';
    g += '<rect x="'+(cx-S*0.95)+'" y="'+(stepY(SHARP_STEP[sid])-S*1.3)+'" width="'+(S*1.9)+'" height="'+(S*2.6)+'" rx="6" fill="'+(on?'var(--yellow)':'transparent')+'" stroke="'+(on?'var(--ink)':'none')+'" stroke-width="2"/>';
    g += sharpSVG(cx, SHARP_STEP[sid]);
    g += '</g>';
  }
  if (!k.sharps.length){
    g += '<text x="140" y="'+(lineY(3)+S*0.4)+'" text-anchor="middle" font-size="'+(S*0.85)+'" font-weight="700" fill="var(--ink2)" font-family="var(--ff)">샵 없음</text>';
  }
  return '<svg class="stafffig" viewBox="6 14 202 166" role="img" aria-label="'+esc(k.ko+' 조표, 샵 '+k.sharps.length+'개')+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
}

/* ============================================================
   3. 바이올린 그림 (현 4개 G-D-A-E, 해당 현이 빛남)
   ============================================================ */
function violinSVG(hi){

    }
  }
  return '<svg class="violinfig" viewBox="0 0 120 250" role="img" aria-label="'+
    esc(hi ? NOTES[hi].ko+'줄이 빛나는 바이올린 그림' : '바이올린 그림')+'" xmlns="http://www.w3.org/2000/svg">'+
    '<g fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">'+
    /* 몸통 */
    '<path d="M60 104 c15 0 23 11 23 23 0 10-7 15-7 21 0 8 11 12 11 26 0 21-13 34-27 34 -14 0-27-13-27-34 0-14 11-18 11-26 0-6-7-11-7-21 0-12 8-23 23-23 z" fill="#C98A4B"/>'+
    /* f홀 */
    '<path d="M47 146 c-4 5-3 15 1 20 M73 146 c4 5 3 15-1 20" stroke-width="2"/>'+
    /* 스크롤 + 페그박스 */
    '<path d="M60 10 c-8 0-12 6-12 12 0 7 6 10 10 7" fill="#E9D3AE"/>'+
    '<path d="M54 20 l13 0 -1 22 -11 0 z" fill="#E9D3AE"/>'+
    '<path d="M50 26 l5 0 M65 32 l5 0" stroke-width="2.6"/>'+
    /* 지판 */
    '<path d="M53 42 l14 0 5 110 -24 0 z" fill="#4A3A2C"/>'+
    /* 브리지 · 테일피스 */
    '<path d="M49 173 l22 0" stroke-width="3.2"/>'+
    '<path d="M55 182 l10 0 -2 24 -6 0 z" fill="#4A3A2C"/>'+
    '<path d="M57 178 l0 4 M63 178 l0 4" stroke-width="1.6"/>'+

}

/* 손가락 자리 확대도.
   1지는 현 길이의 3분의 1 안에 몰려 있어 바이올린 그림으로는 번호가 겹친다.
   그 구간만 늘려 그려서 2번과 3번이 반음으로 붙어 있는 것을 눈으로 보게 한다. */
var FING_RATIO = [0, 0.109, 0.206, 0.251, 0.333];   /* 너트에서 잰 현 길이 비율 */
function fingerChartSVG(stringId, active){
  var ids = FINGERS[stringId], left = 20, right = 318, y = 48, i, g = '';
  function xOf(f){ return left + (FING_RATIO[f] / FING_RATIO[4]) * (right - left); }
  g += '<rect x="10" y="36" width="322" height="24" rx="6" fill="#4A3A2C"/>';
  g += '<line x1="'+left+'" y1="'+y+'" x2="330" y2="'+y+'" stroke="#D8CDBD" stroke-width="3" stroke-linecap="round"/>';
  g += '<line x1="'+left+'" y1="31" x2="'+left+'" y2="65" stroke="#E9D3AE" stroke-width="7" stroke-linecap="round"/>';
  for (i=0;i<5;i++){
    var x = xOf(i), on = (i === active), r = on ? 12 : 8.5;
    g += '<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="'+r+'" fill="'+(on?'var(--yellow)':(i?'var(--paper)':'none'))+
         '" stroke="'+(i||on?'var(--ink)':'#E9D3AE')+'" stroke-width="'+(on?3:2)+'"'+(on?' class="glow"':'')+'/>';
    g += '<text x="'+x.toFixed(1)+'" y="22" text-anchor="middle" font-size="'+(on?22:18)+
         '" font-weight="800" fill="var(--ink)" font-family="var(--ff)">'+i+'</text>';
    g += '<text x="'+x.toFixed(1)+'" y="90" text-anchor="middle" font-size="'+(on?19:16)+
         '" font-weight="'+(on?800:600)+'" fill="'+(on?'var(--coral-d)':'var(--ink2)')+
         '" font-family="var(--ff)">'+esc(toneKo(ids[i]))+'</text>';
  }
  return '<svg class="fingerchart" viewBox="0 0 342 98" role="img" aria-label="'+
    esc(NOTES[stringId].ko+'줄 손가락 자리. '+ids.map(function(t,f){ return f+'번 '+toneKo(t); }).join(', '))+
    '" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';

/* ============================================================
   5. 소리 — Web Audio API 합성 (외부 오디오 파일 없음)
      "시작" 버튼을 누른 뒤에만 AudioContext를 만든다.
   ============================================================ */
var AC = null, MASTER = null;
function audioReady(){
  if (AC) return true;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return false;
  try {
    AC = new Ctx();
    MASTER = AC.createGain();
    MASTER.gain.value = 0.9;
    MASTER.connect(AC.destination);
  } catch(e){ AC = null; return false; }
  return true;
}
function resumeAudio(){ if (AC && AC.state === 'suspended') { try{ AC.resume(); }catch(e){} } }

/* 사인파 + 2·3배음, 약 1.2초 감쇠 — 부드러운 현 느낌 */
function tone(freq, dur, peak, when){
  if (state.muted || !AC) return;
  resumeAudio();
  dur  = dur  || 1.2;
  peak = peak || 0.20;
  var t = AC.currentTime + (when || 0);
  var env = AC.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(peak, t + 0.025);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  env.connect(MASTER);
  var parts = [[1,1],[2,0.30],[3,0.12]];
  for (var i=0;i<parts.length;i++){
    var o = AC.createOscillator(), og = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq * parts[i][0], t);
    og.gain.value = parts[i][1];
    o.connect(og); og.connect(env);
    o.start(t); o.stop(t + dur + 0.05);
  }
}
function playNote(id){ if (TONES[id]) tone(TONES[id].freq, 1.2, 0.20); }
function playFanfare(){ /* 상행 3음, 0.6초 */
  tone(523.25,0.28,0.16,0); tone(659.25,0.28,0.16,0.16); tone(783.99,0.42,0.18,0.32);
}
function playSoft(){ tone(164.81, 0.30, 0.16); }  /* 오답 — 부드러운 낮은 "통~" */

/* ============================================================
   7. 문항 생성 · 채점  (UI와 분리된 순수 로직)
   ============================================================ */
/* 문항 한 개를 사람이 읽는 말로 풀어 주는 해석기 — 화면·스크린리더·채점이 같은 말을 쓴다 */
function itemIsPos1(item){ return item && item.course === 'pos1'; }
function itemToneId(item){ return itemIsPos1(item) ? item.tone : item.note; }
function itemStep(item){ return TONES[itemToneId(item)].step; }
function itemAcc(item){ return TONES[itemToneId(item)].acc; }
function itemAnswerLabel(item){
  if (!itemIsPos1(item)) return NOTES[item.note].ko;
  return item.type === 'F' ? (item.finger + '번 손가락') : toneKo(item.tone);
}
function itemWhere(item){
  if (!itemIsPos1(item)) return NOTES[item.note].where;
  return toneKo(item.tone) + '는 ' + NOTES[item.string].ko + '줄 ' + item.finger + '번 손가락이에요.';
}
function shuffle(arr, rnd){
  rnd = rnd || Math.random;
  var a = arr.slice(), i, j, t;
  for (i=a.length-1;i>0;i--){ j = Math.floor(rnd()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* 출제 범위 안의 음을 고르게 섞은 목록 */
function spreadNotes(notes, count){
  var out = [], i, pool = [];
  while (out.length < count){
    if (!pool.length) pool = shuffle(notes);
    out.push(pool.pop());
  }
  /* 같은 음이 3번 연속되지 않도록 한 번 다듬기 */
  for (i=2;i<out.length;i++){
    if (out[i]===out[i-1] && out[i]===out[i-2]){
      var alt = notes.filter(function(n){ return n!==out[i]; });
      if (alt.length) out[i] = alt[Math.floor(Math.random()*alt.length)];
    }
  }
  return out;
}
/* 유형 순환: 단일 현 단계는 A·B 3문항씩, 교차 단계는 A·B(·C) 번갈아 */
function typeCycle(stage, count, useC){
  var out = [], i;
  if (stage.learn){
    for (i=0;i<count;i++) out.push(i%2===0 ? 'A' : 'B');
  } else {
    var cyc = useC ? ['A','B','C'] : ['A','B'];
    for (i=0;i<count;i++) out.push(cyc[i%cyc.length]);
  }
  return out;
}
function buildQuiz(stageNo, useC){
  var st = STAGES[stageNo-1];
  var notes = spreadNotes(st.notes, st.count);
  var types = typeCycle(st, st.count, useC && st.notes.length > 1);
  var items = [], i;
  for (i=0;i<st.count;i++) items.push({ note:notes[i], type:types[i] });
  return {
    stage : stageNo,
    items : items,
    idx   : 0,
    attempt : 0,          /* 0 = 첫 시도, 1 = 재도전 */
    hintUsed : false,
    revealed : false,
    points : 0,           /* 별 계산용 점수 (힌트/재도전 0.5) */
    score  : 0,           /* 화면에 보이는 점수 */
    ok     : 0,           /* 맞힌 수 = 첫 시도 정답 문항 수 */
    marks  : [],          /* 'done' | 'miss' */
    missed : {},          /* 이번 단계에서 틀린 음 */
    placed : null,        /* 유형 B 임시 위치 */
    phase  : 'ask'        /* ask | answered | reveal */
  };
}
/* 틀린 음은 다음 3문항 안에 다시 나오도록 예정표를 고친다 */
function buildPos1Quiz(stageNo){
  var st = POS1_STAGES[stageNo-1];
  var order = spreadNotes([0,1,2,3,4], POS1_COUNT), items = [], i;
  for (i=0;i<POS1_COUNT;i++){
    items.push({ course:'pos1', string:st.string, finger:order[i],
                 tone:FINGERS[st.string][order[i]],
                 type:(i % 2 === 0 ? 'N' : 'F') });   /* 계이름 <-> 손가락번호 교차 */
  }
  return { course:'pos1', stage:stageNo, items:items, idx:0, attempt:0, hintUsed:false,
           revealed:false, points:0, score:0, ok:0, marks:[], missed:{},
           placed:null, phase:'ask' };
}
/* 틀린 손가락은 다음 3문항 안에 다시 나오게 한다 */
function requeueFinger(q){
  var cur = q.items[q.idx], i, from = q.idx + 1, to = Math.min(q.items.length - 1, q.idx + 3);
  for (i=from;i<=to;i++){ if (q.items[i].finger === cur.finger) return; }
  if (from <= to){ q.items[from].finger = cur.finger; q.items[from].tone = cur.tone; }
}
function pos1Stars(q){
  if (q.points >= q.items.length) return 3;
  if (q.ok >= POS1_PASS) return 2;
  return 1;
}

/* 유형 B는 빈 오선지 대신 음표를 먼저 올려 두고 옮기게 한다 */
function primePlacement(q){
  var item = q && q.items[q.idx];
  if (!item || item.type !== 'B'){ if (q) q.placed = null; return; }
  var ans = NOTES[item.note].step;
  var start = 4;                    /* 셋째 줄에서 출발 */
  if (start === ans) start = 0;
  q.placed = clampStep(start);
}
function requeueNote(quiz, noteId){
  var i, from = quiz.idx + 1, to = Math.min(quiz.items.length - 1, quiz.idx + 3);
  for (i=from;i<=to;i++){ if (quiz.items[i].note === noteId) return; }
  if (from <= to) quiz.items[from].note = noteId;
}
function stageStars(quiz){
  var st = STAGES[quiz.stage-1];
  if (quiz.points >= quiz.items.length) return 3;   /* 만점: 모두 힌트 없이 첫 시도 정답 */
  if (quiz.ok >= st.pass) return 2;                 /* 통과 */
  return 1;                                          /* 미통과(☆) */
}
function starText(n){
  if (n>=3) return '★★★';
  if (n===2) return '★★';
  if (n===1) return '☆';
  return '';
}

/* ---------- 단계 지도 ---------- */
function stationBtn(act, no, open, current, title, sub, stars){

         '<span class="tt"><b>'+esc(title)+'</b><span>'+(stars?'<span class="st">'+stars+'</span> ':'')+esc(sub)+'</span></span></button>';

function renderMap(){

       '<button class="bigbtn sky" data-act="pos1">1지 배우기</button>'+

/* ---------- 학습 화면 (단일 현 단계) ---------- */
function renderLearn(){

/* ---------- 조표 미니 활동 (교차·종합 단계) ---------- */

/* ---------- 퀴즈 ---------- */
var PRAISE = ['참 잘했어요! 🌟','딩동댕! {n}를 찾았어요!','귀가 정말 좋네요!'];
function praiseFor(noteKo){
  var t = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  return t.replace('{n}', noteKo);
}
function promptFor(item){
  if (itemIsPos1(item)){
    return item.type === 'N' ? '이 음표는 무슨 소리일까요?' : '몇 번 손가락으로 짚을까요?';
  }
  var n = NOTES[item.note];
  return item.type === 'A' ? '이 음표는 무슨 소리일까요?'
       : item.type === 'B' ? n.ko + '는 어디에 살까요? 위아래로 옮겨요.'
       : '잘 듣고 맞혀 보세요!';
}
/* 문항 머리줄: 제목·번호·칩·점수, 아래에 진행 점 */
function quizHeadRow(q, title, chip){
  var h = '<div class="qrow"><span class="qt">'+esc(title)+' <small>'+(q.idx+1)+'/'+q.items.length+'</small></span>'+
          (chip||'')+'<span class="scorechip">'+q.score+'점</span></div><div class="pips" aria-hidden="true">', i;
  for (i=0;i<q.items.length;i++){
    var cls = q.marks[i] === 'done' ? 'done' : (q.marks[i] === 'miss' ? 'miss' : (i===q.idx ? 'now' : ''));
    h += '<span class="pip '+cls+'"></span>';
  }
  return h + '</div>';
}
/* 정답·재도전·정답 공개 말풍선 — 개방현 코스와 1지 코스가 같이 쓴다 */
function quizBubble(q, item, showAnswer){
  if (q.phase === 'answered') return say('dodo','joy', q.lastPraise || praiseFor(itemAnswerLabel(item)), 'ok', '✓');
  if (showAnswer) return say('mimi','base', '정답은 '+itemAnswerLabel(item)+'예요. '+itemWhere(item), 'hint', '!');
  if (q.attempt === 1) return say('sori','cheer','앗, 아깝다! 다시 한 번 해볼까요? 🎻','retry','↺');
  return say('dodo','base', promptFor(item));
}
/* 힌트·지도로 — 답한 뒤에도 자리를 지켜 화면이 들썩이지 않게 한다 */
function hintRow(q, showAnswer){
  var canHint = !showAnswer && q.phase === 'ask' && !q.hintUsed;
  return '<div class="btnrow small"><button class="bigbtn plain" data-act="hint"'+(canHint?'':' disabled')+'>💡 힌트</button>'+
         '<button class="bigbtn plain" data-act="tomap">지도로</button></div>';
}

function renderPos1Quiz(){
  var q = state.quiz, st = POS1_STAGES[q.stage-1], item = q.items[q.idx], t = TONES[item.tone];
  var showAnswer = (q.phase === 'reveal' || q.phase === 'answered-reveal');
  var hint = q.hintUsed || q.attempt === 1 || showAnswer, nx = noteXFor([], QW);
  var h = '<div class="card"><div class="hd">'+
          quizHeadRow(q, st.title, '<span class="chip sky">'+esc(NOTES[st.string].ko)+'줄</span>')+'</div>';

       '</div></div><div class="ctrl">';

    h += '<button class="bigbtn green" data-act="followUp" data-note="'+item.tone+'">따라 눌러 보기 — '+esc(itemAnswerLabel(item))+'</button>';

function renderQuiz(){
  if (state.quiz.course === 'pos1') return renderPos1Quiz();
  var q = state.quiz, st = STAGES[q.stage-1], item = q.items[q.idx], n = NOTES[item.note];
  var sharps = st.key ? KEYS[st.key].sharps : [];
  var nx = noteXFor(sharps, QW);
  var showAnswer = (q.phase === 'reveal' || q.phase === 'answered-reveal');
  var hint = q.hintUsed || q.attempt === 1 || showAnswer;
  var ask = q.phase === 'ask';
  var chip = st.key ? '<span class="chip">'+esc(KEYS[st.key].ko)+' · 샵 '+sharps.length+'</span>' : '';

  var h = '<div class="card"><div class="hd">'+quizHeadRow(q, st.title, chip);
  if (item.type === 'B' && !showAnswer) h += '<p class="target">'+esc(n.ko)+' <small>('+n.en+')</small></p>';
  h += '</div><div class="fig">';
  if (item.type === 'C' && !showAnswer){
    h += '<button class="listen" data-act="replay" data-note="'+item.note+'" aria-label="다시 듣기">🔊<span>다시 듣기</span></button>';
  } else if (item.type === 'B' && !showAnswer){
    var placedLbl = (q.placed === null || q.placed === undefined) ? '아직 놓지 않았어요' : '지금 ' + placeLabel(q.placed) + '에 있어요';
    h += '<div class="staffwrap pick" id="pickStaff" tabindex="0" role="group"'+
         ' aria-label="'+esc('음표가 놓인 오선지. 끌거나 위아래 화살표로 옮기고 엔터로 확인해요. '+placedLbl)+'">'+
         staffSVG({ w:QW, fit:false, sharps:sharps, notes:[], noteX:nx, label:'음표를 놓을 오선지', extra:'<g id="placeLayer"></g>' })+'</div>';
  } else {
    var notes = (item.type === 'A' || showAnswer) ? [{ step:n.step, x:nx, color:(showAnswer ? 'var(--green-d)' : 'var(--ink)') }] : [];
    h += '<div class="staffwrap" data-act="replay" data-note="'+item.note+'">'+
         staffSVG({ w:QW, sharps:sharps, notes:notes, noteX:nx, label:'문제 음표' })+'</div>';
  }
  if (hint) h += '<div class="vio">'+violinSVG(item.note)+'</div>';
  h += '</div><div class="ctrl">';
  if (showAnswer){
    h += '<button class="bigbtn green" data-act="followUp" data-note="'+item.note+'">따라 눌러 보기 — '+esc(n.ko)+' ('+n.en+')</button>';
  } else if (item.type === 'B'){
    h += '<div class="btnrow three">'+

         '<button class="bigbtn sky" data-act="nudge" data-dir="-1" aria-label="한 칸 아래로"'+(ask?'':' disabled')+'>▼ 아래로</button>'+
         '<button class="bigbtn green" data-act="confirmPlace"'+(ask?'':' disabled')+'>여기!</button></div>';
  } else {
    h += nameButtons({ disabled: !ask });
  }
  h += quizBubble(q, item, showAnswer) + hintRow(q, showAnswer);
  return h + '</div></div>';
}

/* ---------- 단계 결과 ---------- */
function renderResult(){

  h += '<div class="starrow">'+starText(r.stars)+'</div>';
  h += '<p class="lead">맞힌 수 '+r.ok+' / '+r.total+'  ·  '+r.score+'점</p>';
  if (r.missLabels && r.missLabels.length){
    h += '<p class="muted">이 음을 조금 더 연습해요</p><div class="misslist">';
    for (var i=0;i<r.missLabels.length;i++) h += '<span class="misschip">'+esc(r.missLabels[i])+'</span>';
    h += '</div>';
  }
  h += '</div><div class="ctrl">';
  h += say(passed?'dodo':'sori', passed?'joy':'cheer',
           passed ? '멋져요! 다음 정거장으로 가요.' : '한 번 더 해볼까요? 친구는 할 수 있어요.', passed?'ok':'', passed?'✓':'');

}

/* ---------- 학부모·교사 화면 ---------- */
function statCell(label, stars, tries){
  var rate = tries && tries.total ? Math.round(tries.ok/tries.total*100)+'%' : '—';
  return '<div class="stat"><b>'+esc(label)+' <span class="s">'+(stars?starText(stars):'')+'</span></b><span class="r">'+rate+'</span></div>';

function renderParent(){
  var h = '<div class="card stack parent">'+head('학부모 · 교사 화면')+'<div class="fig col" style="justify-content:flex-start">';
  h += '<p class="sec">개방현 코스 — 별 · 정답률</p><div class="statgrid">';
  for (var i=1;i<=8;i++) h += statCell(i+'단계', state.stars[i], state.tries[i]);
  h += '</div><p class="sec">1지 코스</p><div class="statgrid">';
  for (var k=1;k<=POS1_STAGES.length;k++) h += statCell(NOTES[POS1_STAGES[k-1].string].ko+'줄', state.pos1.stars[k], state.pos1.tries[k]);

  for (var j=0;j<keys.length;j++){

    if (nn) h += '<span class="misschip">'+esc(nn.ko)+' · '+state.miss[keys[j]]+'회</span>';

  h += '</div>';
  h += '</div><div class="ctrl">';

       (state.typeC?'켜짐':'꺼짐')+'</button></div>';
  h += '<p class="muted small note">청음이 어려운 친구는 꺼 두어도 8단계를 모두 끝낼 수 있어요.</p>';

/* ---------- 라우터 ---------- */
var liveEl = document.getElementById('live');
var lastScreen = null;
/* 스크린리더에 짧은 안내만 따로 전달한다 (화면 전체 재낭독 방지) */
function announce(msg){
  if (!liveEl) return;
  liveEl.textContent = '';
  setTimeout(function(){ liveEl.textContent = msg; }, 40);
}
/* 다시 그린 뒤에도 키보드 포커스를 잃지 않도록 선택자를 기억한다 */
function focusKeyOf(el){
  if (!el || el === document.body) return null;
  if (el.id) return '#' + el.id;
  var act = el.getAttribute && el.getAttribute('data-act');
  if (!act) return null;
  var k = '[data-act="' + act + '"]';
  var attrs = ['data-note','data-dir','data-stage','data-key'], i, v;
  for (i=0;i<attrs.length;i++){
    v = el.getAttribute(attrs[i]);
    if (v) k += '[' + attrs[i] + '="' + v + '"]';
  }
  return k;
}
function render(){
  var prevFocus = focusKeyOf(document.activeElement);
  var screenChanged = (state.screen !== lastScreen);
  var html;
  switch (state.screen){
    case 'start':    html = renderStart(); break;
    case 'map':      html = renderMap(); break;
    case 'play':     html = renderPlay(); break;
    case 'pos1map':  html = renderPos1Map(); break;
    case 'pos1learn':html = renderPos1Learn(); break;
    case 'learn':    html = renderLearn(); break;
    case 'keyintro': html = renderKeyIntro(); break;
    case 'quiz':     html = renderQuiz(); break;
    case 'result':   html = renderResult(); break;
    case 'cert':     html = renderCert(); break;
    case 'parent':   html = renderParent(); break;
    default:         html = renderStart();
  }
  app.innerHTML = html;
  lastScreen = state.screen;
  if (state.screen === 'quiz') bindQuiz();
  /* 카드 등장 애니메이션은 화면이 바뀔 때만 — 문항마다 튀지 않게 */
  if (!reduceMotion && screenChanged) { var c = app.querySelector('.card'); if (c) { c.classList.add('pop'); } }
  if (prevFocus){
    var back = app.querySelector(prevFocus);
    if (back && back.focus) back.focus({ preventScroll:true });
  }
}
/* ============================================================
   9. 유형 B — 오선지 터치 + 스냅
   ============================================================ */
function clampStep(s){ return Math.max(PLACE_MIN, Math.min(PLACE_MAX, s)); }
var ORD = ['첫째','둘째','셋째','넷째','다섯째','여섯째'];
/* step -> 사람이 읽는 자리 이름. 계이름은 말하지 않는다 (정답 노출 방지) */
function placeLabel(step){
  if (step >= 0) return (step % 2 === 0) ? ORD[step/2] + ' 줄' : ORD[(step-1)/2] + ' 칸';
  var d = -step;
  if (d === 1) return '첫째 줄 바로 아래 칸';
  var led = Math.floor(d/2);
  return '아래 ' + ORD[led-1] + ' 덧줄' + (d % 2 ? ' 아래 칸' : '');
}
function snapStepFromClientY(svg, clientY){
  /* 오선지는 남는 높이에 맞춰 늘고 줄며 가운데 정렬된다.
     화면 좌표를 SVG 좌표로 되돌려야 배율·여백과 상관없이 정확하다. */
  var m = svg.getScreenCTM && svg.getScreenCTM();
  if (!m || !m.d) return null;
  var y = (clientY - m.f) / m.d;
  return clampStep(Math.round((BASE_Y - y) / (S/2)));
}
function updatePlaceLayer(){
  var layer = document.getElementById('placeLayer');
  if (!layer) return;
  var q = state.quiz, st = STAGES[q.stage-1];
  var nx = noteXFor(st.key ? KEYS[st.key].sharps : [], QW);
  var out = '';
  if (q.hover !== null && q.hover !== undefined && q.hover !== q.placed){
    out += noteSVG(nx, q.hover, { color:'var(--sky-d)', opacity:0.45 });
  }
  if (q.placed !== null && q.placed !== undefined){
    out += noteSVG(nx, q.placed, { color:'var(--coral-d)' });
  }
  layer.innerHTML = out;
}
function bindQuiz(){
  var q = state.quiz;
  var wrap = document.getElementById('pickStaff');
  if (!wrap) return;
  var svg = wrap.querySelector('svg');
  if (!svg) return;
  updatePlaceLayer();
  var dragging = false;
  wrap.addEventListener('pointerdown', function(ev){
    if (q.phase !== 'ask') return;
    var st = snapStepFromClientY(svg, ev.clientY);
    if (st === null) return;
    dragging = true;
    try { wrap.setPointerCapture(ev.pointerId); } catch(e){}
    q.placed = st; q.hover = null; updatePlaceLayer();
  });
  /* 누른 채로 움직이면 음표가 손가락을 따라오고, 마우스는 지나가기만 해도 미리 보여 준다 */
  wrap.addEventListener('pointermove', function(ev){
    var st = snapStepFromClientY(svg, ev.clientY);
    if (st === null) return;
    if (dragging){ if (q.placed !== st){ q.placed = st; updatePlaceLayer(); } }
    else if (ev.pointerType === 'mouse' && q.phase === 'ask' && q.hover !== st){ q.hover = st; updatePlaceLayer(); }
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    render();
    announce(placeLabel(q.placed));
  }
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);
  wrap.addEventListener('pointerleave', function(){
    if (!dragging && q.hover !== null && q.hover !== undefined){ q.hover = null; updatePlaceLayer(); }
  });
  wrap.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'ArrowUp' || k === 'ArrowDown'){
      ev.preventDefault();
      var base = (q.placed === null || q.placed === undefined) ? 3 : q.placed;
      q.placed = clampStep(base + (k === 'ArrowUp' ? 1 : -1));
      q.hover = null;
      render();
      announce(placeLabel(q.placed));
    } else if (k === 'Enter' || k === ' ' || k === 'Spacebar'){
      if (q.placed === null || q.placed === undefined) return;
      ev.preventDefault();
      handleAnswer(q.placed === NOTES[currentItem().note].step);
    }
  });
}

/* ============================================================
   10. 퀴즈 진행
   ============================================================ */
function sparkle(){
  if (reduceMotion) return;
  var cx = window.innerWidth/2, cy = window.innerHeight*0.38, i;
  for (i=0;i<10;i++){
    var s = document.createElement('span');
    s.className = 'spark';
    s.textContent = i%2 ? '⭐' : '✨';
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', (Math.random()*260-130).toFixed(0)+'px');
    s.style.setProperty('--dy', (Math.random()*-190-30).toFixed(0)+'px');
    sparkLayer.appendChild(s);
    (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1000); })(s);
  }
}
function currentItem(){ return state.quiz ? state.quiz.items[state.quiz.idx] : null; }

function handleAnswer(correct){
  var q = state.quiz, item = currentItem();
  if (!q || !item || q.phase !== 'ask') return;
  var pos1 = itemIsPos1(item), missKey = pos1 ? item.tone : item.note;
  if (correct){
    var pts = (q.hintUsed || q.attempt > 0) ? 0.5 : 1;
    q.points += pts;
    q.score  += (q.hintUsed ? 5 : 10);
    if (q.attempt === 0) { q.ok += 1; q.marks[q.idx] = 'done'; }
    else q.marks[q.idx] = 'miss';
    q.phase = 'answered';
    q.lastPraise = praiseFor(itemAnswerLabel(item));
    announce('정답이에요. ' + q.lastPraise);
    playFanfare();
    sparkle();
    render();
    setTimeout(function(){ nextItem(q); }, 1000);
  } else {
    playSoft();
    q.missed[missKey] = (q.missed[missKey]||0) + 1;
    if (!pos1) state.miss[item.note] = (state.miss[item.note]||0) + 1;
    if (q.attempt === 0){
      q.attempt = 1;
      q.marks[q.idx] = 'miss';
      q.hintUsed = true;            /* 재도전 중에는 힌트가 자동으로 켜짐 */
      q.hover = null;
      primePlacement(q);            /* 음표를 출발 자리로 되돌려 다시 옮기게 한다 */
      if (pos1) requeueFinger(q); else requeueNote(q, item.note);
      announce('앗, 아깝다. 다시 한 번 해볼까요?');
      render();
      setTimeout(function(){ playNote(itemToneId(item)); }, 260);
    } else {
      q.phase = 'reveal';
      q.placed = null; q.hover = null;
      if (pos1) requeueFinger(q); else requeueNote(q, item.note);
      announce('정답은 ' + itemAnswerLabel(item) + '예요. ' + itemWhere(item));
      render();
      setTimeout(function(){ playNote(itemToneId(item)); }, 260);
    }
    save();
  }
}
function nextItem(expected){
  var q = state.quiz;
  /* 자동 넘김을 기다리는 동안 친구가 지도로 나갔거나 새 단계를 시작했을 수 있다 */
  if (!q || state.screen !== 'quiz') return;
  if (expected && expected !== q) return;
  q.idx += 1;
  q.attempt = 0; q.hintUsed = false; q.phase = 'ask';
  q.placed = null; q.hover = null; q.lastPraise = null;
  if (q.idx >= q.items.length){ finishStage(); return; }
  primePlacement(q);
  render();
  autoPlayCurrent();
}
function autoPlayCurrent(){
  var item = currentItem();
  if (!item) return;
  var q = state.quiz;
  announce((q.idx + 1) + '번 문제. ' + promptFor(item));
  setTimeout(function(){ if (state.screen === 'quiz' && state.quiz === q) playNote(itemToneId(item)); }, 220);
}
function finishStage(){
  var q = state.quiz;
  if (q.course === 'pos1'){ finishPos1Stage(q); return; }
  var st = STAGES[q.stage-1];
  var stars = stageStars(q);
  var prev = state.stars[q.stage] || 0;
  state.stars[q.stage] = Math.max(prev, stars);
  var t = state.tries[q.stage] || { ok:0, total:0 };
  t.ok += q.ok; t.total += q.items.length;
  state.tries[q.stage] = t;
  if (stars >= 2 && state.unlocked < Math.min(8, q.stage+1)) state.unlocked = Math.min(8, q.stage+1);
  if (stars >= 2 && q.stage === 8) state.unlocked = 8;
  state.result = { course:'open', stage:q.stage, stars:stars, ok:q.ok, total:q.items.length,
                   score:q.score, missLabels:Object.keys(q.missed).map(function(k){ return NOTES[k].ko + ' (' + NOTES[k].en + ')'; }) };
  state.screen = 'result';
  state.quiz = null;
  announce('단계가 끝났어요. 맞힌 수 ' + state.result.ok + ' 나누기 ' + state.result.total + ', 별 ' + stars + '개.');
  save();
  render();
}
function finishPos1Stage(q){
  var stars = pos1Stars(q), prev = state.pos1.stars[q.stage] || 0;
  state.pos1.stars[q.stage] = Math.max(prev, stars);
  var t = state.pos1.tries[q.stage] || { ok:0, total:0 };
  t.ok += q.ok; t.total += q.items.length;
  state.pos1.tries[q.stage] = t;
  var k;
  for (k in q.missed) state.pos1.miss[k] = (state.pos1.miss[k]||0) + q.missed[k];
  if (stars >= 2 && state.pos1.unlocked < Math.min(POS1_STAGES.length, q.stage+1)){
    state.pos1.unlocked = Math.min(POS1_STAGES.length, q.stage+1);
  }
  state.result = { course:'pos1', stage:q.stage, stars:stars, ok:q.ok, total:q.items.length,
                   score:q.score, missLabels:Object.keys(q.missed).map(toneKo) };
  state.screen = 'result';
  state.quiz = null;
  announce('단계가 끝났어요. 맞힌 수 ' + q.ok + ' 나누기 ' + q.items.length + ', 별 ' + stars + '개.');
  save();
  render();
}
function startPos1Stage(no){
  state.course = 'pos1';
  state.pos1.stage = no;
  state.pos1.learnFinger = 0;
  state.screen = 'pos1learn';
  render();
  setTimeout(function(){ playNote(FINGERS[POS1_STAGES[no-1].string][0]); }, 260);
}
function startPos1Quiz(){
  state.quiz = buildPos1Quiz(state.pos1.stage);
  state.screen = 'quiz';
  render();
  autoPlayCurrent();
}
function startStage(no){
  state.course = 'open';
  state.stage = no;
  var st = STAGES[no-1];
  if (st.learn){ state.learnIdx = 0; state.screen = 'learn'; render(); setTimeout(function(){ playNote(st.notes[0]); }, 260); }
  else { state.keyIntro = []; state.screen = 'keyintro'; render(); }
}
function startQuiz(){
  state.quiz = buildQuiz(state.stage, state.typeC);
  primePlacement(state.quiz);
  state.screen = 'quiz';
  render();
  autoPlayCurrent();
}

/* ============================================================
   11. 이벤트
   ============================================================ */
app.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');

  if (act === 'start'){ audioReady(); resumeAudio(); state.course = 'open'; state.screen = 'map'; render(); return; }
  if (act === 'tomap'){
    state.screen = (state.course === 'pos1') ? 'pos1map' : 'map';
    state.quiz = null; render(); return;
  }
  if (act === 'home'){ state.screen = 'start'; state.quiz = null; render(); return; }
  if (act === 'pos1'){
    audioReady(); resumeAudio();
    state.course = 'pos1'; state.screen = 'pos1map'; render(); return;
  }
  if (act === 'pos1stage'){ startPos1Stage(parseInt(t.getAttribute('data-stage'),10)); return; }
  if (act === 'pos1quiz'){ startPos1Quiz(); return; }
  if (act === 'learnFinger'){
    state.pos1.learnFinger = parseInt(t.getAttribute('data-finger'),10);
    render();
    playNote(FINGERS[POS1_STAGES[state.pos1.stage-1].string][state.pos1.learnFinger]);
    return;
  }
  if (act === 'pickTone'){
    var qt = state.quiz; if (!qt || qt.phase !== 'ask') return;
    handleAnswer(t.getAttribute('data-tone') === currentItem().tone);
    return;
  }
  if (act === 'pickFinger'){
    var qf = state.quiz; if (!qf || qf.phase !== 'ask') return;
    handleAnswer(parseInt(t.getAttribute('data-finger'),10) === currentItem().finger);
    return;
  }
  if (act === 'stage'){ state.course = 'open'; startStage(parseInt(t.getAttribute('data-stage'),10)); return; }
  if (act === 'cert'){ state.screen = 'cert'; render(); return; }
  if (act === 'play'){
    audioReady(); resumeAudio();
    state.screen = 'play'; render();
    setTimeout(function(){ playNote(state.play.note); }, 200);
    return;
  }
  if (act === 'playPick'){
    state.play.note = t.getAttribute('data-note');
    render(); playNote(state.play.note);
    announce(NOTES[state.play.note].ko + '. ' + NOTES[state.play.note].where);
    return;
  }
  if (act === 'playKey'){
    state.play.key = t.getAttribute('data-key');
    render();
    announce(KEYS[state.play.key].ko + ', 샵 ' + KEYS[state.play.key].sharps.length + '개');
    return;
  }
  if (act === 'replay'){ playNote(t.getAttribute('data-note')); return; }
  if (act === 'learnNext'){
    if (state.learnIdx < 2){
      state.learnIdx += 1; render();
      setTimeout(function(){ playNote(STAGES[state.stage-1].notes[0]); }, 240);
    } else startQuiz();
    return;
  }
  if (act === 'quizStart'){ startQuiz(); return; }
  if (act === 'hint'){
    var q = state.quiz; if (!q || q.phase !== 'ask') return;
    q.hintUsed = true; render(); playNote(currentItem().note); return;
  }
  if (act === 'pick'){
    var qq = state.quiz; if (!qq || qq.phase !== 'ask') return;
    handleAnswer(t.getAttribute('data-note') === currentItem().note);
    return;
  }
  if (act === 'nudge'){
    var q3 = state.quiz; if (!q3 || q3.phase !== 'ask') return;
    var base = (q3.placed === null || q3.placed === undefined) ? 3 : q3.placed;
    q3.placed = clampStep(base + parseInt(t.getAttribute('data-dir'),10));
    q3.hover = null; render(); announce(placeLabel(q3.placed)); return;
  }
  if (act === 'confirmPlace'){
    var q4 = state.quiz; if (!q4 || q4.phase !== 'ask') return;
    if (q4.placed === null || q4.placed === undefined) return;
    handleAnswer(q4.placed === NOTES[currentItem().note].step);
    return;
  }
  if (act === 'followUp'){
    var q5 = state.quiz;
    if (!q5 || q5.phase !== 'reveal') return;
    q5.phase = 'answered-reveal';
    playNote(t.getAttribute('data-note'));
    setTimeout(function(){ nextItem(q5); }, 650);
    return;
  }
  if (act === 'saveName'){
    var el = document.getElementById('nameIn');
    state.name = el ? el.value.trim().slice(0,12) : '';
    save(); render(); return;
  }
  if (act === 'toggleC'){ state.typeC = !state.typeC; save(); render(); return; }
  if (act === 'reset'){
    if (window.confirm('진행 상태와 별을 모두 지울까요? 되돌릴 수 없어요.')){
      resetAll(); state.screen = 'map'; render();
    }
    return;
  }
});
/* 조표 미니 활동 — 샵 하나씩 눌러 보기 */
app.addEventListener('click', function(ev){
  var g = ev.target.closest ? ev.target.closest('.tapsharp') : null;
  if (!g || state.screen !== 'keyintro') return;
  var sid = g.getAttribute('data-sharp');
  state.keyIntro = state.keyIntro || [];
  if (state.keyIntro.indexOf(sid) < 0) state.keyIntro.push(sid);
  render();
  tone(880, 0.25, 0.12);
});

/* 음소거 토글 */
var muteBtn = document.getElementById('muteBtn');
function paintMute(){
  muteBtn.textContent = state.muted ? '🔇' : '🔊';
  muteBtn.setAttribute('aria-pressed', state.muted ? 'true' : 'false');
  muteBtn.setAttribute('aria-label', state.muted ? '소리 켜기' : '소리 끄기');
}
muteBtn.addEventListener('click', function(){
  state.muted = !state.muted; paintMute(); save();
  if (!state.muted && AC) { resumeAudio(); tone(440, 0.4, 0.14); }
});

/* ⚙️ 3초 길게 누르기로 학부모·교사 화면 */
var gearBtn = document.getElementById('gearBtn'), gearTimer = null;
function gearStart(ev){
  ev.preventDefault();
  clearTimeout(gearTimer);
  gearTimer = setTimeout(function(){
    state.screen = 'parent'; render();
  }, 3000);
}
function gearEnd(){ clearTimeout(gearTimer); }
gearBtn.addEventListener('pointerdown', gearStart);
gearBtn.addEventListener('pointerup', gearEnd);
gearBtn.addEventListener('pointerleave', gearEnd);
gearBtn.addEventListener('pointercancel', gearEnd);
gearBtn.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ============================================================
   12. 시작
   ============================================================ */
load();
paintMute();
render();
</script>
