<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>바이올린 개방현 놀이 — 솔·레·라·미와 조표 배우기</title>
<meta name="description" content="바이올린 개방현 네 줄(솔·레·라·미)의 오선지 위치와 소리, 그리고 조표를 놀이처럼 익히는 어린이 학습 게임. 8단계 커리큘럼, 소리 자동 재생, 진행 저장.">
<meta name="theme-color" content="#FBF4E4">
<meta name="author" content="네다바웨이 NEDABAHWAY">
<link rel="canonical" href="https://www.nedabah.org/violin/">
<meta property="og:type" content="website">
<meta property="og:title" content="바이올린 개방현 놀이 — 솔·레·라·미와 조표 배우기">
<meta property="og:description" content="바이올린 개방현 네 줄의 오선지 위치·소리·조표를 놀이처럼 익히는 어린이 학습 게임.">
<meta property="og:url" content="https://www.nedabah.org/violin/">
<meta property="og:locale" content="ko_KR">
<style>
:root{
  --cream:#FBF4E4; --cream2:#F3E7CE; --paper:#FFFDF6;
  --ink:#332F29; --ink2:#6A6158; --line:#332F29;
  --yellow:#F6D46A; --yellow-d:#E4B93C;
  --sky:#9CD3E6; --sky-d:#6FB6CE;
  --green:#9FD183; --green-d:#3C7A2C;
  --coral:#F29E86; --coral-d:#C4603F;
  --brown:#B98A5E;
  --ok:#2C6E3B; --hint:#8A5A16;
  --ff: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:20px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--ff); color:var(--ink); background:var(--cream);
  line-height:1.55; word-break:keep-all; min-height:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:1rem}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:880px;margin:0 auto;padding:10px 14px 28px}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.topbar .spacer{flex:1}
.iconbtn{
  min-width:48px;min-height:48px;border:2px solid var(--line);border-radius:14px;
  background:var(--paper);font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn:active{transform:translateY(1px)}
.brandmini{font-size:.8rem;color:var(--ink2);letter-spacing:.02em}

.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:4px 5px 0 rgba(51,47,41,.13)}
.card + .card{margin-top:14px}
h1{font-size:1.6rem;line-height:1.3;letter-spacing:-.01em}
h2{font-size:1.25rem;line-height:1.35}
h3{font-size:1.05rem}
p{font-size:1rem}
.muted{color:var(--ink2);font-size:.9rem}
.center{text-align:center}

.bigbtn{
  display:block;width:100%;min-height:64px;border:3px solid var(--line);border-radius:20px;
  background:var(--yellow);font-size:1.3rem;font-weight:700;padding:12px 16px;
  box-shadow:3px 4px 0 var(--line);
}
.bigbtn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}
.bigbtn.sky{background:var(--sky)} .bigbtn.green{background:var(--green)}
.bigbtn.plain{background:var(--paper)}
.bigbtn[disabled]{opacity:.45;box-shadow:none;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow .bigbtn{flex:1 1 150px;width:auto}
.btnrow.tight .bigbtn{flex:1 1 40%;min-height:56px;font-size:1.1rem}

/* 계이름 버튼 4개 */
.namegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.namebtn{
  min-height:78px;min-width:64px;border:3px solid var(--line);border-radius:18px;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  box-shadow:3px 4px 0 var(--line);padding:6px 2px;
}
.namebtn .ko{font-size:1.7rem;font-weight:800;line-height:1.1}
.namebtn .en{font-size:.72rem;color:var(--ink2);letter-spacing:.06em}
.namebtn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}
.namebtn.is-on{background:var(--yellow)}
.namebtn[disabled]{opacity:.5;box-shadow:none}
@media (max-width:359px){ .namebtn .ko{font-size:1.45rem} }

.stafffig{display:block;width:100%;height:auto;max-width:560px;margin:0 auto;touch-action:manipulation}
.staffwrap{background:var(--paper);border-radius:16px;padding:4px 0}
@media (max-width:480px){ .staffwrap{margin-left:-10px;margin-right:-10px} }
.staffwrap.pick{cursor:pointer;touch-action:none}

.panelgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:720px){ .panelgrid.two{grid-template-columns:1.15fr .85fr;align-items:center} }

.violinfig{display:block;width:100%;max-width:190px;height:auto;margin:0 auto}

/* 진행 바 */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.pip.done{background:var(--green)} .pip.miss{background:var(--coral)} .pip.now{background:var(--yellow)}
.scorechip{margin-left:auto;font-weight:700;font-size:.95rem;border:2px solid var(--line);border-radius:999px;padding:2px 12px;background:var(--paper)}

/* 조표 카드 */
.keycard{border:3px solid var(--line);border-radius:18px;background:var(--cream2);padding:8px 10px;text-align:center}
.keycard h3{font-size:1rem;margin-bottom:2px}
.keycard .cnt{font-size:.85rem;color:var(--ink2)}
.keycard svg{display:block;width:100%;max-width:185px;height:auto;margin:2px auto 0}

/* 말풍선 */
.saystrip{display:flex;align-items:flex-end;gap:10px;margin-top:14px}
.saystrip .charbox{flex:0 0 auto;width:92px}
.saystrip .charbox svg{display:block;width:100%;height:auto}
.bubble{
  position:relative;flex:1;border:3px solid var(--line);border-radius:18px;background:var(--paper);
  padding:10px 14px;font-size:1.05rem;font-weight:600;min-height:56px;display:flex;align-items:center;
}
.bubble::before{content:"";position:absolute;left:-11px;bottom:16px;width:14px;height:14px;background:var(--paper);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.bubble.ok{background:#E8F5E1} .bubble.ok::before{background:#E8F5E1}
.bubble.retry{background:#FDF0E7} .bubble.retry::before{background:#FDF0E7}

.flagline{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;margin-top:10px}
.flagline .mark{width:34px;height:34px;border:3px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex:0 0 auto}
.flagline.ok .mark{background:var(--green)} .flagline.ok{color:var(--ok)}
.flagline.retry .mark{background:var(--coral)} .flagline.retry{color:var(--coral-d)}
.flagline.hint .mark{background:var(--yellow)} .flagline.hint{color:var(--hint)}

/* 단계 지도 */
.map{position:relative;padding:6px 0 2px}
.station{display:flex;align-items:center;gap:12px;padding:9px 10px;border:3px solid var(--line);border-radius:18px;background:var(--paper);width:100%;text-align:left;margin-bottom:10px;box-shadow:3px 4px 0 var(--line)}
.station:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}
.station[disabled]{opacity:.55;box-shadow:none;background:var(--cream2)}
.station .no{flex:0 0 auto;width:44px;height:44px;border:3px solid var(--line);border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
.station.current .no{background:var(--sky)}
.station .tt{flex:1;min-width:0}
.station .tt b{display:block;font-size:1.02rem}
.station .tt span{font-size:.8rem;color:var(--ink2)}
.station .st{flex:0 0 auto;font-size:1rem;letter-spacing:1px;color:var(--yellow-d)}
.trail{height:16px;margin:-14px 0 -2px 31px;border-left:4px dotted var(--line);opacity:.35}

.starrow{font-size:2.2rem;letter-spacing:6px;color:var(--yellow-d);text-align:center;line-height:1.2}
.misslist{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.misschip{border:2px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--cream2);font-size:.9rem;font-weight:700}

table.stats{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
table.stats th,table.stats td{border:2px solid var(--line);padding:5px 7px;text-align:center}
table.stats th{background:var(--cream2)}

.switchrow{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--paper);margin-top:10px}
.switchrow .lbl{flex:1;font-size:.95rem;font-weight:600}
.switch{min-width:76px;min-height:44px;border:3px solid var(--line);border-radius:999px;background:var(--cream2);font-weight:700;font-size:.9rem}
.switch.on{background:var(--green)}

.cert{border:5px double var(--line);border-radius:18px;padding:18px 14px;background:var(--paper);text-align:center}
.cert .ttl{font-size:1.5rem;font-weight:800;letter-spacing:.04em}
.cert .who{font-size:1.7rem;font-weight:800;margin:10px 0;border-bottom:3px dotted var(--line);display:inline-block;padding:0 14px 4px;min-width:170px}
.cert input{font-family:inherit;font-size:1.25rem;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:14px;padding:8px 10px;width:100%;max-width:280px;background:var(--cream2);min-height:52px}
.certchars{display:flex;justify-content:center;gap:4px;margin:8px 0}
.certchars svg{width:82px;height:auto}

.sparkles{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.spark{position:absolute;font-size:1.5rem;animation:fly .9s ease-out forwards}
@keyframes fly{ from{opacity:1;transform:translate(0,0) scale(.6)} to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)} }
.pop{animation:pop .35s ease-out}
@keyframes pop{ 0%{transform:scale(.82)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }
.glow{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{ from{opacity:.55} to{opacity:1} }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
footer.sitefoot{text-align:center;font-size:.78rem;color:var(--ink2);padding:18px 6px 6px}
footer.sitefoot a{color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brandmini">네다바웨이 · 바이올린 개방현 놀이</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="muteBtn" aria-pressed="false" aria-label="소리 끄기">🔊</button>
    <button class="iconbtn" id="gearBtn" aria-label="학부모·교사 화면 (3초 길게 누르기)">⚙️</button>
  </div>
  <main id="app" aria-live="polite"></main>
  <footer class="sitefoot">
    <a href="/">네다바웨이 NEDABAHWAY</a> · 개방현 솔·레·라·미와 조표를 함께 배우는 놀이
  </footer>
</div>
<div class="sparkles" id="sparkLayer" aria-hidden="true"></div>
<script>
"use strict";
/* ============================================================
   1. 음악 데이터 (교사가 값만 바꿔도 확장 가능한 상수 영역)
   ------------------------------------------------------------
   step = 높은음자리표 기준 '아래 첫째 줄(E4)'에서 센 온음계 칸수
          E4=0, F4=1, G4=2, A4=3, B4=4, C5=5, D5=6, E5=7, F5=8, G5=9
          D4=-1, C4=-2, B3=-3, A3=-4, G3=-5
   ============================================================ */
var NOTES = {
  G3: { id:'G3', ko:'솔', en:'G', freq:196.00, step:-5,
        where:'솔은 덧줄 두 개 아래 칸에 살아요.' },
  D4: { id:'D4', ko:'레', en:'D', freq:293.66, step:-1,
        where:'레는 첫째 줄 바로 아래 칸에 살아요.' },
  A4: { id:'A4', ko:'라', en:'A', freq:440.00, step:3,
        where:'라는 둘째 칸에 살아요.' },
  E5: { id:'E5', ko:'미', en:'E', freq:659.25, step:7,
        where:'미는 넷째 칸에 살아요.' }
};
/* 계이름 버튼 고정 순서 (항상 솔·레·라·미) */
var NAME_ORDER = ['G3','D4','A4','E5'];
/* 바이올린 실제 현 배치 순서 (왼쪽부터 G-D-A-E) */
var STRING_ORDER = ['G3','D4','A4','E5'];

/* 조표 — 샵이 붙는 자리(step)와 순서 */
var SHARP_STEP = { F5:8, C5:5, G5:9 };
var KEYS = {
  A: { id:'A', ko:'가장조', en:'A Major', sharps:['F5','C5','G5'] },
  D: { id:'D', ko:'라장조', en:'D Major', sharps:['F5','C5'] },
  G: { id:'G', ko:'사장조', en:'G Major', sharps:['F5'] },
  C: { id:'C', ko:'다장조', en:'C Major', sharps:[] }
};
var SHARP_LABEL = { F5:'파', C5:'도', G5:'솔' };
var KEY_NOTE_MSG = '개방현 솔·레·라·미는 어느 조표에서도 샵이 붙지 않아요. 그래서 개방현은 늘 같은 소리예요.';

/* 8단계 커리큘럼 (순서 고정) */
var STAGES = [
  { n:1, title:'라줄 배우기',        notes:['A4'],                 key:null, learn:true,  count:6,  pass:5 },
  { n:2, title:'미줄 배우기',        notes:['E5'],                 key:null, learn:true,  count:6,  pass:5 },
  { n:3, title:'라줄 + 미줄 섞기',   notes:['A4','E5'],            key:'A',  learn:false, count:10, pass:8 },
  { n:4, title:'레줄 배우기',        notes:['D4'],                 key:null, learn:true,  count:6,  pass:5 },
  { n:5, title:'레줄 + 라줄 섞기',   notes:['D4','A4'],            key:'D',  learn:false, count:10, pass:8 },
  { n:6, title:'솔줄 배우기',        notes:['G3'],                 key:null, learn:true,  count:6,  pass:5 },
  { n:7, title:'솔줄 + 레줄 섞기',   notes:['G3','D4'],            key:'G',  learn:false, count:10, pass:8 },
  { n:8, title:'모두 섞기 (마무리)', notes:['G3','D4','A4','E5'],  key:'C',  learn:false, count:12, pass:10 }
];

/* 유형 B에서 음표를 놓을 수 있는 자리 범위 (솔3 아래 칸 ~ 솔5) */
var PLACE_MIN = -6, PLACE_MAX = 9;

/* ============================================================
   2. 오선지 SVG (모두 직접 그림 — 외부 폰트·이미지 없음)
   ============================================================ */
var S = 20;            /* viewBox 내부 줄 간격 */
var VB_W = 404, VB_H = 192;
var BASE_Y = 112;      /* 아래 첫째 줄(E4)의 y */
function lineY(k){ return BASE_Y - (k-1)*S; }            /* k=1..5 */
function stepY(step){ return BASE_Y - step*(S/2); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* 높은음자리표 — 나선 랜드마크를 Catmull-Rom으로 이어 직접 그림
   좌표 단위는 줄 간격 S, 원점은 둘째 줄(G4) 위 나선 중심.
   교사가 아래 좌표만 조정해도 모양을 바꿀 수 있다. */
var CLEF_PTS = [
  [-0.06, -0.02],   /* 나선 안쪽 끝 — 솔(G4) 줄 위, 기둥에 닿는다 */
  [ 0.22, -0.32],
  [ 0.58, -0.22],
  [ 0.86,  0.28],
  [ 0.72,  0.90],
  [ 0.24,  1.32],
  [-0.36,  1.36],   /* 아래 큰 고리의 바닥 */
  [-0.88,  1.02],
  [-1.14,  0.42],
  [-1.16, -0.25],   /* 아래 큰 고리의 왼쪽 끝 */
  [-1.00, -0.86],
  [-0.70, -1.36],
  [-0.52, -1.96],
  [-0.44, -2.72],
  [-0.30, -3.26],
  [-0.02, -3.62],   /* 맨 위 */
  [ 0.26, -3.38],
  [ 0.32, -2.86],
  [ 0.30, -1.90],
  [ 0.24, -1.20],
  [ 0.15, -0.45],
  [ 0.05,  0.65],
  [-0.01,  1.70],
  [-0.07,  2.50],
  [-0.24,  2.95],
  [-0.62,  2.92],
  [-0.74,  2.52],
  [-0.48,  2.38]    /* 아래 갈고리 끝 */
];
/* Catmull-Rom 스플라인을 3차 베지에로 변환 */
function smoothPath(pts, map){
  var d, i, p0, p1, p2, p3, c1, c2;
  function mp(p){ var q = map(p[0], p[1]); return q[0].toFixed(2) + ' ' + q[1].toFixed(2); }
  d = 'M' + mp(pts[0]);
  for (i=0;i<pts.length-1;i++){
    p0 = pts[i-1] || pts[0];
    p1 = pts[i];
    p2 = pts[i+1];
    p3 = pts[i+2] || pts[pts.length-1];
    c1 = [ p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6 ];
    c2 = [ p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6 ];
    d += ' C' + mp(c1) + ', ' + mp(c2) + ', ' + mp(p2);
  }
  return d;
}
function clefPath(cx, S_){
  var gy = lineY(2);
  return smoothPath(CLEF_PTS, function(x,y){ return [cx + x*S_, gy + y*S_]; });
}
function clefSVG(cx){
  return '<path d="'+clefPath(cx,S)+'" fill="none" stroke="var(--ink)" stroke-width="'+(S*0.165).toFixed(2)+
         '" stroke-linecap="round" stroke-linejoin="round"/>';
}

/* 샵(#) — 세로 2줄 + 비스듬한 가로 2줄 */
function sharpSVG(cx, step, opts){
  opts = opts || {};
  var y = stepY(step), c = opts.color || 'var(--ink)', w = S*0.13;
  var g = '';
  g += '<line x1="'+(cx-S*0.20)+'" y1="'+(y-S*0.66)+'" x2="'+(cx-S*0.20)+'" y2="'+(y+S*0.74)+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/>';
  g += '<line x1="'+(cx+S*0.20)+'" y1="'+(y-S*0.80)+'" x2="'+(cx+S*0.20)+'" y2="'+(y+S*0.60)+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/>';
  g += '<line x1="'+(cx-S*0.44)+'" y1="'+(y-S*0.06)+'" x2="'+(cx+S*0.44)+'" y2="'+(y-S*0.26)+'" stroke="'+c+'" stroke-width="'+(S*0.19)+'" stroke-linecap="round"/>';
  g += '<line x1="'+(cx-S*0.44)+'" y1="'+(y+S*0.40)+'" x2="'+(cx+S*0.44)+'" y2="'+(y+S*0.20)+'" stroke="'+c+'" stroke-width="'+(S*0.19)+'" stroke-linecap="round"/>';
  return g;
}

/* 덧줄 — C4(-2) 이하, A5(10) 이상에서 짝수 step마다 */
function ledgerSVG(cx, step){
  var out = '', k, w = S*0.92;
  if (step <= -2) { for (k=-2; k>=step; k-=2) out += ledgerLine(cx,k,w); }
  if (step >= 10) { for (k=10; k<=step; k+=2) out += ledgerLine(cx,k,w); }
  return out;
}
function ledgerLine(cx,k,w){
  var y = stepY(k);
  return '<line x1="'+(cx-w)+'" y1="'+y+'" x2="'+(cx+w)+'" y2="'+y+'" stroke="var(--ink)" stroke-width="'+(S*0.115)+'" stroke-linecap="round"/>';
}

/* 4분음표 — 셋째 줄(B4, step 4) 이상이면 기둥 아래, 미만이면 위 */
function stemUp(step){ return step < 4; }
function noteSVG(cx, step, opts){
  opts = opts || {};
  var y = stepY(step), color = opts.color || 'var(--ink)', op = (opts.opacity==null?1:opts.opacity);
  var rx = S*0.63, ry = S*0.45, up = stemUp(step), len = S*3.1;
  var sx = up ? cx + rx*0.92 : cx - rx*0.92;
  var sy1 = y + (up ? -S*0.12 : S*0.12);
  var sy2 = up ? y - len : y + len;
  var g = '<g opacity="'+op+'">';
  g += ledgerSVG(cx, step).replace(/var\(--ink\)/g, color);
  g += '<ellipse cx="'+cx+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="'+color+'" transform="rotate(-22 '+cx+' '+y+')"/>';
  g += '<line x1="'+sx+'" y1="'+sy1+'" x2="'+sx+'" y2="'+sy2+'" stroke="'+color+'" stroke-width="'+(S*0.13)+'" stroke-linecap="round"/>';
  g += '</g>';
  return g;
}

/* 오선지 전체
   opts: { sharps:[keyIds], notes:[{step,color,opacity}], pick:boolean, wide:boolean } */
function staffSVG(opts){
  opts = opts || {};
  var sharps = opts.sharps || [];
  var pad = 14, clefX = pad + S*1.48;
  var keyX = pad + S*3.35, gap = S*0.98;
  var keyEnd = keyX + (sharps.length ? (sharps.length-1)*gap + S*0.6 : -S*0.6);
  var right = VB_W - 18;
  var noteX = opts.noteX || Math.round((keyEnd + right)/2);
  var g = '';
  var i;
  for (i=1;i<=5;i++){
    g += '<line x1="'+pad+'" y1="'+lineY(i)+'" x2="'+right+'" y2="'+lineY(i)+'" stroke="var(--ink)" stroke-width="'+(S*0.085)+'" stroke-linecap="round"/>';
  }
  g += clefSVG(clefX);
  for (i=0;i<sharps.length;i++){
    g += '<g class="ksharp">'+sharpSVG(keyX + i*gap, SHARP_STEP[sharps[i]])+'</g>';
  }
  var notes = opts.notes || [];
  for (i=0;i<notes.length;i++){
    g += noteSVG(notes[i].x || noteX, notes[i].step, notes[i]);
  }
  var extra = opts.extra || '';
  return '<svg class="stafffig" viewBox="0 0 '+VB_W+' '+VB_H+'" role="img" aria-label="'+esc(opts.label||'오선지')+
         '" xmlns="http://www.w3.org/2000/svg">'+g+extra+'</svg>';
}
function noteXFor(sharps){
  var pad = 14, keyX = pad + S*3.0, gap = S*0.98;
  var n = sharps ? sharps.length : 0;
  var keyEnd = keyX + (n ? (n-1)*gap + S*0.6 : -S*0.6);
  return Math.round((keyEnd + (VB_W-18))/2);
}

/* 조표 카드용 작은 오선지 (샵을 하나씩 눌러 볼 수 있음) */
function keyStaffSVG(keyId, tapped){
  var k = KEYS[keyId], i, g = '', pad = 14, right = 196;
  for (i=1;i<=5;i++){
    g += '<line x1="'+pad+'" y1="'+lineY(i)+'" x2="'+right+'" y2="'+lineY(i)+'" stroke="var(--ink)" stroke-width="'+(S*0.085)+'" stroke-linecap="round"/>';
  }
  g += clefSVG(pad + S*1.48);
  var keyX = pad + S*3.8, gap = S*1.5;
  for (i=0;i<k.sharps.length;i++){
    var sid = k.sharps[i], on = tapped && tapped.indexOf(sid)>=0;
    var cx = keyX + i*gap;
    g += '<g class="tapsharp" data-sharp="'+sid+'" style="cursor:pointer">';
    g += '<rect x="'+(cx-S*0.95)+'" y="'+(stepY(SHARP_STEP[sid])-S*1.3)+'" width="'+(S*1.9)+'" height="'+(S*2.6)+'" rx="6" fill="'+(on?'var(--yellow)':'transparent')+'" stroke="'+(on?'var(--ink)':'none')+'" stroke-width="2"/>';
    g += sharpSVG(cx, SHARP_STEP[sid]);
    g += '</g>';
  }
  if (!k.sharps.length){
    g += '<text x="140" y="'+(lineY(3)+S*0.4)+'" text-anchor="middle" font-size="'+(S*0.85)+'" font-weight="700" fill="var(--ink2)" font-family="var(--ff)">샵 없음</text>';
  }
  return '<svg viewBox="6 10 202 148" role="img" aria-label="'+esc(k.ko+' 조표, 샵 '+k.sharps.length+'개')+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
}

   3. 바이올린 그림 (현 4개 G-D-A-E, 해당 현이 빛남)

function violinSVG(hi){
  /* 현은 너트(위)에서 브리지(아래)로, 지판 안에서 왼쪽부터 G-D-A-E */
  var NUT_Y = 46, BR_Y = 173;

  var BR_X  = [52.5, 57.5, 62.5, 67.5];
  function xAt(i, y){
    var t = (y - NUT_Y) / (BR_Y - NUT_Y);
    return NUT_X[i] + (BR_X[i] - NUT_X[i]) * t;
  }
  var strings = '', labels = '', i;
  for (i=0;i<4;i++){

    esc(hi ? NOTES[hi].ko+'줄이 빛나는 바이올린 그림' : '바이올린 그림')+'" xmlns="http://www.w3.org/2000/svg">'+

    /* f홀 */

    '<path d="M54 20 l13 0 -1 22 -11 0 z" fill="#E9D3AE"/>'+

    /* 지판 */

/* ============================================================
   5. 소리 — Web Audio API 합성 (외부 오디오 파일 없음)
      "시작" 버튼을 누른 뒤에만 AudioContext를 만든다.
   ============================================================ */
var AC = null, MASTER = null;
function audioReady(){
  if (AC) return true;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return false;
  try {
    AC = new Ctx();
    MASTER = AC.createGain();
    MASTER.gain.value = 0.9;
    MASTER.connect(AC.destination);
  } catch(e){ AC = null; return false; }
  return true;
}
function resumeAudio(){ if (AC && AC.state === 'suspended') { try{ AC.resume(); }catch(e){} } }

/* 사인파 + 2·3배음, 약 1.2초 감쇠 — 부드러운 현 느낌 */
function tone(freq, dur, peak, when){
  if (state.muted || !AC) return;
  resumeAudio();
  dur  = dur  || 1.2;
  peak = peak || 0.20;
  var t = AC.currentTime + (when || 0);
  var env = AC.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(peak, t + 0.025);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  env.connect(MASTER);
  var parts = [[1,1],[2,0.30],[3,0.12]];
  for (var i=0;i<parts.length;i++){
    var o = AC.createOscillator(), og = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq * parts[i][0], t);
    og.gain.value = parts[i][1];
    o.connect(og); og.connect(env);
    o.start(t); o.stop(t + dur + 0.05);
  }
}
function playNote(id){ if (NOTES[id]) tone(NOTES[id].freq, 1.2, 0.20); }
function playFanfare(){ /* 상행 3음, 0.6초 */
  tone(523.25,0.28,0.16,0); tone(659.25,0.28,0.16,0.16); tone(783.99,0.42,0.18,0.32);
}
function playSoft(){ tone(164.81, 0.30, 0.16); }  /* 오답 — 부드러운 낮은 "통~" */

var STORE_KEY = 'nedabah.violin.v1';
var state = {
  screen : 'start',
  muted  : false,
  typeC  : true,           /* 유형 C(듣고 맞히기) 사용 여부 */
  stage  : 1,              /* 지금 보고 있는 단계 */
  unlocked : 1,
  stars  : {},             /* {단계: 0|1|2|3} */
  miss   : {},             /* {noteId: 횟수} */
  tries  : {},             /* {단계: {ok:n, total:n}} */
  name   : '',
  learnIdx : 0,
  quiz   : null,
  keyIntro : null
};
function save(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      muted:state.muted, typeC:state.typeC, unlocked:state.unlocked,
      stars:state.stars, miss:state.miss, tries:state.tries, name:state.name
    }));
  } catch(e){ /* 저장 실패해도 게임은 정상 동작 */ }
}
function load(){
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (!d || typeof d !== 'object') return;
    if (typeof d.muted === 'boolean') state.muted = d.muted;
    if (typeof d.typeC === 'boolean') state.typeC = d.typeC;
    if (typeof d.unlocked === 'number') state.unlocked = Math.min(8, Math.max(1, d.unlocked));
    if (d.stars && typeof d.stars === 'object') state.stars = d.stars;
    if (d.miss  && typeof d.miss  === 'object') state.miss  = d.miss;
    if (d.tries && typeof d.tries === 'object') state.tries = d.tries;
    if (typeof d.name === 'string') state.name = d.name.slice(0,16);
  } catch(e){ /* 무시 */ }
}
function resetAll(){
  state.unlocked = 1; state.stars = {}; state.miss = {}; state.tries = {}; state.name = '';
  save();
}

/* ============================================================
   7. 문항 생성 · 채점  (UI와 분리된 순수 로직)
   ============================================================ */
function shuffle(arr, rnd){
  rnd = rnd || Math.random;
  var a = arr.slice(), i, j, t;
  for (i=a.length-1;i>0;i--){ j = Math.floor(rnd()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* 출제 범위 안의 음을 고르게 섞은 목록 */
function spreadNotes(notes, count){
  var out = [], i, pool = [];
  while (out.length < count){
    if (!pool.length) pool = shuffle(notes);
    out.push(pool.pop());
  }
  /* 같은 음이 3번 연속되지 않도록 한 번 다듬기 */
  for (i=2;i<out.length;i++){
    if (out[i]===out[i-1] && out[i]===out[i-2]){
      var alt = notes.filter(function(n){ return n!==out[i]; });
      if (alt.length) out[i] = alt[Math.floor(Math.random()*alt.length)];
    }
  }
  return out;
}
/* 유형 순환: 단일 현 단계는 A·B 3문항씩, 교차 단계는 A·B(·C) 번갈아 */
function typeCycle(stage, count, useC){
  var out = [], i;
  if (stage.learn){
    for (i=0;i<count;i++) out.push(i%2===0 ? 'A' : 'B');
  } else {
    var cyc = useC ? ['A','B','C'] : ['A','B'];
    for (i=0;i<count;i++) out.push(cyc[i%cyc.length]);
  }
  return out;
}
function buildQuiz(stageNo, useC){
  var st = STAGES[stageNo-1];
  var notes = spreadNotes(st.notes, st.count);
  var types = typeCycle(st, st.count, useC && st.notes.length > 1);
  var items = [], i;
  for (i=0;i<st.count;i++) items.push({ note:notes[i], type:types[i] });
  return {
    stage : stageNo,
    items : items,
    idx   : 0,
    attempt : 0,          /* 0 = 첫 시도, 1 = 재도전 */
    hintUsed : false,
    revealed : false,
    points : 0,           /* 별 계산용 점수 (힌트/재도전 0.5) */
    score  : 0,           /* 화면에 보이는 점수 */
    ok     : 0,           /* 맞힌 수 = 첫 시도 정답 문항 수 */
    marks  : [],          /* 'done' | 'miss' */
    missed : {},          /* 이번 단계에서 틀린 음 */
    placed : null,        /* 유형 B 임시 위치 */
    phase  : 'ask'        /* ask | answered | reveal */
  };
}
/* 틀린 음은 다음 3문항 안에 다시 나오도록 예정표를 고친다 */
function requeueNote(quiz, noteId){
  var i, from = quiz.idx + 1, to = Math.min(quiz.items.length - 1, quiz.idx + 3);
  for (i=from;i<=to;i++){ if (quiz.items[i].note === noteId) return; }
  if (from <= to) quiz.items[from].note = noteId;
}
function stageStars(quiz){
  var st = STAGES[quiz.stage-1];
  if (quiz.points >= quiz.items.length) return 3;   /* 만점: 모두 힌트 없이 첫 시도 정답 */
  if (quiz.ok >= st.pass) return 2;                 /* 통과 */
  return 1;                                          /* 미통과(☆) */
}
function starText(n){
  if (n>=3) return '★★★';
  if (n===2) return '★★';
  if (n===1) return '☆';
  return '';
}

/* ============================================================
   9. 유형 B — 오선지 터치 + 스냅
   ============================================================ */
function clampStep(s){ return Math.max(PLACE_MIN, Math.min(PLACE_MAX, s)); }
function snapStepFromClientY(svg, clientY){
  var r = svg.getBoundingClientRect();
  if (!r.height) return null;
  var y = (clientY - r.top) / r.height * VB_H;
  return clampStep(Math.round((BASE_Y - y) / (S/2)));
}
function updatePlaceLayer(){
  var layer = document.getElementById('placeLayer');
  if (!layer) return;
  var q = state.quiz, st = STAGES[q.stage-1];
  var nx = noteXFor(st.key ? KEYS[st.key].sharps : []);
  var out = '';
  if (q.hover !== null && q.hover !== undefined && q.hover !== q.placed){
    out += noteSVG(nx, q.hover, { color:'var(--sky-d)', opacity:0.45 });
  }
  if (q.placed !== null && q.placed !== undefined){
    out += noteSVG(nx, q.placed, { color:'var(--coral-d)' });
  }
  layer.innerHTML = out;
}
function bindQuiz(){
  var q = state.quiz;
  var wrap = document.getElementById('pickStaff');
  if (!wrap) return;
  var svg = wrap.querySelector('svg');
  if (!svg) return;
  updatePlaceLayer();
  function move(ev){
    var cy = (ev.touches && ev.touches[0]) ? ev.touches[0].clientY : ev.clientY;
    var s = snapStepFromClientY(svg, cy);
    if (s === null) return;
    if (q.hover !== s){ q.hover = s; updatePlaceLayer(); }
  }
  function drop(ev){
    var cy = (ev.changedTouches && ev.changedTouches[0]) ? ev.changedTouches[0].clientY : ev.clientY;
    var s = snapStepFromClientY(svg, cy);
    if (s === null) return;
    q.placed = s; q.hover = null;
    render();
  }
  wrap.addEventListener('pointermove', move);
  wrap.addEventListener('pointerdown', function(ev){ ev.preventDefault(); move(ev); });
  wrap.addEventListener('pointerup', function(ev){ ev.preventDefault(); drop(ev); });
  wrap.addEventListener('pointerleave', function(){ if (q.hover !== null){ q.hover = null; updatePlaceLayer(); } });
}

/* ============================================================
   10. 퀴즈 진행
   ============================================================ */
function sparkle(){
  if (reduceMotion) return;
  var cx = window.innerWidth/2, cy = window.innerHeight*0.38, i;
  for (i=0;i<10;i++){
    var s = document.createElement('span');
    s.className = 'spark';
    s.textContent = i%2 ? '⭐' : '✨';
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', (Math.random()*260-130).toFixed(0)+'px');
    s.style.setProperty('--dy', (Math.random()*-190-30).toFixed(0)+'px');
    sparkLayer.appendChild(s);
    (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1000); })(s);
  }
}
function currentItem(){ return state.quiz ? state.quiz.items[state.quiz.idx] : null; }

function handleAnswer(correct){
  var q = state.quiz, item = currentItem();
  if (!q || !item || q.phase !== 'ask') return;
  var n = NOTES[item.note];
  if (correct){
    var pts = (q.hintUsed || q.attempt > 0) ? 0.5 : 1;
    q.points += pts;
    q.score  += (q.hintUsed ? 5 : 10);
    if (q.attempt === 0) { q.ok += 1; q.marks[q.idx] = 'done'; }
    else q.marks[q.idx] = 'miss';
    q.phase = 'answered';
    q.lastPraise = praiseFor(n.ko);
    playFanfare();
    sparkle();
    render();
    setTimeout(nextItem, 1000);
  } else {
    playSoft();
    q.missed[item.note] = (q.missed[item.note]||0) + 1;
    state.miss[item.note] = (state.miss[item.note]||0) + 1;
    if (q.attempt === 0){
      q.attempt = 1;
      q.marks[q.idx] = 'miss';
      q.hintUsed = true;            /* 재도전 중에는 힌트가 자동으로 켜짐 */
      q.placed = null; q.hover = null;
      requeueNote(q, item.note);
      render();
      setTimeout(function(){ playNote(item.note); }, 260);
    } else {
      q.phase = 'reveal';
      q.placed = null; q.hover = null;
      requeueNote(q, item.note);
      render();
      setTimeout(function(){ playNote(item.note); }, 260);
    }
    save();
  }
}
function nextItem(){
  var q = state.quiz;
  /* 자동 넘김을 기다리는 동안 친구가 지도로 나갔을 수 있다 */
  if (!q || state.screen !== 'quiz') return;
  q.idx += 1;
  q.attempt = 0; q.hintUsed = false; q.phase = 'ask';
  q.placed = null; q.hover = null; q.lastPraise = null;
  if (q.idx >= q.items.length){ finishStage(); return; }
  render();
  autoPlayCurrent();
}
function autoPlayCurrent(){
  var item = currentItem();
  if (!item) return;
  setTimeout(function(){ if (state.screen === 'quiz') playNote(item.note); }, 220);
}
function finishStage(){
  var q = state.quiz, st = STAGES[q.stage-1];
  var stars = stageStars(q);
  var prev = state.stars[q.stage] || 0;
  state.stars[q.stage] = Math.max(prev, stars);
  var t = state.tries[q.stage] || { ok:0, total:0 };
  t.ok += q.ok; t.total += q.items.length;
  state.tries[q.stage] = t;
  if (stars >= 2 && state.unlocked < Math.min(8, q.stage+1)) state.unlocked = Math.min(8, q.stage+1);
  if (stars >= 2 && q.stage === 8) state.unlocked = 8;
  var missNotes = Object.keys(q.missed);
  state.result = { stage:q.stage, stars:stars, ok:q.ok, total:q.items.length, score:q.score, missNotes:missNotes };
  state.screen = 'result';
  state.quiz = null;
  save();
  render();
}
function startStage(no){
  state.stage = no;
  var st = STAGES[no-1];
  if (st.learn){ state.learnIdx = 0; state.screen = 'learn'; render(); setTimeout(function(){ playNote(st.notes[0]); }, 260); }
  else { state.keyIntro = []; state.screen = 'keyintro'; render(); }
}
function startQuiz(){
  state.quiz = buildQuiz(state.stage, state.typeC);
  state.screen = 'quiz';
  render();
  autoPlayCurrent();
}

/* ============================================================
   11. 이벤트
   ============================================================ */
app.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');

  if (act === 'start'){ audioReady(); resumeAudio(); state.screen = 'map'; render(); return; }
  if (act === 'tomap'){ state.screen = 'map'; state.quiz = null; render(); return; }
  if (act === 'stage'){ startStage(parseInt(t.getAttribute('data-stage'),10)); return; }
  if (act === 'cert'){ state.screen = 'cert'; render(); return; }
  if (act === 'replay'){ playNote(t.getAttribute('data-note')); return; }
  if (act === 'learnNext'){
    if (state.learnIdx < 2){
      state.learnIdx += 1; render();
      setTimeout(function(){ playNote(STAGES[state.stage-1].notes[0]); }, 240);
    } else startQuiz();
    return;
  }
  if (act === 'quizStart'){ startQuiz(); return; }
  if (act === 'hint'){
    var q = state.quiz; if (!q || q.phase !== 'ask') return;
    q.hintUsed = true; render(); playNote(currentItem().note); return;
  }
  if (act === 'pick'){
    var qq = state.quiz; if (!qq || qq.phase !== 'ask') return;
    handleAnswer(t.getAttribute('data-note') === currentItem().note);
    return;
  }
  if (act === 'nudge'){
    var q3 = state.quiz; if (!q3 || q3.phase !== 'ask') return;
    var base = (q3.placed === null || q3.placed === undefined) ? 3 : q3.placed;
    q3.placed = clampStep(base + parseInt(t.getAttribute('data-dir'),10));
    q3.hover = null; render(); return;
  }
  if (act === 'confirmPlace'){
    var q4 = state.quiz; if (!q4 || q4.phase !== 'ask') return;
    if (q4.placed === null || q4.placed === undefined) return;
    handleAnswer(q4.placed === NOTES[currentItem().note].step);
    return;
  }
  if (act === 'followUp'){
    var q5 = state.quiz;
    if (!q5 || q5.phase !== 'reveal') return;
    q5.phase = 'answered-reveal';
    playNote(t.getAttribute('data-note'));
    setTimeout(nextItem, 650);
    return;
  }
  if (act === 'saveName'){
    var el = document.getElementById('nameIn');
    state.name = el ? el.value.trim().slice(0,12) : '';
    save(); render(); return;
  }
  if (act === 'toggleC'){ state.typeC = !state.typeC; save(); render(); return; }
  if (act === 'reset'){
    if (window.confirm('진행 상태와 별을 모두 지울까요? 되돌릴 수 없어요.')){
      resetAll(); state.screen = 'map'; render();
    }
    return;
  }
});
/* 조표 미니 활동 — 샵 하나씩 눌러 보기 */
app.addEventListener('click', function(ev){
  var g = ev.target.closest ? ev.target.closest('.tapsharp') : null;
  if (!g || state.screen !== 'keyintro') return;
  var sid = g.getAttribute('data-sharp');
  state.keyIntro = state.keyIntro || [];
  if (state.keyIntro.indexOf(sid) < 0) state.keyIntro.push(sid);
  render();
  tone(880, 0.25, 0.12);
});

/* 음소거 토글 */
var muteBtn = document.getElementById('muteBtn');
function paintMute(){
  muteBtn.textContent = state.muted ? '🔇' : '🔊';
  muteBtn.setAttribute('aria-pressed', state.muted ? 'true' : 'false');
  muteBtn.setAttribute('aria-label', state.muted ? '소리 켜기' : '소리 끄기');
}
muteBtn.addEventListener('click', function(){
  state.muted = !state.muted; paintMute(); save();
  if (!state.muted && AC) { resumeAudio(); tone(440, 0.4, 0.14); }
});

/* ⚙️ 3초 길게 누르기로 학부모·교사 화면 */
var gearBtn = document.getElementById('gearBtn'), gearTimer = null;
function gearStart(ev){
  ev.preventDefault();
  clearTimeout(gearTimer);
  gearTimer = setTimeout(function(){
    state.screen = 'parent'; render();
  }, 3000);
}
function gearEnd(){ clearTimeout(gearTimer); }
gearBtn.addEventListener('pointerdown', gearStart);
gearBtn.addEventListener('pointerup', gearEnd);
gearBtn.addEventListener('pointerleave', gearEnd);
gearBtn.addEventListener('pointercancel', gearEnd);
gearBtn.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ============================================================
   12. 시작
   ============================================================ */
load();
paintMute();
render();
</script>
