  .act-head{margin-bottom:36px;}
  .act-eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;color:#a4541a;text-transform:uppercase;margin-bottom:8px;}
  .act-title{font-family:'Noto Serif KR',serif;font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;color:#1A1A1A;margin:0 0 10px;}
  .act-desc{font-size:15px;color:#475569;line-height:1.75;max-width:560px;margin:0;}
  .act-filter{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .act-chip{font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;border:1px solid #E2E8F0;color:#475569;background:#fff;cursor:pointer;transition:all .15s;}
  .act-chip:hover{border-color:#a4541a;color:#a4541a;}
  .act-chip.is-on{background:#a4541a;border-color:#a4541a;color:#fff;}

  .act-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
  @media(max-width:760px){.act-grid{grid-template-columns:1fr;gap:18px;}}

  .act-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;}
  .act-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.08);}
  .act-card a{color:inherit;text-decoration:none;display:flex;flex-direction:column;height:100%;}
  .act-photo{aspect-ratio:16/10;background:#f1ecdf;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .act-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .act-photo-empty{font-size:13px;color:#a89a82;letter-spacing:.5px;}
  .act-meta{padding:18px 20px 22px;}
  .act-card-title{font-size:16px;font-weight:700;letter-spacing:-.01em;color:#1A1A1A;margin:0 0 8px;line-height:1.45;display:flex;align-items:flex-start;gap:8px;}
  .act-card-title::before{content:'📝';font-size:14px;flex-shrink:0;}
  .act-card-date{font-size:12.5px;color:#7a6f5f;font-variant-numeric:tabular-nums;}
  .act-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .act-card-tag{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:4px;background:#fdf4ec;color:#a4541a;}

  .act-empty{padding:80px 20px;text-align:center;color:#7a6f5f;}
  .act-empty h3{font-family:'Noto Serif KR',serif;font-size:20px;color:#1A1A1A;margin:0 0 10px;}
  .act-empty p{font-size:14px;line-height:1.7;margin:0 0 20px;}
  .act-empty a{color:#a4541a;font-weight:700;text-decoration:none;border-bottom:1px dotted #a4541a;}

  .act-loading{padding:60px 20px;text-align:center;color:#a89a82;font-size:14px;}
  .act-error{padding:24px;border:1px solid #fde2d4;background:#fff8f2;border-radius:10px;color:#a4541a;font-size:13px;line-height:1.65;}
  .act-error code{background:#fef0e2;padding:2px 6px;border-radius:4px;font-size:12px;}

  .act-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
  @media(max-width:520px){.act-stats{grid-template-columns:repeat(3,1fr);gap:8px;}}
  .act-stat{background:#fdf8ee;border:1px solid #f0e6d0;border-radius:10px;padding:14px 16px;}
  .act-stat-num{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:800;color:#a4541a;line-height:1;}
  .act-stat-label{font-size:11px;color:#7a6f5f;margin-top:4px;letter-spacing:.3px;}
</style>

<main class="act-wrap">
  <header class="act-head">
    <div class="act-eyebrow">Activities</div>
    <h1 class="act-title">활동 기록</h1>
    <p class="act-desc">실제로 진행한 강의·코칭·세미나의 현장 기록입니다. 자동으로 누적되며, 가장 최근 활동이 위에 표시됩니다.</p>
  </header>

  <section class="act-stats" id="actStats" hidden>
    <div class="act-stat"><div class="act-stat-num" id="statTotal">0</div><div class="act-stat-label">전체 활동</div></div>
    <div class="act-stat"><div class="act-stat-num" id="statThisYear">0</div><div class="act-stat-label">올해</div></div>
    <div class="act-stat"><div class="act-stat-num" id="statThisMonth">0</div><div class="act-stat-label">이번 달</div></div>
  </section>

  <div class="act-filter" id="actFilter" hidden></div>

<footer class="foot foot--mini">
  <style>
    .foot--mini{padding:18px 20px;border-top:1px solid #d8cdb8;background:#efe7d6;font-size:12px;color:#6b6155;line-height:1.6}
    .foot--mini .foot--mini__inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:center}

    .foot--mini a{color:#3a322a;text-decoration:none;border-bottom:1px dotted #a4541a}

<script src="/assets/js/supabase-config.js" onerror="console.warn('supabase-config.js missing — copy from supabase-config.example.js')"></script>
<script type="module">
import { listSessions, sb } from '/assets/js/supabase-client.js';

const body = document.getElementById('actBody');
const statsEl = document.getElementById('actStats');
const filterEl = document.getElementById('actFilter');

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}/${m}/${dd}`;
}

function tagsHtml(tags){
  if(!tags || !tags.length) return '';
  return `<div class="act-card-tags">${tags.map(t=>`<span class="act-card-tag">${escapeHtml(t)}</span>`).join('')}</div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cardHtml(s){
  const photo = s.photo_url
    ? `<img src="${escapeHtml(s.photo_url)}" alt="${escapeHtml(s.title)}" loading="lazy">`
    : `<div class="act-photo-empty">사진 없음</div>`;
  return `
    <article class="act-card">
      <a href="#" data-id="${s.id}" aria-label="${escapeHtml(s.title)}">
        <div class="act-photo">${photo}</div>
        <div class="act-meta">
          <h3 class="act-card-title">${escapeHtml(s.title)}</h3>
          <div class="act-card-date">${fmtDate(s.started_at)}${s.location ? ' · ' + escapeHtml(s.location) : ''}</div>
          ${tagsHtml(s.tags)}
        </div>
      </a>
    </article>`;
}

function computeStats(sessions){
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  let thisYear=0, thisMonth=0;
  for(const s of sessions){
    if(!s.started_at) continue;
    const d = new Date(s.started_at);
    if(d.getFullYear()===y){ thisYear++; if(d.getMonth()===m) thisMonth++; }
  }
  return { total: sessions.length, thisYear, thisMonth };
}

function collectTags(sessions){
  const counts = new Map();
  for(const s of sessions){
    for(const t of (s.tags||[])){
      counts.set(t, (counts.get(t)||0)+1);
    }
  }
  return [...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
}

let allSessions = [];
let activeTag = null;

function render(){
  const filtered = activeTag
    ? allSessions.filter(s => (s.tags||[]).includes(activeTag))
    : allSessions;
  if(!filtered.length){
    body.innerHTML = `
      <div class="act-empty">
        <h3>아직 기록된 활동이 없습니다</h3>
        <p>강의·코칭을 시작하면 이 자리에 카드가 누적됩니다.<br>
           <a href="/studio.html">기록 도구 열기 →</a></p>
      </div>`;
    return;
  }
  body.innerHTML = `<div class="act-grid">${filtered.map(cardHtml).join('')}</div>`;
}

function renderFilters(){
  const tags = collectTags(allSessions);
  if(!tags.length){ filterEl.hidden = true; return; }
  filterEl.hidden = false;
  filterEl.innerHTML = [
    `<button class="act-chip ${activeTag===null?'is-on':''}" data-tag="">전체 (${allSessions.length})</button>`,
    ...tags.map(([t,c])=>`<button class="act-chip ${activeTag===t?'is-on':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)} (${c})</button>`)
  ].join('');
  filterEl.querySelectorAll('.act-chip').forEach(btn=>{
    btn.addEventListener('click', () => {
      const t = btn.dataset.tag;
      activeTag = t || null;
      renderFilters();
      render();
    });
  });
}

async function load(){
  try {
    allSessions = await listSessions({ limit: 200 });
    const stats = computeStats(allSessions);
    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statThisYear').textContent = stats.thisYear;
    document.getElementById('statThisMonth').textContent = stats.thisMonth;
    statsEl.hidden = false;
    renderFilters();
    render();
  } catch (err) {
    console.error(err);
    body.innerHTML = `
      <div class="act-error">
        <strong>활동 데이터를 불러올 수 없습니다.</strong><br>
        Supabase 설정을 확인하세요. <code>assets/js/supabase-config.js</code> 파일이 존재하는지,
        <code>SUPABASE_URL</code>과 <code>anon</code> 키가 올바른지 점검합니다.<br>
        세부 오류: <code>${escapeHtml(err.message||String(err))}</code>
      </div>`;
  }
}

load();

// Realtime: 새 세션이 추가되면 자동 갱신
sb.channel('sessions-changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'sessions' }, () => load())
  .subscribe();
</script>

</body>
