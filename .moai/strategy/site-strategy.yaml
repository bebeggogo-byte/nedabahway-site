# 공통 전환 설계
conversion_funnel:
  awareness: 관점 노트 (WFO 12편 + 일반)
  interest: 라인업 페이지 (/p/index.html)
  consideration: 개별 랜딩페이지 (/p/{slug}.html)
  decision: 무료 30분 상담 신청
  action: 결제 + 첫 회기 일정 확정
  retention: 수료 후 동문 커뮤니티 + 사후 상담

# 카피 보이스 (Claude.ai 검수 기준)
voice_rules:
  tone: 차분하고 단단한 산문 — WFO 톤 유지
  forbidden:
    - "여러분"
    - "다음과 같이"
    - "물론입니다"
    - 글머리표 남발
    - 해야 합니다 어조 (강압)
    - 막연한 미사여구 (혁신적, 압도적, 최고)
  required:
    - 구체 숫자 (제주 99%, 12명, 400만, 12주)
    - 고유명사 (STARCP, 5S, IDEN, WFO)
    - 단수 호칭 ("당신" 또는 3인칭)
    - 한 문장 짧고 단단하게
    - 카피 끝은 명사형 또는 청유형 1택
  cta_pattern:
    primary: 본문 끝 자연스러운 1줄
    footer: 푸터 1개
    forbidden: 본문 중간 CTA 반복

# 랜딩페이지 12섹션 표준 (모든 카테고리 동일)
landing_section_template:
  - hero               # §1 폴드 — 헤드라인 + CTA
  - pain               # §2 통증 3가지
  - diagnosis          # §3 진단 (WFO 본문 발췌)
  - solution           # §4 솔루션 (고유 프레임 핵심 3축)
  - authority          # §5 권위 증명 (실측 자산)
  - proof              # §6 수료생 변화 (1기는 사장님 본인 case)
  - curriculum         # §7 커리큘럼 상세
  - comparison         # §8 차별화 비교표
  - pricing            # §9 가격 + ROI 정당화
  - faq                # §10 자주 묻는 질문
  - scarcity           # §11 1기 정원·일정
  - cta_final          # §12 신청 흐름

