:root{--bg:#F2EBDD;--paper:#FBF8F2;--ink:#22201C;--muted:#6B655B;--line:#DDD3C2;--cob:#1F4FCC;--night:#141311}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;word-break:keep-all}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{position:fixed;inset:0}
#deck{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.back{position:fixed;left:12px;top:12px;z-index:5;background:rgba(20,19,17,.78);color:#fff;font-size:14px;font-weight:700;text-decoration:none;border-radius:99px;padding:7px 14px;opacity:.55;transition:opacity .2s}
.back:hover,.back:focus-visible{opacity:1}
.lock{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:var(--bg);z-index:10}
.card{width:min(100%,460px);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:30px 26px;display:grid;gap:14px}
.card .k{font-size:14px;font-weight:800;color:var(--cob)}
.card h1{margin:0;font-size:28px;line-height:1.3}
.card p{margin:0;font-size:16px;color:var(--muted)}
.card input{font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.card input:focus{outline:none;border-color:var(--cob)}
.go{font:inherit;font-size:18px;font-weight:800;background:var(--cob);color:#fff;border:0;border-radius:10px;padding:13px;cursor:pointer}
.go:disabled{opacity:.6}
.err{color:#B3261E!important;font-weight:700}
.row a{color:var(--cob);font-weight:700;font-size:15px}
.tip{font-size:14px!important}

<script>
(function(){
  var V=JSON.parse(document.getElementById('vault').textContent);
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function open(raw){
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(V.iv)},k,b64(V.ct));
    }).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
  }
  function derive(pw){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
      return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(V.salt),iterations:V.it},k,256);
    });
  }
  function done(D,raw){
    try{sessionStorage.setItem('edu-study-metacog-k',btoa(String.fromCharCode.apply(null,new Uint8Array(raw))))}catch(e){}
    var f=document.getElementById('deck');
    f.src=URL.createObjectURL(new Blob([D.html],{type:'text/html'}));
    f.hidden=false; document.getElementById('back').hidden=false; document.getElementById('lock').hidden=true;
    f.addEventListener('load',function(){try{f.contentWindow.focus()}catch(e){}});
  }
  var saved=null; try{saved=sessionStorage.getItem('edu-study-metacog-k')}catch(e){}
  if(saved){var r=b64(saved); open(r).then(function(D){done(D,r)},function(){try{sessionStorage.removeItem('edu-study-metacog-k')}catch(e){}});}
  document.getElementById('pw').focus();
  document.getElementById('lockForm').addEventListener('submit',function(e){
    e.preventDefault(); var btn=document.getElementById('pwGo'),err=document.getElementById('pwErr');
    btn.disabled=true; btn.textContent='여는 중…'; err.hidden=true;
    derive(document.getElementById('pw').value).then(function(raw){
      return open(raw).then(function(D){done(D,raw)});
    }).catch(function(){err.hidden=false; btn.disabled=false; btn.textContent='열기'; document.getElementById('pw').select();});
  });
})();
</script>
