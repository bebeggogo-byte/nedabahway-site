<script>
(function(){
  var V=JSON.parse(document.getElementById('vault').textContent);
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function open(raw){
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(V.iv)},k,b64(V.ct));
    }).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
  }
  function derive(pw){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
      return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(V.salt),iterations:V.it},k,256);
    });
  }
  function done(D,raw){
    try{sessionStorage.setItem('edu-middle-strengths-k',btoa(String.fromCharCode.apply(null,new Uint8Array(raw))))}catch(e){}
    var f=document.getElementById('deck');
    f.src=URL.createObjectURL(new Blob([D.html],{type:'text/html'}));
    f.hidden=false; document.getElementById('back').hidden=false; document.getElementById('lock').hidden=true;
    f.addEventListener('load',function(){try{f.contentWindow.focus()}catch(e){}});
  }
  var saved=null; try{saved=sessionStorage.getItem('edu-middle-strengths-k')}catch(e){}
  if(saved){var r=b64(saved); open(r).then(function(D){done(D,r)},function(){try{sessionStorage.removeItem('edu-middle-strengths-k')}catch(e){}});}
  document.getElementById('pw').focus();
  document.getElementById('lockForm').addEventListener('submit',function(e){
    e.preventDefault(); var btn=document.getElementById('pwGo'),err=document.getElementById('pwErr');
    btn.disabled=true; btn.textContent='여는 중…'; err.hidden=true;
    derive(document.getElementById('pw').value).then(function(raw){
      return open(raw).then(function(D){done(D,raw)});
    }).catch(function(){err.hidden=false; btn.disabled=false; btn.textContent='열기'; document.getElementById('pw').select();});
  });
})();
</script>
