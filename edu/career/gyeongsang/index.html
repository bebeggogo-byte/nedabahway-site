<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>먼저 취업하고, 대학은 다니면서 | 진로·취업 교육자료 | 네다바웨이</title>
<meta name="description" content="경상공업고등학교 진로 특강. 대졸 신입 나이, 32살 비교, 대구 병역지정업체, 재직자 전형까지 숫자로 보는 선취업 후학습. 앞의 10장은 누구나 볼 수 있습니다.">
<meta property="og:title" content="먼저 취업하고, 대학은 다니면서 | 네다바웨이">
<meta property="og:description" content="돈 · 군대 · 대학 · 이직을 32살 기준으로 비교한 특성화고 진로 특강">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.nedabah.org/edu/career/gyeongsang/">
<meta property="og:image" content="https://www.nedabah.org/edu/career/gyeongsang/img/cover.jpg">
<link rel="canonical" href="https://www.nedabah.org/edu/career/gyeongsang/">
<meta name="theme-color" content="#141311">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

/* 레이아웃: 시안 보고서. 원칙 → 장소·인물·유명한 것·현장 숫자 시안 → 기본 다섯 형식 → 배치 → 이미지 목록 */
:root{
  --bg:#F3EDE2; --surface:#FBF8F2; --fg:#23211D; --muted:#6B655B; --line:#DDD3C2;
  --accent:#1F4FCC; --accent-soft:#E3E9F8; --warn:#C2512A;
  --sans:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --s-beige:#F2EBDD; --s-ink:#22201C; --s-cobalt:#1F4FCC; --s-night:#1A1917; --s-white:#F7F3EA; --s-gray:#8A8378; --s-orange:#C2512A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181715; --surface:#22201D; --fg:#ECE6DA; --muted:#A39B8E; --line:#3A3631; --accent:#7C9BF0; --accent-soft:#25304A; --warn:#E08A63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181715; --surface:#22201D; --fg:#ECE6DA; --muted:#A39B8E; --line:#3A3631; --accent:#7C9BF0; --accent-soft:#25304A; --warn:#E08A63; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.65}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:40px 80px}
h1{font-family:var(--serif);font-size:clamp(28px,4.4vw,44px);line-height:1.25;margin:0 0 12px;text-wrap:balance;font-weight:900}
h2{font-family:var(--serif);font-size:clamp(22px,3vw,30px);margin:0 0 8px;text-wrap:balance}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 12px;max-width:70ch}
.lead{font-size:18px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:6px}
.muted{color:var(--muted)}
section.fmt{border-top:1px solid var(--line);padding-block:40px;display:grid;gap:22px}
.basis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.basis>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.basis b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:22px}
.deck.one{grid-template-columns:1fr}
figure{margin:0;min-width:0}
figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.rules{margin:0;padding-left:20px}
.rules li{margin-bottom:4px}
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;counter-reset:p}
.principles div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.principles b{display:block;font-size:16px;margin-bottom:4px}

/* 슬라이드 공통 */
.slide{aspect-ratio:16/9;max-width:100%;container-type:inline-size;border-radius:6px;overflow:hidden;position:relative;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.35);font-family:var(--sans)}
.beige{background:var(--s-beige);color:var(--s-ink)}
.night{background:var(--s-night);color:var(--s-white)}
.slide .src{position:absolute;left:4cqw;right:4cqw;bottom:2.4cqw;font-size:1.15cqw;color:var(--s-gray)}
.slide .credit{position:absolute;right:1.4cqw;bottom:1.2cqw;font-size:1cqw;color:rgba(255,255,255,.8);text-shadow:0 0 .4cqw rgba(0,0,0,.8)}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* 장소형: 왼쪽 지도, 오른쪽 사진, 아래 이름 띠 */
.place{display:grid;grid-template-columns:50% 50%;grid-template-rows:1fr auto}
.place .map{position:relative;padding:3cqw 2cqw 1cqw 3.5cqw;display:flex;align-items:center}
.place .map img.main{width:100%;height:auto}
.place .map img.mini{position:absolute;left:3cqw;top:2.6cqw;width:15cqw;background:var(--s-white);border-radius:.6cqw;padding:.4cqw;box-shadow:0 .3cqw 1cqw rgba(0,0,0,.12)}
.place .photo{position:relative;overflow:hidden}
.place .band{grid-column:1/-1;background:var(--s-ink);color:var(--s-white);padding:1.8cqw 3.5cqw;display:flex;justify-content:space-between;align-items:center;gap:2cqw}
.place .band .nm{font-size:3cqw;font-weight:900;line-height:1.2}
.place .band .sub{font-size:1.5cqw;color:#CFC6B6;margin-top:.4cqw}
.place .band .tag{font-size:1.6cqw;font-weight:700;background:var(--s-cobalt);color:#fff;border-radius:99cqw;padding:.6cqw 1.6cqw;white-space:nowrap}

/* 인물형 */
.person{display:grid;grid-template-columns:38% 62%}
.person .face{position:relative;overflow:hidden}
.person .txt{padding:4.5cqw 4.5cqw 4cqw;display:flex;flex-direction:column;gap:1.6cqw}
.person .who{font-size:1.7cqw;color:var(--s-cobalt);font-weight:700}
.person .nm{font-size:4.6cqw;font-weight:900;line-height:1.1}
.person .yrs{font-size:1.8cqw;color:var(--s-gray);font-weight:700}
.person .story{font-size:2.3cqw;line-height:1.55;margin-top:1cqw}
.person .story b{color:var(--s-cobalt)}
.person .quote{margin-top:auto;border-left:.5cqw solid var(--s-orange);padding-left:1.6cqw;font-family:var(--serif);font-size:2.1cqw;line-height:1.5}

/* 유명한 것 먼저 */
.famous .cap{position:absolute;left:0;right:0;bottom:0;padding:3cqw 4cqw 2.6cqw;background:linear-gradient(180deg,rgba(20,19,17,0),rgba(20,19,17,.92) 45%);color:var(--s-white)}
.famous .cap .k{font-size:1.6cqw;color:#E9C79B;font-weight:700;letter-spacing:.04em}
.famous .cap .t{font-size:4.4cqw;font-weight:900;line-height:1.2;margin:.4cqw 0 .8cqw}
.famous .cap .d{font-size:1.45cqw;color:#D8CFBF}
.split{display:grid;grid-template-columns:46% 54%}
.split .img{position:relative;overflow:hidden}
.split .txt{padding:4.5cqw;display:flex;flex-direction:column;justify-content:center;gap:2cqw}
.split .txt .k{font-size:1.8cqw;color:var(--s-orange);font-weight:700}
.split .txt .t{font-size:3.6cqw;font-weight:900;line-height:1.3}
.split .txt .d{font-size:2cqw;line-height:1.55;color:#4A443D}
.night .split .txt .d{color:#CFC6B6}
.ref{font-size:1.4cqw;color:var(--s-gray)}

/* 현장 사진 + 숫자 */
.onsite{display:grid;grid-template-columns:40% 60%}
.onsite .img{position:relative;overflow:hidden}
.onsite .txt{padding:4.5cqw;display:flex;flex-direction:column;justify-content:center;gap:1.4cqw}
.onsite .big{font-size:13cqw;font-weight:900;line-height:1;color:var(--s-cobalt);letter-spacing:-.03em}
.onsite .t{font-size:3cqw;font-weight:900;line-height:1.35}
.onsite .d{font-size:1.9cqw;color:#4A443D;line-height:1.5}

/* 기본 형식 요약 */
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.mini-grid div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.mini-grid b{display:block;margin-bottom:4px}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
th{font-size:13px;color:var(--muted);font-weight:700;text-align:center;background:var(--bg)}
td.c{text-align:center}
.decide{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.decide ol{margin:0;padding-left:20px}
.srcs{font-size:13.5px}
.srcs li{margin-bottom:4px;word-break:break-word}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 겹치기 시안 공통 */
.scrim-l{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,17,15,.9) 0%,rgba(18,17,15,.72) 34%,rgba(18,17,15,.15) 62%,rgba(18,17,15,0) 75%)}
.scrim-b{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,17,15,0) 40%,rgba(18,17,15,.88) 100%)}
.ov-txt{position:absolute;left:5cqw;top:5cqw;width:46cqw;color:var(--s-white);display:flex;flex-direction:column;gap:1.2cqw}
.ov-txt .k{font-size:1.7cqw;font-weight:700;color:#F0C79A;letter-spacing:.04em}
.ov-txt .nm{font-size:5.2cqw;font-weight:900;line-height:1.1}
.ov-txt .sub{font-size:1.8cqw;color:#DCD3C3;line-height:1.5}
.ov-txt .tag{align-self:flex-start;font-size:1.6cqw;font-weight:700;background:var(--s-cobalt);color:#fff;border-radius:99cqw;padding:.6cqw 1.6cqw;margin-top:.8cqw}
.inset{position:absolute;left:5cqw;bottom:4.5cqw;width:30cqw;background:rgba(247,243,234,.96);border-radius:1cqw;padding:1.2cqw 1.4cqw 1cqw;box-shadow:0 1cqw 2.4cqw rgba(0,0,0,.35)}
.inset img{width:100%;display:block}
.inset .lab{font-size:1.3cqw;color:var(--s-ink);font-weight:700;margin-top:.4cqw;display:flex;justify-content:space-between}
.inset .world{position:absolute;right:-6cqw;top:-3cqw;width:13cqw;background:#fff;border-radius:.6cqw;padding:.3cqw;box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.3)}
/* V2 두톤 */
.duo{background:var(--s-cobalt)}
.duo .cover{filter:grayscale(1) contrast(1.15) brightness(1.05);mix-blend-mode:multiply;opacity:.95}
.duo .shape{position:absolute;right:-4cqw;top:6cqw;width:62cqw;opacity:.22}
.duo .ov-txt .k{color:#C9D6FB}
.duo .pinlab{position:absolute;right:16cqw;top:33cqw;display:flex;align-items:center;gap:1cqw;color:#fff;font-size:2cqw;font-weight:800}
.duo .pinlab i{display:block;width:2cqw;height:2cqw;border-radius:50%;background:var(--s-orange);border:.35cqw solid #fff}
/* V3 지도 위 사진 */
.callout .usmap{position:absolute;left:3cqw;top:4cqw;width:68cqw}
.callout .pcard{position:absolute;left:63cqw;top:7cqw;width:33cqw;background:#fff;padding:.8cqw .8cqw 1.4cqw;border-radius:.6cqw;box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.28);transform:rotate(1.5deg)}
.callout .pcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.callout .pcard .c{font-size:1.4cqw;font-weight:700;margin-top:.8cqw;color:var(--s-ink)}
.callout .bot{position:absolute;left:5cqw;bottom:4cqw;right:5cqw;display:flex;justify-content:space-between;align-items:flex-end}
.callout .bot .nm{font-size:4.4cqw;font-weight:900;line-height:1.1}
.callout .bot .sub{font-size:1.7cqw;color:#5A544B;margin-top:.6cqw}
.callout .mini{position:absolute;left:4cqw;top:4cqw;width:15cqw;background:#fff;border-radius:.6cqw;padding:.3cqw;box-shadow:0 .4cqw 1cqw rgba(0,0,0,.12)}
/* 비교 라벨 */
.vlabel{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.rec{background:var(--accent);color:#fff}
/* 키오스크 모음 */
.kgrid{position:absolute;left:4cqw;right:4cqw;top:15cqw;bottom:9cqw;display:grid;grid-template-columns:repeat(5,1fr);gap:1.6cqw}
.kgrid figure{margin:0;display:flex;flex-direction:column;gap:.8cqw;min-height:0}
.kgrid img{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:.8cqw;display:block}
.kgrid span{font-size:1.5cqw;font-weight:700;text-align:center;color:#DCD3C3}
.khead{position:absolute;left:4cqw;top:3.6cqw;right:4cqw}
.khead .t{font-size:3.6cqw;font-weight:900;line-height:1.25}
.khead .k{font-size:1.6cqw;color:#F0C79A;font-weight:700;margin-bottom:.6cqw}
.kfoot{position:absolute;left:4cqw;right:4cqw;bottom:3cqw;font-size:1.25cqw;color:#A79F92}
.story .who{font-size:1.7cqw;color:#F0C79A;font-weight:700}
.story .t{font-size:3.4cqw;font-weight:900;line-height:1.3}
.story .d{font-size:2cqw;line-height:1.6;color:#E6DECF}
.story .ref{color:#B9B0A2}


/* ── 일터나눔 강의안 v2 ── */
.jh-jump{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:6px}
.jh-jump b{font-size:15px}.jh-jump a{font-weight:700}.jh-jump span{font-size:14px;color:var(--muted)}
.jh-head{border-top:3px solid var(--fg);margin-top:40px;padding-top:28px;display:grid;gap:12px}
.jh-part{border-top:1px solid var(--line);padding-block:36px;display:grid;gap:20px}
.jh-part .stagehead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.jh-sub{font-size:15px;font-weight:800;margin:6px 0 -4px;display:flex;gap:8px;align-items:center}
.jh-sub i{font-style:normal;font-size:12px;font-weight:800;color:#fff;background:var(--accent);border-radius:99px;padding:2px 9px}
:root{--t-make:#FFC857;--t-meet:#10B981;--t-keep:#8B5CF6;--t-link:#3B82F6}
/* 진행 막대 */
.jh-prog{position:absolute;left:0;right:0;top:0;height:2.7cqw;display:flex;justify-content:space-between;align-items:center;padding:0 2.2cqw;font-size:1.05cqw;font-weight:700;z-index:5;background:rgba(20,19,17,.62);color:#B9B0A2;letter-spacing:.02em}
.beige .jh-prog{background:#E6DDCC;color:#8A8378}
.jh-prog .pp,.jh-prog .ss{display:flex;gap:.5cqw;align-items:center}
.jh-prog .pp span{padding:.2cqw .7cqw;border-radius:99cqw}
.jh-prog .pp span.on{background:var(--s-cobalt);color:#fff}
.jh-prog .pp span.done{color:#E9E1D2}
.beige .jh-prog .pp span.done{color:#4A443D}
.jh-prog .ss span{width:2.2cqw;height:1.7cqw;display:flex;align-items:center;justify-content:center;border-radius:.3cqw;border:.1cqw solid currentColor;opacity:.7}
.jh-prog .ss span.on{background:#F0C79A;border-color:#F0C79A;color:#22201C;opacity:1}
.beige .jh-prog .ss span.on{background:var(--s-orange);border-color:var(--s-orange);color:#fff}
.jh-prog .ss em{font-style:normal;margin-right:.4cqw;opacity:.8}
/* 지도 카드 */
.jh-mapcard{position:absolute;right:2.4cqw;top:4.4cqw;width:16cqw;background:rgba(251,248,242,.97);border-radius:.8cqw;padding:.6cqw .6cqw .45cqw;box-shadow:0 .8cqw 2cqw rgba(0,0,0,.35)}
.jh-mapcard img{display:block;width:100%}
.jh-mapcard .w{margin-top:.45cqw;border-radius:.4cqw}
.jh-mapcard .lab{font-size:1.15cqw;font-weight:700;color:var(--s-ink);margin-top:.3cqw;line-height:1.3}
/* 배경 사진 위 장 */
.jh-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.35) brightness(.32)}
.jh-bgscrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,17,15,.55),rgba(18,17,15,.85))}
/* 안쪽 틀 */
.jh-in{position:absolute;inset:0;padding:4.6cqw 4.5cqw 3.6cqw;display:flex;flex-direction:column;gap:1.6cqw}
.jh-in .k{font-size:1.65cqw;font-weight:800;color:var(--s-cobalt);letter-spacing:.02em}
.night .jh-in .k{color:#F0C79A}
.jh-in .h{font-size:3.3cqw;font-weight:900;line-height:1.25;text-wrap:balance}
.jh-foot{font-size:1.75cqw;font-weight:800;color:var(--s-cobalt);line-height:1.4}
.night .jh-foot{color:#9DB6F4}
/* 큰 글씨 */
.jh-big{position:absolute;inset:0;padding:6cqw 6cqw 5cqw;display:flex;flex-direction:column;justify-content:flex-end;gap:1.6cqw}
.jh-big .k{font-size:1.8cqw;font-weight:800;color:#F0C79A}
.beige .jh-big .k{color:var(--s-cobalt)}
.jh-big .t{font-size:4.8cqw;font-weight:900;line-height:1.22}
.jh-big .d{font-size:2cqw;line-height:1.55;color:#CFC6B6;max-width:72cqw}
.beige .jh-big .d{color:#5A544B}
/* 블록 형식 1: 상자 */
.jh-cols{display:grid;gap:1.4cqw;flex:1;min-height:0}
.jh-cols>div{border-radius:.8cqw;padding:1.5cqw;display:flex;flex-direction:column;gap:.6cqw;min-width:0;background:#FBF8F2;border:.12cqw solid #DDD3C2}
.night .jh-cols>div{background:rgba(38,36,31,.82);border-color:#4A463F}
.jh-cols .tg{font-size:1.4cqw;font-weight:800;color:var(--s-cobalt)}
.night .jh-cols .tg{color:#F0C79A}
.jh-cols .ti{font-size:2.5cqw;font-weight:900;line-height:1.25}
.jh-cols .tx{font-size:1.8cqw;line-height:1.5;color:#4A443D}
.night .jh-cols .tx{color:#D8CFBF}
.jh-cols>div.hl{background:var(--s-cobalt);border-color:var(--s-cobalt)}
.jh-cols>div.hl *{color:#fff}.jh-cols>div.hl .tg{color:#C9D6FB}
/* 블록 형식 2: 선 (상자 없이 위 선만) */
.jh-lines{display:grid;gap:2.4cqw;flex:1;min-height:0;align-content:start}
.jh-lines>div{border-top:.35cqw solid currentColor;padding-top:1.2cqw;display:flex;flex-direction:column;gap:.7cqw;min-width:0}
.jh-lines .no{font-size:5.4cqw;font-weight:900;line-height:1;color:var(--s-cobalt)}
.night .jh-lines .no{color:#9DB6F4}
.jh-lines .ti{font-size:2.5cqw;font-weight:900;line-height:1.25}
.jh-lines .tx{font-size:1.8cqw;line-height:1.5;color:#4A443D}
.night .jh-lines .tx{color:#D8CFBF}
/* 블록 형식 3: 줄 목록 */

/* 표 */

/* 시간선 */

.jh-tl .y{position:absolute;top:0;left:0;font-size:1.55cqw;font-weight:800;white-space:nowrap}
.jh-tl .v{font-size:2.3cqw;font-weight:900;line-height:1.25}
.jh-tl .on .v{color:#F0C79A}
.jh-tl .x{font-size:1.55cqw;line-height:1.5;color:#B9B0A2;margin-top:.6cqw}
/* 워크지 */
.jh-ws{display:grid;grid-template-columns:1fr 1fr;gap:1.3cqw;flex:1;min-height:0}
.jh-ws>div{background:#fff;border:.15cqw solid #CFC4B1;border-radius:.6cqw;padding:1.3cqw 1.5cqw;display:flex;flex-direction:column;gap:.5cqw;color:var(--s-ink);min-width:0}
.jh-ws .n{font-size:1.45cqw;font-weight:800;color:var(--s-cobalt)}
.jh-ws .b{font-size:2cqw;font-weight:800;line-height:1.35}
.jh-ws .s{font-size:1.65cqw;color:#5A544B;line-height:1.5}
.jh-ws .ln{display:inline-block;border-bottom:.15cqw solid #22201C;min-width:11cqw;height:2cqw;vertical-align:bottom}
.jh-dots{display:inline-flex;gap:.6cqw}
.jh-dots i{width:2.5cqw;height:2.5cqw;border-radius:50%;border:.15cqw solid #8A8378;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:1.2cqw;color:#8A8378;font-weight:700}
.jh-dots i.on{background:var(--s-cobalt);border-color:var(--s-cobalt);color:#fff}
.jh-q{display:grid;gap:1.6cqw}
.jh-q>div{border:.2cqw solid #4A463F;border-radius:.8cqw;padding:1.6cqw;font-size:2.8cqw;font-weight:900;text-align:center;line-height:1.25}
/* 유형 색 띠 */
.jh-tband{position:absolute;left:0;top:2.7cqw;bottom:0;width:1.1cqw}
.person .face{position:relative}
.jh-part .person{grid-template-rows:minmax(0,1fr)}
.jh-part .person .txt{gap:.9cqw;padding:5cqw 3.8cqw 2.8cqw!important;min-height:0}

.jh-part .person .who{font-size:1.5cqw}
.jh-part .person .yrs{font-size:1.65cqw;line-height:1.4}
.jh-part .person .quote{font-size:1.7cqw;line-height:1.45;margin-top:auto}

/* 사진 모음 */
.jh-grid4{position:absolute;left:4cqw;right:4cqw;top:15cqw;bottom:7.5cqw;display:grid;grid-template-columns:repeat(4,1fr);gap:1.8cqw}

.jh-grid4 span{font-size:1.55cqw;font-weight:800;text-align:center;color:#E9E1D2;line-height:1.35;border-top:.5cqw solid;padding-top:.6cqw}
.jh-grid4 span i{display:block;font-style:normal;font-weight:500;color:#A79F92;font-size:1.25cqw}
/* 단어 카드 */
.jh-word{display:grid;grid-template-columns:40% 60%}
.jh-word .pic{position:relative;overflow:hidden;background:#E6DDCC}
.jh-word .pic svg{position:absolute;inset:0;width:100%;height:100%}
.jh-word .txt{padding:5.2cqw 4.5cqw 3.5cqw;display:flex;flex-direction:column;gap:1.3cqw}
.jh-word .lbl{font-size:1.6cqw;font-weight:800;color:var(--s-orange);letter-spacing:.04em}
.jh-word .w{font-size:6cqw;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.jh-word .m{font-size:2.7cqw;font-weight:800;line-height:1.4}
.jh-word .e{font-size:2.05cqw;line-height:1.55;color:#4A443D;border-top:.12cqw solid #CFC4B1;padding-top:1.2cqw}
.jh-word .e b{color:var(--s-cobalt)}
.jh-words{position:absolute;left:4cqw;right:4cqw;top:12.5cqw;bottom:4cqw;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:1.4cqw}
.jh-words>div{position:relative;border-radius:.8cqw;overflow:hidden;background:#2A2824}
.jh-words img,.jh-words svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.jh-words b{position:absolute;left:1cqw;right:1cqw;bottom:.9cqw;font-size:2cqw;font-weight:900;color:#fff;line-height:1.2}
.jh-words small{position:absolute;left:1cqw;top:.8cqw;font-size:1.2cqw;font-weight:800;color:#F0C79A}
/* 강의 지도 */
.jh-map{display:grid;grid-template-columns:9cqw repeat(4,1fr);gap:.5cqw;flex:1;min-height:0;font-size:1.32cqw;line-height:1.35}

.jh-map>div.dg{background:#E3E9F8;font-weight:700}
/* 조합표 */
.jh-mx{display:grid;grid-template-columns:12cqw repeat(4,1fr);gap:.5cqw;flex:1;min-height:0}
.jh-mx>div{border-radius:.5cqw;padding:.75cqw .85cqw;font-size:1.42cqw;line-height:1.38;display:flex;align-items:center;min-width:0;background:#FBF8F2;color:#22201C}
.jh-mx>div.hd{font-weight:900;font-size:1.6cqw;justify-content:center;text-align:center;background:transparent;color:#E9E1D2}
.jh-mx>div.rh{font-weight:900;font-size:1.6cqw;color:#22201C}
.jh-mx>div.best{background:#E3E9F8;font-weight:800}
/* 4단 표시 */
.jh-stage{display:inline-flex;gap:6px;flex-wrap:wrap}
.jh-stage span{font-size:12.5px;font-weight:800;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}

/* ── 제주고 면접 연습 v3 (순서 실습형) ── */
.slide.js{aspect-ratio:16/9;container-type:inline-size;position:relative;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;word-break:keep-all;
  --ink:#22201C;--beige:#F2EBDD;--paper:#FBF8F2;--cob:#1F4FCC;--ora:#C2512A;--grn:#2E8B57;--sand:#E6DDCC;--night:#1A1917}
.slide.js.beige{background:var(--beige);color:var(--ink)}
.slide.js.night{background:var(--night);color:#F7F3EA}

.slide.js .ic{display:block;width:100%;height:100%}
.js-no{position:absolute;right:1.6cqw;bottom:1.1cqw;font-size:1.15cqw;font-weight:700;opacity:.5}

.js-bar span.done{opacity:.85}
.js-bar span.on{background:var(--cob);color:#fff;opacity:1}
.cobalt .js-bar span.on{background:#fff;color:var(--cob)}
.js-in{position:absolute;inset:0;padding:5.2cqw 4.4cqw 3.4cqw;display:flex;flex-direction:column;gap:1.6cqw}
.js-in .k,.js-q1 .k,.js-ask .k,.js-say .k,.js-sig .k,.js-live .k,.js-hero .k,.js-split .k{font-size:1.75cqw;font-weight:800;color:var(--cob);letter-spacing:.02em}
.night .k,.cobalt .k{color:#F0C79A!important}
.js-in .h{font-size:3.6cqw;font-weight:900;line-height:1.2}
.js-card{background:#fff;border-radius:1.2cqw;overflow:hidden;display:flex;flex-direction:column;color:var(--ink);box-shadow:0 .25cqw .9cqw rgba(0,0,0,.12);min-width:0;min-height:0;position:relative}
.js-card .ph{flex:1 1 0;min-height:0;background-size:cover;background-color:var(--sand)}
.js-card .ph.dr{background:var(--beige);padding:1.4cqw;display:flex;align-items:center;justify-content:center}
.js-card .ph.dr svg{max-height:100%;width:auto;max-width:100%}
.js-card b{font-size:2.1cqw;font-weight:900;padding:1cqw 1.2cqw;text-align:center;line-height:1.25}
.js-card small{font-size:1.45cqw;color:#5A544B;text-align:center;padding:0 1cqw 1cqw;margin-top:-.6cqw}
.js-card.o{outline:.45cqw solid var(--grn)}.js-card.x{outline:.45cqw solid var(--ora)}
.js-card.stamp::after{position:absolute;top:1cqw;right:1cqw;width:7cqw;height:7cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:5cqw;font-weight:900;line-height:1;color:#fff}

.js-card.x.stamp .ph{filter:grayscale(.55)}
.js-card.q .ph.dr{padding:2.4cqw}
.js-grid{flex:1;display:grid;gap:1.6cqw;min-height:0;grid-template-rows:minmax(0,1fr)}
.js-grid.c2{grid-template-columns:repeat(2,1fr)}.js-grid.c3{grid-template-columns:repeat(3,1fr)}.js-grid.c4{grid-template-columns:repeat(4,1fr)}

.js-grid.r2 .js-card b{font-size:1.8cqw;padding:.7cqw}

.js-do{align-self:flex-start;display:flex;align-items:center;gap:1.2cqw;font-size:2cqw;font-weight:800;background:var(--ink);color:#fff;border-radius:99cqw;padding:.7cqw 2cqw .7cqw .7cqw}
.js-do span{background:var(--ora);border-radius:99cqw;padding:.4cqw 1.2cqw;font-size:1.6cqw}
.night .js-do,.cobalt .js-do{background:#fff;color:var(--ink)}
.js-order{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3cqw;min-height:0}
.js-order>div{display:flex;flex-direction:column;gap:1cqw;min-height:0}

.js-hero{position:absolute;inset:0}.js-hero>.ph,.js-split>.ph{position:absolute;inset:0;background-size:cover}

.js-q1{position:absolute;inset:0;padding:5.4cqw 4.4cqw 3.6cqw;display:grid;grid-template-columns:52% 1fr;gap:4cqw}
.js-q1 .big{display:flex;min-height:0}.js-q1 .big .js-card{flex:1}.js-q1 .big .js-card b{font-size:3cqw}
.js-q1 .side{display:flex;flex-direction:column;justify-content:center;gap:2cqw}
.js-q1 .t{font-size:4.4cqw;font-weight:900;line-height:1.25}.js-q1 .t.sm{font-size:3.4cqw}
.js-q1 .d{font-size:2.2cqw;color:#5A544B}.cobalt .js-q1 .d{color:#DCE4FB}
.js-q1 .arms{display:flex;gap:2cqw;height:15cqw}.js-q1 .arms>div{flex:1;position:relative;background:#fff;border-radius:1cqw;padding:.8cqw}

.js-q1 .ans{font-size:14cqw;font-weight:900;line-height:1}.js-q1 .ans.o{color:var(--grn)}.js-q1 .ans.x{color:var(--ora)}
.js-q1 .steps{display:flex;gap:1cqw}.js-q1 .steps i{font-style:normal;width:4.6cqw;height:4.6cqw;border-radius:50%;border:.3cqw solid currentColor;display:flex;align-items:center;justify-content:center;font-size:2.2cqw;font-weight:900;opacity:.4}
.js-q1 .steps i.on{opacity:1;background:var(--cob);border-color:var(--cob);color:#fff}
.cobalt .js-q1 .steps i.on{background:#fff;color:var(--cob);border-color:#fff}
.js-card.tall .ph.dr{padding:2cqw}
.js-say{position:absolute;inset:0;padding:6cqw;display:flex;flex-direction:column;justify-content:center;gap:2cqw}
.js-say .t{font-size:10cqw;font-weight:900;line-height:1.1;letter-spacing:.02em}.js-say .t.sm{font-size:5.4cqw;line-height:1.25;letter-spacing:0}

.js-say .cnt{display:flex;gap:2cqw}.js-say .cnt i{font-style:normal;width:7cqw;height:7cqw;border-radius:50%;border:.4cqw solid #F0C79A;display:flex;align-items:center;justify-content:center;font-size:3.6cqw;font-weight:900}

.js-me .k{font-size:1.75cqw;font-weight:800;color:var(--cob)}

<script>
(function(){
