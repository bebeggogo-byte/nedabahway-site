<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>발표 점수 결과 — 중등부</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{ --bg:#fbf7ee; --ink:#1A1A1A; --sub:#7a6f5f; --accent:#a4541a; --accent-bg:#fef0e2; --line:#E2E8F0; --ok:#16a34a; }
  *{box-sizing:border-box;}
  body{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;}
  .wrap{max-width:760px;margin:0 auto;padding:26px 18px 90px;}
  .event{color:var(--accent);font-size:12.5px;font-weight:800;letter-spacing:.02em;margin:0 0 6px;}
  h1{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:700;margin-bottom:20px;}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .stats{display:flex;gap:12px;margin-bottom:22px;}
  .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;}
  .stat .n{font-size:26px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
  .stat .l{font-size:12px;color:var(--sub);margin-top:7px;}
  .rank-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid #f4efe3;}
  .rank-row:last-child{border-bottom:none;}
  .rank-no{width:30px;font-size:16px;font-weight:800;color:var(--sub);text-align:center;flex-shrink:0;font-variant-numeric:tabular-nums;padding-top:2px;}
  .rank-row.top .rank-no{color:var(--accent);}
  .rank-main{flex:1;min-width:0;}
  .rank-name{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;}
  .rank-name .cnt{font-size:11.5px;color:var(--sub);font-weight:600;margin-left:7px;}
  .rank-bar{height:10px;background:#f1ecdf;border-radius:999px;overflow:hidden;}
  .rank-bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s;}
  .rank-row.top .rank-bar>i{background:linear-gradient(90deg,#c2691f,#a4541a);}
  .breakdown{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .bd{font-size:11px;background:#f4efe3;color:var(--sub);padding:3px 9px;border-radius:999px;}
  .bd b{color:var(--accent);}
  .rank-val{font-size:22px;font-weight:800;width:78px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;padding-top:2px;}
  .rank-val small{font-size:11px;color:var(--sub);font-weight:600;display:block;margin-top:1px;}
  .msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13.5px;color:var(--sub);line-height:1.7;}
  .msg.err{background:#fef2f2;border-color:#fecaca;color:#b91c1c;}
  .foot{margin-top:20px;text-align:center;}
  .btn{padding:11px 18px;font-size:13.5px;font-weight:700;font-family:inherit;border:1px solid var(--accent);border-radius:9px;background:#fff;color:var(--accent);cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="event" id="eventLabel">2026 전도학생회장단 리더십 캠프</div>
  <h1>발표 점수 결과 — 조별 순위</h1>
  <div class="live"><span class="dot"></span>실시간 자동 갱신 · 100점 만점 환산 평균순</div>
  <div class="stats">
    <div class="stat"><div class="n" id="stJudges">0</div><div class="l">채점 인원</div></div>
    <div class="stat"><div class="n" id="stEvals">0</div><div class="l">완료된 채점 수</div></div>
    <div class="stat"><div class="n" id="stLead">—</div><div class="l">현재 1위</div></div>
  </div>
  <div id="ranking"><div class="msg">불러오는 중…</div></div>
  <div class="foot"><button class="btn" id="csvBtn">CSV로 저장</button></div>
</div>

<script src="/assets/js/supabase-config.js" onerror="console.warn('supabase-config.js missing')"></script>
<script type="module">
import { sb } from '/assets/js/supabase-client.js';
import { getRound, CRITERIA, MAX_TOTAL } from '/assets/js/ms-data.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round = getRound();
const TEAMS = round.teams;
let lastRanked = [];
$('eventLabel').textContent = `2026 전도학생회장단 리더십 캠프 · 중등부 ${round.label}`;

function isComplete(row){ return CRITERIA.every(c => typeof row[c.key]==='number'); }
function rowTotal(row){ return CRITERIA.reduce((s,c)=> s+(row[c.key]||0), 0); }

async function load(){
  let rows;
  try {
    const cols='judge_uuid,team,'+CRITERIA.map(c=>c.key).join(',');
    const { data, error } = await sb.from('ms_scores').select(cols).eq('round', round.key).limit(10000);
    if(error) throw error; rows=data||[];
  } catch(e){
    const hint=/relation|does not exist|column|schema/i.test(e.message||'') ? '아직 채점 표(ms_scores)가 준비되지 않았습니다. 진행자에게 문의하세요.' : ('결과를 불러오지 못했습니다: '+esc(e.message||e));
    $('ranking').innerHTML=`<div class="msg err">${hint}</div>`; return;
  }
  const agg={}; TEAMS.forEach(t=>{ agg[t]={totalSum:0,n:0,crit:Object.fromEntries(CRITERIA.map(c=>[c.key,{s:0,n:0}]))}; });
  const judges=new Set(); let evals=0;
  rows.forEach(r => {
    judges.add(r.judge_uuid); if(!(r.team in agg)) return;
    CRITERIA.forEach(c=>{ if(typeof r[c.key]==='number'){ agg[r.team].crit[c.key].s+=r[c.key]; agg[r.team].crit[c.key].n++; } });
    if(isComplete(r)){ agg[r.team].totalSum+=rowTotal(r); agg[r.team].n++; evals++; }
  });
  $('stJudges').textContent=judges.size; $('stEvals').textContent=evals;
  const ranked=TEAMS.map(t=>{ const a=agg[t]; return { name:t, avg:a.n?a.totalSum/a.n:0, count:a.n, crit:CRITERIA.map(c=>({label:c.label, avg:a.crit[c.key].n?a.crit[c.key].s/a.crit[c.key].n:null})) }; }).sort((x,y)=>y.avg-x.avg||y.count-x.count);
  lastRanked=ranked;
  $('stLead').textContent = ranked[0].count>0 ? ranked[0].name : '—';
  $('ranking').innerHTML = ranked.map((r,i)=>{
    const pct=r.count?Math.round((r.avg/MAX_TOTAL)*100):0;
    const top=r.count>0 && r.avg===ranked[0].avg;
    const bd=r.crit.map(c=>`<span class="bd">${esc(c.label)} <b>${c.avg==null?'-':(c.avg*10).toFixed(1)}</b></span>`).join('');
    return `<div class="rank-row ${top?'top':''}"><div class="rank-no">${(r.count>0&&i<3)?['🥇','🥈','🥉'][i]:(i+1)}</div>
      <div class="rank-main"><div class="rank-name">${esc(r.name)}<span class="cnt">${r.count}명 완료</span></div>
        <div class="rank-bar"><i style="width:${pct}%"></i></div><div class="breakdown">${bd}</div></div>
      <div class="rank-val">${r.count?(r.avg/MAX_TOTAL*100).toFixed(1):'-'}<small>/ 100점</small></div></div>`;
  }).join('');
}
$('csvBtn').addEventListener('click', () => {
  const head=['순위','조','평균(100점)','완료인원', ...CRITERIA.map(c=>c.label+' 평균(100점)')];
  let csv='﻿'+head.join(',')+'\n';
  lastRanked.forEach((r,i)=>{ const cols=[i+1,`"${r.name}"`, r.count?(r.avg/MAX_TOTAL*100).toFixed(2):'', r.count, ...r.crit.map(c=>c.avg==null?'':(c.avg*10).toFixed(2))]; csv+=cols.join(',')+'\n'; });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`presentation-scores-${round.key}.csv`; a.click(); URL.revokeObjectURL(a.href);
});
sb.channel('ms-scores-'+round.key).on('postgres_changes', { event:'*', schema:'public', table:'ms_scores' }, load).subscribe();
load();
</script>
</body>
</html>
