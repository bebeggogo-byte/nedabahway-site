<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="조직 자동화 9선 — 누구나 30분">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a322a"/>
      <stop offset="100%" stop-color="#1f1a14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 좌측 색띠 -->
  <rect x="0" y="0" width="14" height="630" fill="url(#acc)"/>

  <!-- 카테고리 라벨 -->
  <text x="80" y="120" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#d97706">RESOURCE · AUTOMATION COURSE</text>

  <!-- 메인 타이틀 -->
  <text x="80" y="240" font-family="'Noto Serif KR','Nanum Myeongjo',serif" font-size="92" font-weight="700" fill="#fbf6ec">조직 자동화 9선</text>
  <text x="80" y="320" font-family="'Noto Serif KR','Nanum Myeongjo',serif" font-size="44" font-weight="400" fill="#e5d8c4">기획·HR·마케팅 — 누구나 30분</text>

  <!-- 9개 카테고리 칩 -->
  <g font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="22" font-weight="600">
    <g transform="translate(80,400)">
      <rect width="112" height="44" rx="22" fill="#7a5a1f"/>
      <text x="56" y="29" text-anchor="middle" fill="#fbf6ec">기획 · 3</text>
    </g>
    <g transform="translate(208,400)">
      <rect width="112" height="44" rx="22" fill="#8a3f2d"/>
      <text x="56" y="29" text-anchor="middle" fill="#fbf6ec">HR · 3</text>
    </g>
    <g transform="translate(336,400)">
      <rect width="140" height="44" rx="22" fill="#3f6b46"/>
      <text x="70" y="29" text-anchor="middle" fill="#fbf6ec">마케팅 · 3</text>
    </g>
  </g>

  <!-- 효과 한 줄 -->
  <text x="80" y="500" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="26" font-weight="500" fill="#cbb89c">완성 코드 · 시트 템플릿 · 트러블슈팅 — 모두 무료 공개</text>

  <!-- 강의자 -->
  <g transform="translate(80,560)">
    <text x="0" y="22" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#fbf6ec">김창환</text>
    <text x="64" y="22" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#a89682">· 네다바웨이 · nedabah.org</text>
  </g>

  <!-- 우측 큰 9 -->
  <text x="1100" y="450" text-anchor="end" font-family="'Noto Serif KR',serif" font-size="380" font-weight="800" fill="#b45309" opacity="0.18">9</text>

  <!-- 우측 보조 표식 -->
  <g transform="translate(960,560)" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="16" fill="#a89682" letter-spacing="2">
    <text x="0" y="0">월 0원 · Apps Script · Gemini · Slack</text>
  </g>
</svg>
