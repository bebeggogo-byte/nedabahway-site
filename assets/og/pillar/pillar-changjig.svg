<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#efe7d6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf3"/>
      <stop offset="100%" stop-color="#f7f3ec"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Top cobalt bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#1E40AF"/>
  <!-- Card -->
  <rect x="72" y="96" width="760" height="450" rx="8" fill="url(#card)" stroke="#d8cdb8" stroke-width="1"/>
  <!-- Card left cobalt accent -->
  <rect x="72" y="96" width="5" height="450" rx="2" fill="#1E40AF"/>
  <!-- Wordmark -->
  <text x="104" y="144" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1E40AF" letter-spacing="2">네다바웨이</text>
  <!-- Pillar badge -->
  <rect x="104" y="158" width="110" height="28" rx="3" fill="#1E40AF"/>
  <text x="113" y="177" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#fdfaf3" letter-spacing="1">★ 필라</text>
  <!-- Category label -->
  <text x="222" y="177" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#6b6155" letter-spacing="0.5">창직 · 1인 사업 · STARCP</text>
  <!-- Main headline line 1 -->
  <text x="104" y="252" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="64" font-weight="800" fill="#1E40AF">창직</text>
  <!-- Main headline line 2 -->
  <text x="104" y="308" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="40" font-weight="800" fill="#2a241c">아이디어는 있는데</text>
  <!-- Main headline line 3 -->
  <text x="104" y="354" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="40" font-weight="800" fill="#2a241c">첫 고객이 없을 때</text>
  <!-- Divider -->
  <line x1="104" y1="386" x2="340" y2="386" stroke="#1E40AF" stroke-width="1.5" opacity="0.35"/>
  <!-- Value prop -->
  <text x="104" y="416" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="400" fill="#5a5048">STARCP + 린 캔버스로 첫 고객 5명을 만드는 12주</text>
  <!-- Footer -->
  <text x="104" y="506" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#8a7a64">nedabah.org · 네다바웨이</text>
  <!-- Right decorative — large faint letter -->
  <text x="855" y="430" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="210" font-weight="800" fill="#1E40AF" opacity="0.04">C</text>
  <!-- Right decorative lines -->
  <line x1="856" y1="196" x2="1110" y2="196" stroke="#1E40AF" stroke-width="1" opacity="0.12"/>
  <line x1="856" y1="430" x2="1110" y2="430" stroke="#1E40AF" stroke-width="1" opacity="0.12"/>
  <!-- Dot grid top-right -->
  <circle cx="960" cy="240" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="1000" cy="240" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="1040" cy="240" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="1080" cy="240" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="960" cy="280" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="1000" cy="280" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="1040" cy="280" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="1080" cy="280" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="960" cy="320" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="1000" cy="320" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="1040" cy="320" r="3.5" fill="#1E40AF" opacity="0.09"/>
  <circle cx="1080" cy="320" r="3.5" fill="#1E40AF" opacity="0.09"/>
</svg>
