<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#efe7d6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Top cobalt bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#1E40AF"/>
  <!-- Left accent bar -->
  <rect x="72" y="120" width="4" height="340" fill="#1E40AF" opacity="0.18"/>
  <!-- Wordmark -->
  <text x="96" y="168" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#1E40AF" letter-spacing="3">네다바웨이</text>
  <text x="96" y="192" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8a7a64" letter-spacing="1">NEDABAHWAY</text>
  <!-- Main headline line 1 -->
  <text x="96" y="296" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="72" font-weight="800" fill="#2a241c">직업의 속성은 <tspan fill="#1E40AF">이타성</tspan>이다.</text>
  <!-- Main headline line 2 -->
  <text x="96" y="386" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="40" font-weight="600" fill="#3a322a">한 사람의 일을 다시 디자인합니다.</text>
  <!-- Sub caption -->
  <text x="96" y="462" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#6b6155">5개 코칭 프로그램 · 제주 중·고교 99% 출강</text>
  <!-- Divider -->
  <line x1="96" y1="508" x2="280" y2="508" stroke="#1E40AF" stroke-width="2" opacity="0.4"/>
  <!-- Footer -->
  <text x="96" y="540" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="400" fill="#8a7a64">nedabah.org · 김창환 · 네다바웨이</text>
  <!-- Decorative cobalt dot grid — top right -->
