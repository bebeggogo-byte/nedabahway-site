<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- left bar -->
  <rect x="0" y="0" width="12" height="630" fill="url(#accent)"/>

  <!-- kicker -->
  <text x="80" y="120" font-family="-apple-system, 'SF Pro Text', 'Pretendard', sans-serif"
        font-size="22" font-weight="700" letter-spacing="6" fill="#4f46e5">
    AI WORKSHOP · 에이전트 작업실
  </text>

  <!-- title -->
  <text x="80" y="220" font-family="-apple-system, 'SF Pro Text', 'Pretendard', sans-serif"
        font-size="76" font-weight="800" letter-spacing="-3" fill="#0a0a0a">
    한 사람의 일을
  </text>
  <text x="80" y="310" font-family="-apple-system, 'SF Pro Text', 'Pretendard', sans-serif"
        font-size="76" font-weight="800" letter-spacing="-3" fill="#0a0a0a">
    <tspan fill="#4f46e5">같이 굴리는</tspan> 5개 블럭
  </text>

  <!-- 5 blocks -->
  <g font-family="-apple-system, 'SF Pro Text', 'Pretendard', sans-serif" font-size="22" font-weight="700">
    <g transform="translate(80, 400)">
      <rect width="200" height="80" rx="14" fill="#e0f2fe"/>
      <text x="20" y="34" fill="#0ea5e9">①</text>
      <text x="20" y="62" fill="#0a0a0a" font-size="18">강의 시뮬레이터</text>
    </g>
    <g transform="translate(300, 400)">
      <rect width="200" height="80" rx="14" fill="#fef3c7"/>
      <text x="20" y="34" fill="#b45309">②</text>
      <text x="20" y="62" fill="#0a0a0a" font-size="18">진로 코칭 IDEN</text>
    </g>
    <g transform="translate(520, 400)">
      <rect width="200" height="80" rx="14" fill="#ede9fe"/>
      <text x="20" y="34" fill="#8b5cf6">③</text>
      <text x="20" y="62" fill="#0a0a0a" font-size="18">5S 자가 진단</text>
    </g>
    <g transform="translate(740, 400)">
      <rect width="200" height="80" rx="14" fill="#fee2e2"/>
      <text x="20" y="34" fill="#dc2626">④</text>
      <text x="20" y="62" fill="#0a0a0a" font-size="18">AI 글 게이트</text>
    </g>
    <g transform="translate(960, 400)">
      <rect width="160" height="80" rx="14" fill="#E8F2EC"/>
      <text x="20" y="34" fill="#10803D">⑤</text>
      <text x="20" y="62" fill="#0a0a0a" font-size="18">SBM 묵상</text>
    </g>
  </g>

  <!-- footer -->
  <text x="80" y="560" font-family="-apple-system, 'SF Pro Text', 'Pretendard', sans-serif"
        font-size="20" font-weight="500" fill="#1f1f23">
    네다바웨이 · 김창환 직업본질연구원 · nedabah.org/ai.html
  </text>
  <text x="80" y="590" font-family="-apple-system, 'SF Pro Text', 'Pretendard', sans-serif"
        font-size="16" fill="#6b7280">
    1인 자율 시스템 · 60+ 에이전트 · 직업의 이타성
  </text>
</svg>
