<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#efe7d6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf3"/>
      <stop offset="100%" stop-color="#f7f3ec"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Top cobalt bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#1E40AF"/>
  <!-- Card -->
  <rect x="72" y="100" width="740" height="440" rx="8" fill="url(#card)" stroke="#d8cdb8" stroke-width="1"/>
  <!-- Card left cobalt accent -->
  <rect x="72" y="100" width="5" height="440" rx="2" fill="#1E40AF"/>
  <!-- Wordmark -->
  <text x="104" y="150" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1E40AF" letter-spacing="2">네다바웨이</text>
  <!-- Program badge -->
  <rect x="104" y="166" width="250" height="30" rx="3" fill="#1E40AF"/>
  <text x="114" y="186" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#fdfaf3" letter-spacing="1">임원·중간관리자 리더십 코칭</text>
  <!-- Program name -->
  <text x="104" y="256" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="64" font-weight="800" fill="#1E40AF" letter-spacing="-2">5S 리더십</text>
  <text x="104" y="304" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="28" font-weight="700" fill="#2a241c">마스터 코칭</text>
  <!-- 5S labels row -->
  <text x="104" y="348" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="500" fill="#1E40AF" opacity="0.7">See · Speak · Sense · Steer · Sustain</text>
  <!-- Value prop -->
  <text x="104" y="390" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" font-weight="500" fill="#3a322a">5S 자기 진단 + 팀 1on1 가이드 + 90일 로드맵.</text>
  <text x="104" y="422" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" font-weight="500" fill="#3a322a">다음 주 월요일부터 쓸 수 있는 매뉴얼.</text>
  <!-- Divider -->
  <line x1="104" y1="448" x2="320" y2="448" stroke="#1E40AF" stroke-width="1.5" opacity="0.35"/>
  <!-- Details row -->
  <text x="104" y="478" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#6b6155">1:1 · 6개월 · 600만원</text>
  <!-- Footer -->
  <text x="104" y="516" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" fill="#8a7a64">nedabah.org/p/5s-leadership</text>
  <!-- Right side — 5S cycle visual -->
  <text x="840" y="400" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="200" font-weight="800" fill="#1E40AF" opacity="0.05">5</text>
  <!-- Rank label -->
  <text x="896" y="180" font-family="'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#1E40AF" opacity="0.5">프로그램 5</text>
  <!-- Right decorative lines -->
  <line x1="860" y1="200" x2="1100" y2="200" stroke="#1E40AF" stroke-width="1" opacity="0.12"/>
  <line x1="860" y1="420" x2="1100" y2="420" stroke="#1E40AF" stroke-width="1" opacity="0.12"/>
</svg>
